<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" data-generator="fireworks-tech-graph" data-quality-profile="showcase"><style>text{font-family:'Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#2563eb"/></marker></defs><rect width="1200" height="780" fill="#ffffff"/><text x="40" y="48" font-size="30" fill="#111827" text-anchor="start">一个 token 如何经过 MoE 层？</text><text x="40" y="82" font-size="18" fill="#6b7280" text-anchor="start">教学例子：4 个路由专家、Top-2；权重仅作示意，省略共享专家和残差。</text><g id="hidden"><rect data-graph-role="node" id="hidden-box" x="450" y="110" width="300" height="80" rx="8" fill="#eff6ff" stroke="#d1d5db" stroke-width="2"/><text x="600" y="145" font-size="23" fill="#111827" text-anchor="middle">当前 token 的表示 h</text><text x="600" y="175" font-size="17" fill="#6b7280" text-anchor="middle">包含前面层处理过的信息</text></g><g id="router"><rect data-graph-role="node" id="router-box" x="450" y="245" width="300" height="80" rx="8" fill="#eff6ff" stroke="#d1d5db" stroke-width="2"/><text x="600" y="280" font-size="23" fill="#111827" text-anchor="middle">Router：选 Top-2</text><text x="600" y="310" font-size="17" fill="#6b7280" text-anchor="middle">本次选择专家 2 和专家 3</text></g><path id="h-router" data-graph-role="edge" d="M600 190V245" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><g id="expert1"><rect data-graph-role="node" id="expert1-box" x="70" y="430" width="220" height="90" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/><text x="180" y="465" font-size="23" fill="#111827" text-anchor="middle">专家 1</text><text x="180" y="495" font-size="17" fill="#6b7280" text-anchor="middle">本次不计算</text></g><g id="expert2"><rect data-graph-role="node" id="expert2-box" x="350" y="430" width="220" height="90" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="460" y="465" font-size="23" fill="#111827" text-anchor="middle">专家 2</text><text x="460" y="495" font-size="17" fill="#6b7280" text-anchor="middle">计算 E₂(h)</text></g><g id="expert3"><rect data-graph-role="node" id="expert3-box" x="630" y="430" width="220" height="90" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="740" y="465" font-size="23" fill="#111827" text-anchor="middle">专家 3</text><text x="740" y="495" font-size="17" fill="#6b7280" text-anchor="middle">计算 E₃(h)</text></g><g id="expert4"><rect data-graph-role="node" id="expert4-box" x="910" y="430" width="220" height="90" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/><text x="1020" y="465" font-size="23" fill="#111827" text-anchor="middle">专家 4</text><text x="1020" y="495" font-size="17" fill="#6b7280" text-anchor="middle">本次不计算</text></g><path id="to-e2" data-graph-role="edge" d="M555 325V380H460V430" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path id="to-e3" data-graph-role="edge" d="M645 325V380H740V430" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><g id="combine"><rect data-graph-role="node" id="combine-box" x="450" y="625" width="300" height="80" rx="8" fill="#f0fdf4" stroke="#d1d5db" stroke-width="2"/><text x="600" y="660" font-size="23" fill="#111827" text-anchor="middle">加权合并</text><text x="600" y="690" font-size="17" fill="#6b7280" text-anchor="middle">y = 0.6 E₂(h) + 0.4 E₃(h)</text></g><path id="from-e2" data-graph-role="edge" d="M460 520V570H555V625" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path id="from-e3" data-graph-role="edge" d="M740 520V570H645V625" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="385" y="595" font-size="18" fill="#2563eb" text-anchor="start">权重 0.6</text><text x="720" y="595" font-size="18" fill="#2563eb" text-anchor="start">权重 0.4</text><text x="40" y="750" font-size="18" fill="#6b7280" text-anchor="start">选择按 token、按层发生：换一个 token 或进入另一层，选中的专家都可能改变。</text></svg>