<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" data-generator="fireworks-tech-graph" data-quality-profile="showcase"><style>text{font-family:'Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#2563eb"/></marker></defs><rect width="1200" height="640" fill="#ffffff"/><text x="40" y="48" font-size="30" fill="#111827" text-anchor="start">从模型结构到 EP：专家放在哪里？</text><text x="40" y="82" font-size="18" fill="#6b7280" text-anchor="start">简化的两卡 EP 示意：只画 MoE 专家部分，省略 Attention、共享专家和并行组细节。</text><g id="ep-in"><rect data-graph-role="node" id="ep-in-box" x="40" y="250" width="230" height="90" rx="8" fill="#eff6ff" stroke="#d1d5db" stroke-width="2"/><text x="155" y="285" font-size="23" fill="#111827" text-anchor="middle">输入表示 h</text><text x="155" y="315" font-size="17" fill="#6b7280" text-anchor="middle">待处理的 token 向量</text></g><g id="dispatch"><rect data-graph-role="node" id="dispatch-box" x="340" y="250" width="220" height="90" rx="8" fill="#eff6ff" stroke="#d1d5db" stroke-width="2"/><text x="450" y="285" font-size="23" fill="#111827" text-anchor="middle">Dispatch</text><text x="450" y="315" font-size="17" fill="#6b7280" text-anchor="middle">按目标专家分发</text></g><g id="npu0"><rect data-graph-role="node" id="npu0-box" x="650" y="130" width="240" height="110" rx="8" fill="#eff6ff" stroke="#d1d5db" stroke-width="2"/><text x="770" y="165" font-size="23" fill="#111827" text-anchor="middle">NPU 0：专家 1、2</text><text x="770" y="195" font-size="17" fill="#6b7280" text-anchor="middle">本次专家 2 计算</text></g><g id="npu1"><rect data-graph-role="node" id="npu1-box" x="650" y="410" width="240" height="110" rx="8" fill="#eff6ff" stroke="#d1d5db" stroke-width="2"/><text x="770" y="445" font-size="23" fill="#111827" text-anchor="middle">NPU 1：专家 3、4</text><text x="770" y="475" font-size="17" fill="#6b7280" text-anchor="middle">本次专家 3 计算</text></g><g id="ep-combine"><rect data-graph-role="node" id="ep-combine-box" x="980" y="250" width="180" height="90" rx="8" fill="#f0fdf4" stroke="#d1d5db" stroke-width="2"/><text x="1070" y="285" font-size="23" fill="#111827" text-anchor="middle">Combine</text><text x="1070" y="315" font-size="17" fill="#6b7280" text-anchor="middle">归位、加权合并</text></g><path id="ep-start" data-graph-role="edge" d="M270 295H340" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path id="ep-d0" data-graph-role="edge" d="M560 275H600V185H650" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path id="ep-d1" data-graph-role="edge" d="M560 315H620V465H650" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path id="ep-c0" data-graph-role="edge" d="M890 185H930V275H980" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path id="ep-c1" data-graph-role="edge" d="M890 465H950V315H980" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="650" y="105" font-size="19" fill="#6b7280" text-anchor="start">专家权重放在不同卡上</text><text x="40" y="565" font-size="22" fill="#111827" text-anchor="start">跨卡传递的是 token 的隐藏向量与计算结果，模型权重通常留在专家所在的卡上。</text><text x="40" y="610" font-size="18" fill="#6b7280" text-anchor="start">通信后端完成必要的数据交换；路由不均衡时，部分卡更忙，其他卡可能等待。</text></svg>