<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1200" height="640" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">从网页到训练语料</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">以 Common Crawl 为起点的典型清洗流程（宽度只表示“越筛越少”，不按比例）</text><rect x="60.0" y="108.0" width="560.0" height="50.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="340.0" y="139.0" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">Common Crawl 原始抓取</text><line x1="632.0" y1="133.0" x2="676.0" y2="133.0" stroke="#e2ddd6" stroke-width="1.5" stroke-dasharray="4,4"/><text x="690.0" y="139.0" font-size="15" fill="#5a5a5a" text-anchor="start">几十亿个网页，HTML、导航栏、广告全在</text><line x1="340.0" y1="158.0" x2="340.0" y2="176.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><rect x="88.3" y="178.0" width="503.3" height="50.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="340.0" y="209.0" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">URL 过滤</text><line x1="603.7" y1="203.0" x2="676.0" y2="203.0" stroke="#e2ddd6" stroke-width="1.5" stroke-dasharray="4,4"/><text x="690.0" y="209.0" font-size="15" fill="#5a5a5a" text-anchor="start">按黑名单去掉成人、赌博、垃圾站点</text><line x1="340.0" y1="228.0" x2="340.0" y2="246.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><rect x="116.7" y="248.0" width="446.7" height="50.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="340.0" y="279.0" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">正文抽取</text><line x1="575.3" y1="273.0" x2="676.0" y2="273.0" stroke="#e2ddd6" stroke-width="1.5" stroke-dasharray="4,4"/><text x="690.0" y="279.0" font-size="15" fill="#5a5a5a" text-anchor="start">从 HTML 里抠出正文，丢掉模板和菜单</text><line x1="340.0" y1="298.0" x2="340.0" y2="316.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><rect x="145.0" y="318.0" width="390.0" height="50.0" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="340.0" y="349.0" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">语言识别</text><line x1="547.0" y1="343.0" x2="676.0" y2="343.0" stroke="#e2ddd6" stroke-width="1.5" stroke-dasharray="4,4"/><text x="690.0" y="349.0" font-size="15" fill="#5a5a5a" text-anchor="start">fastText 分类器判断语种，按阈值保留</text><line x1="340.0" y1="368.0" x2="340.0" y2="386.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><rect x="173.3" y="388.0" width="333.3" height="50.0" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="340.0" y="419.0" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">质量过滤</text><line x1="518.7" y1="413.0" x2="676.0" y2="413.0" stroke="#e2ddd6" stroke-width="1.5" stroke-dasharray="4,4"/><text x="690.0" y="419.0" font-size="15" fill="#5a5a5a" text-anchor="start">启发式规则 + 质量分类器：太短、重复行多、符号比例异常的去掉</text><line x1="340.0" y1="438.0" x2="340.0" y2="456.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><rect x="201.7" y="458.0" width="276.7" height="50.0" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="340.0" y="489.0" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">去重</text><line x1="490.3" y1="483.0" x2="676.0" y2="483.0" stroke="#e2ddd6" stroke-width="1.5" stroke-dasharray="4,4"/><text x="690.0" y="489.0" font-size="15" fill="#5a5a5a" text-anchor="start">MinHash 找近似重复文档，只留一份</text><line x1="340.0" y1="508.0" x2="340.0" y2="526.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><rect x="230.0" y="528.0" width="220.0" height="50.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="340.0" y="559.0" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">训练语料</text><line x1="462.0" y1="553.0" x2="676.0" y2="553.0" stroke="#e2ddd6" stroke-width="1.5" stroke-dasharray="4,4"/><text x="690.0" y="559.0" font-size="15" fill="#5a5a5a" text-anchor="start">例：FineWeb 从 96 个快照中得到约 15T token</text></svg>