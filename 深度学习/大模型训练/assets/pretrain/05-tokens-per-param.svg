-anchor="start">2020 · 300B token</text><text x="244.0" y="213.0" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="600">Gopher 280B</text><rect x="260.0" y="188.0" width="66.6" height="36.0" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2"/><text x="336.6" y="212.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">1.1</text><text x="396.6" y="212.0" font-size="13" fill="#6a6a6a" text-anchor="start">2021 · 300B token</text><text x="244.0" y="277.0" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="600">Chinchilla 70B</text><rect x="260.0" y="252.0" width="322.3" height="36.0" rx="6" fill="#f3d3c4" stroke="#d97757" stroke-width="2"/><text x="592.3" y="276.0" font-size="15" fill="#d97757" text-anchor="start" font-weight="700">20</text><text x="652.3" y="276.0" font-size="13" fill="#6a6a6a" text-anchor="start">2022 · 1.4T token</text><text x="244.0" y="341.0" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="600">Llama 2 7B</text><rect x="260.0" y="316.0" width="554.6" height="36.0" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2"/><text x="824.6" y="340.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">286</text><text x="878.6" y="340.0" font-size="13" fill="#6a6a6a" text-anchor="start">2023 · 2T token</text><text x="244.0" y="405.0" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="600">Llama 3 8B</text><rect x="260.0" y="380.0" width="718.9" height="36.0" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2"/><text x="988.9" y="404.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">1,875</text><text x="1042.9" y="404.0" font-size="13" fill="#6a6a6a" text-anchor="start">2024 · 15T token</text><line x1="582.3" y1="104.0" x2="582.3" y2="446.0" stroke="#d97757" stroke-width="2" stroke-dasharray="6,5"/><text x="582.3" y="98.0" font-size="14" fill="#d97757" text-anchor="middle" font-weight="600">≈ 20：Chinchilla 算力最优</text><text x="600.0" y="506.0" font-s