<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1200" height="470" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">同一个输入，两种模型</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">示意：方框里是模型接在输入后面生成的内容</text><rect x="48.0" y="110.0" width="1104.0" height="56.0" rx="10" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="70.0" y="145.0" font-size="16" fill="#6a6a6a" text-anchor="start" font-weight="600">输入：</text><text x="130.0" y="145.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">法国的首都是哪里？</text><rect x="48.0" y="196.0" width="536.0" height="210.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="70.0" y="230.0" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="700">base 模型</text><text x="70.0" y="266.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">德国的首都是哪里？</text><text x="70.0" y="292.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">意大利的首都是哪里？</text><text x="70.0" y="318.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">西班牙的首都是哪里？</text><text x="70.0" y="344.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">（以上每题 2 分）</text><text x="70.0" y="392.0" font-size="14" fill="#5a5a5a" text-anchor="start">它见过大量“题目列表”式网页，觉得接着出题最像原文</text><rect x="616.0" y="196.0" width="536.0" height="210.0" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="638.0" y="230.0" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="700">chat 模型</text><text x="638.0" y="266.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">法国的首都是巴黎。</text><text x="638.0" y="392.0" font-size="14" fill="#5a5a5a" text-anchor="start">经过后训练，学会了“用户提问 → 助手回答”这种格式</text><text x="600.0" y="452.0" font-size="14" fill="#5a5a5a" text-anchor="middle">知道“巴黎”这个事实的，其实是 base 模型；后训练只是教会它按问答的方式说出来</text></svg>