<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1200" height="640" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">一次工具调用在序列里长什么样</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">整段对话是一条 token 序列；绿色部分由模型生成、计算 loss，其余只作为上下文</text><rect x="220.0" y="112.0" width="700.0" height="86.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="200.0" y="161.0" font-size="16" fill="#1a1a1a" text-anchor="end" font-weight="700">system</text><text x="244.0" y="148.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">你可以调用工具：</text><text x="244.0" y="176.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">get_weather(city: string)</text><text x="946.0" y="161.0" font-size="15" fill="#6a6a6a" text-anchor="start" font-weight="700">-100</text><rect x="220.0" y="216.0" width="700.0" height="58.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="200.0" y="251.0" font-size="16" fill="#1a1a1a" text-anchor="end" font-weight="700">user</text><text x="244.0" y="252.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">北京今天要带伞吗？</text><text x="946.0" y="251.0" font-size="15" fill="#6a6a6a" text-anchor="start" font-weight="700">-100</text><rect x="220.0" y="292.0" width="700.0" height="86.0" rx="12" fill="#9dd4c7" stroke="#d97757" stroke-width="3" filter="url(#soft)"/><text x="200.0" y="341.0" font-size="16" fill="#1a1a1a" text-anchor="end" font-weight="700">assistant</text><text x="244.0" y="328.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">&lt;tool_call&gt;{"name": "get_weather",</text><text x="244.0" y="356.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace"> "arguments": {"city": "北京"}}&lt;/tool_call&gt;</text><text x="946.0" y="341.0" font-size="15" fill="#d97757" text-anchor="start" font-weight="700">算 loss</text><rect x="220.0" y="396.0" width="700.0" height="58.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="200.0" y="431.0" font-size="16" fill="#1a1a1a" text-anchor="end" font-weight="700">tool</text><text x="244.0" y="432.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">{"weather": "小雨", "temp": 14}</text><text x="946.0" y="431.0" font-size="15" fill="#6a6a6a" text-anchor="start" font-weight="700">-100</text><rect x="220.0" y="472.0" width="700.0" height="86.0" rx="12" fill="#9dd4c7" stroke="#d97757" stroke-width="3" filter="url(#soft)"/><text x="200.0" y="521.0" font-size="16" fill="#1a1a1a" text-anchor="end" font-weight="700">assistant</text><text x="244.0" y="508.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">北京今天有小雨，14 度左右，</text><text x="244.0" y="536.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">建议带伞。</text><text x="946.0" y="521.0" font-size="15" fill="#d97757" text-anchor="start" font-weight="700">算 loss</text><path d="M1040 326 h12 V448 h-12" fill="none" stroke="#5a5a5a" stroke-width="2" stroke-dasharray="5,4"/><text x="1066.0" y="360.0" font-size="14" fill="#5a5a5a" text-anchor="start" font-weight="600">agent 运行时</text><text x="1066.0" y="382.0" font-size="14" fill="#5a5a5a" text-anchor="start">解析 tool_call，</text><text x="1066.0" y="404.0" font-size="14" fill="#5a5a5a" text-anchor="start">执行函数，把结果</text><text x="1066.0" y="426.0" font-size="14" fill="#5a5a5a" text-anchor="start">作为 tool 消息</text><text x="1066.0" y="448.0" font-size="14" fill="#5a5a5a" text-anchor="start">接回序列</text><text x="600.0" y="622.0" font-size="14" fill="#5a5a5a" text-anchor="middle">模型从没“调用”过什么，它只是学会了在合适的时候输出一段格式固定的文本</text></svg>