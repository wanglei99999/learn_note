th="1.8"/><text x="778.3" y="413.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">assistant</text><text x="839.2" y="413.0" font-size="15" fill="#6a6a6a" text-anchor="start">↵</text><rect x="596.0" y="442.0" width="84.4" height="38.0" rx="6" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.8"/><text x="638.2" y="467.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">等于 2。</text><rect x="688.4" y="442.0" width="107.0" height="38.0" rx="6" fill="#efe7da" stroke="#d97757" stroke-width="1.8"/><text x="741.9" y="467.0" font-size="15" fill="#d97757" text-anchor="middle" font-weight="700" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">&lt;|im_end|&gt;</text><text x="807.4" y="467.0" font-size="15" fill="#6a6a6a" text-anchor="start">↵</text><rect x="48.0" y="552.0" width="18.0" height="18.0" rx="4" fill="#efe7da" stroke="#d97757" stroke-width="1.8"/><text x="74.0" y="566.0" font-size="14" fill="#5a5a5a" text-anchor="start">special token：词表里单独的一个 token，不是七八个普通字符拼起来的</text><text x="1152.0" y="566.0" font-size="14" fill="#6a6a6a" text-anchor="end">↵ 是换行符，也是普通 token</text></svg>