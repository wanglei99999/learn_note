<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1200" height="600" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">chat 模板：把一组消息拼成一段文本</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">左边是 API 里传的消息列表，右边是模型真正看到的 token 序列（ChatML 格式）</text><rect x="48.0" y="112.0" width="430.0" height="420.0" rx="12" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="70.0" y="146.0" font-size="16" fill="#6a6a6a" text-anchor="start" font-weight="700">messages</text><rect x="70.0" y="170.0" width="386.0" height="92.0" rx="10" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2"/><text x="90.0" y="204.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">"role": "system"</text><text x="90.0" y="236.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">"content": "你是一个简洁的助手。"</text><rect x="70.0" y="286.0" width="386.0" height="92.0" rx="10" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2"/><text x="90.0" y="320.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">"role": "user"</text><text x="90.0" y="352.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">"content": "1+1 等于几？"</text><rect x="70.0" y="402.0" width="386.0" height="92.0" rx="10" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2"/><text x="90.0" y="436.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">"role": "assistant"</text><text x="90.0" y="468.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">"content": "等于 2。"</text><line x1="492.0" y1="322.0" x2="560.0" y2="322.0" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><text x="526.0" y="306.0" font-size="14" fill="#5a5a5a" text-anchor="middle">模板</text><rect x="574.0" y="112.0" width="578.0" height="420.0" rx="12" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="596.0" y="146.0" font-size="16" fill="#6a6a6a" text-anchor="start" font-weight="700">渲染后的文本</text><rect x="596.0" y="172.0" width="125.4" height="38.0" rx="6" fill="#efe7da" stroke="#d97757" stroke-width="1.8"/><text x="658.7" y="197.0" font-size="15" fill="#d97757" text-anchor="middle" font-weight="700" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">&lt;|im_start|&gt;</text><rect x="729.4" y="172.0" width="70.2" height="38.0" rx="6" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.8"/><text x="764.5" y="197.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">system</text><text x="811.6" y="197.0" font-size="15" fill="#6a6a6a" text-anchor="start">↵</text><rect x="596.0" y="226.0" width="185.0" height="38.0" rx="6" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.8"/><text x="688.5" y="251.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">你是一个简洁的助手。</text><rect x="789.0" y="226.0" width="107.0" height="38.0" rx="6" fill="#efe7da" stroke="#d977