amily="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">-100</text><line x1="854.5" y1="190.0" x2="854.5" y2="258.0" stroke="#d97757" stroke-width="2" marker-end="url(#arr-clay)"/><line x1="914.5" y1="190.0" x2="914.5" y2="258.0" stroke="#d97757" stroke-width="2" marker-end="url(#arr-clay)"/><line x1="974.5" y1="190.0" x2="974.5" y2="258.0" stroke="#d97757" stroke-width="2" marker-end="url(#arr-clay)"/><line x1="1034.6" y1="190.0" x2="1034.6" y2="258.0" stroke="#d97757" stroke-width="2" marker-end="url(#arr-clay)"/><path d="M826.628841607565 322 v10 H1062.3924349881797 v-10" fill="none" stroke="#d97757" stroke-width="2"/><text x="944.5" y="356.0" font-size="15" fill="#d97757" text-anchor="middle" font-weight="700">只有这 4 个位置算 loss</text><rect x="48.0" y="386.0" width="1104.0" height="172.0" rx="12" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="72.0" y="420.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="600">手算：假设模型在这 4 个位置给正确 token 的概率分别是</text><text x="140.0" y="458.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">等于</text><text x="140.0" y="486.0" font-size="14" fill="#5a5a5a" text-anchor="middle">p = 0.60</text><text x="140.0" y="510.0" font-size="14" fill="#5a5a5a" text-anchor="middle">−log p = 0.511</text><text x="360.0" y="458.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">2</text><text x="360.0" y="486.0" font-size="14" fill="#5a5a5a" text-anchor="middle">p = 0.90</text><text x="360.0" y="510.0" font-size="14" fill="#5a5a5a" text-anchor="middle">−log p = 0.105</text><text x="580.0" y="458.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">。</text><text x="580.0" y="486.0" font-size="14" fill="#5a5a5a" text-anchor="middle">p = 0.80</text><text x="580.0" y="510.0" font-size="14" fill="#5a5a5a" text-anchor="middle">−log p = 0.223</text><text x="800.0" y="458.0" font-size="15" fill="#d97757" text-anchor="middle" font-weight="700" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">&lt;|im_end|&gt;</text><text x="800.0" y="486.0" font-size="14" fill="#5a5a5a" text-anchor="middle">p = 0.50</text><text x="800.0" y="510.0" font-size="14" fill="#5a5a5a" text-anchor="middle">−log p = 0.693</text><text x="1000.0" y="470.0" font-size="15" fill="#1a1a1a" text-anchor="middle">loss = (0.511 + 0.105</text><text x="1000.0" y="494.0" font-size="15" fill="#1a1a1a" text-anchor="middle">+ 0.223 + 0.693) / 4</text><text x="1000.0" y="522.0" font-size="17" fill="#d97757" text-anchor="middle" font-weight="700">≈ 0.383</text><text x="600.0" y="582.0" font-size="14" fill="#5a5a5a" text-anchor="middle">结束符 &lt;|im_end|&gt; 也在 loss 里：模型要学会说完就停</text></svg>