<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1200" height="560" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">PPO 训练时，显存里有四个模型</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">只有策略模型和价值模型在更新；参考模型和奖励模型冻结</text><rect x="60.0" y="140.0" width="260.0" height="96.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="190.0" y="183.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">prompt</text><text x="190.0" y="207.5" font-size="14" fill="#6a6a6a" text-anchor="middle">从 prompt 池采样</text><rect x="470.0" y="140.0" width="260.0" height="96.0" rx="12" fill="#a8c5e6" stroke="#d97757" stroke-width="3" filter="url(#soft)"/><text x="600.0" y="183.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">策略模型 π_θ</text><text x="600.0" y="207.5" font-size="14" fill="#6a6a6a" text-anchor="middle">生成回答 · 更新</text><line x1="324.0" y1="188.0" x2="464.0" y2="188.0" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><rect x="880.0" y="110.0" width="260.0" height="80.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="1010.0" y="145.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">奖励模型 r</text><text x="1010.0" y="169.5" font-size="14" fill="#6a6a6a" text-anchor="middle">冻结 · 给整段回答打分</text><rect x="880.0" y="220.0" width="260.0" height="80.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="1010.0" y="255.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">参考模型 π_ref</text><text x="1010.0" y="279.5" font-size="14" fill="#6a6a6a" text-anchor="middle">冻结 · 就是 SFT 模型</text><rect x="880.0" y="330.0" width="260.0" height="80.0" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="1010.0" y="365.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">价值模型 V</text><text x="1010.0" y="389.5" font-size="14" fill="#6a6a6a" text-anchor="middle">更新 · 估计每一步的预期得分</text><line x1="734.0" y1="188.0" x2="874.0" y2="150.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><line x1="734.0" y1="188.0" x2="874.0" y2="260.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><line x1="734.0" y1="188.0" x2="874.0" y2="370.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><text x="790.0" y="150.0" font-size="14" fill="#5a5a5a" text-anchor="middle">回答 y</text><rect x="140.0" y="300.0" width="640.0" height="150.0" rx="12" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="164.0" y="336.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">每条回答拿到的奖励</text><text x="164.0" y="374.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">R = r(x, y) − β · [log π_θ(y|x) − log π_ref(y|x)]</text><text x="164.0" y="410.0" font-size="14" fill="#5a5a5a" text-anchor="start">第一项：奖励模型的打分；第二项：偏离 SFT 模型越远，扣得越多</text><text x="164.0" y="434.0" font-size="14" fill="#5a5a5a" text-anchor="start">价值模型用来把整段奖励分摊到每个 token，降低梯度的方差</text><text x="600.0" y="530.0" font-size="14" fill="#5a5a5a" text-anchor="middle">7B 规模就要同时放下 4 份 7B 模型，外加生成回答的推理开销，这是 PPO 难用的主要原因</text></svg>