<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1200" height="560" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">奖励模型：只学“哪个更好”</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">Bradley–Terry 模型：两个分数之差过 sigmoid，就是“A 比 B 好”的概率</text><rect x="48.0" y="130.0" width="230.0" height="64.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="163.0" y="168.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">prompt x</text><rect x="48.0" y="220.0" width="230.0" height="64.0" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="163.0" y="258.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">回答 y_w（更好）</text><rect x="48.0" y="310.0" width="230.0" height="64.0" rx="12" fill="#f3d3c4" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="163.0" y="348.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">回答 y_l（更差）</text><rect x="340.0" y="200.0" width="170.0" height="104.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="425.0" y="247.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">奖励模型</text><text x="425.0" y="271.5" font-size="14" fill="#6a6a6a" text-anchor="middle">LLM + 标量头</text><line x1="282.0" y1="162.0" x2="334.0" y2="252.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><line x1="282.0" y1="252.0" x2="334.0" y2="252.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><line x1="282.0" y1="342.0" x2="334.0" y2="252.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><line x1="514.0" y1="230.0" x2="580.0" y2="200.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><line x1="514.0" y1="276.0" x2="580.0" y2="306.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><text x="590.0" y="205.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="700">r_w = 1.2</text><text x="590.0" y="312.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="700">r_l = 0.4</text><rect x="48.0" y="410.0" width="520.0" height="110.0" rx="12" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="70.0" y="444.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="700">loss = −log σ(r_w − r_l)</text><text x="70.0" y="474.0" font-size="15" fill="#5a5a5a" text-anchor="start">= −log σ(0.8) = −log 0.690 ≈ 0.371</text><text x="70.0" y="500.0" font-size="14" fill="#6a6a6a" text-anchor="start">梯度把 r_w 往上推、r_l 往下压，直到差距足够大</text><rect x="790.0" y="130.0" width="340.0" height="300.0" rx="6" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><line x1="790.0" y1="130.0" x2="790.0" y2="430.0" stroke="#e2ddd6" stroke-width="1"/><text x="790.0" y="454.0" font-size="13" fill="#6a6a6a" text-anchor="middle">-4</text><line x1="875.0" y1="130.0" x2="875.0" y2="430.0" stroke="#e2ddd6" stroke-width="1"/><text x="875.0" y="454.0" font-size="13" fill="#6a6a6a" text-anchor="middle">-2</text><line x1="960.0" y1="130.0" x2="960.0" y2="430.0" stroke="#e2ddd6" stroke-width="1"/><text x="960.0" y="454.0" font-size="13" fill="#6a6a6a" text-anchor="middle">0</text><line x1="1045.0" y1="130.0" x2="1045.0" y2="430.0" stroke="#e2ddd6" stroke-width="1"/><text x="1045.0" y="454.0" font-size="13" fill="#6a6a6a" text-anchor="middle">2</text><line x1="1130.0" y1="130.0" x2="1130.0" y2="430.0" stroke="#e2ddd6" stroke-width="1"/><text x="1130.0" y="454.0" font-size="13" fill="#6a6a6a" text-anchor="middle">4</text><line x1="790.0" y1="430.0" x2="1130.0" y2="430.0" stroke="#e2ddd6" stroke-width="1"/><text x="780.0" y="435.0" font-size="13" fill="#6a6a6a" text-anchor="end">0</text><line x1="790.0" y1="358.6" x2="1130.0" y2="358.6" stroke="#e2ddd6" stroke-width="1"/><text x="780.0" y="363.6" font-size="13" fill="#6a6a6a" text-anchor="end">1</text><line x1="790.0" y1="287.1" x2="1130.0" y2="287.1" stroke="#e2ddd6" stroke-width="1"/><text x="780.0" y="292.1" font-size="13" fill="#6a6a6a" text-anchor="end">2</text><line x1="790.0" y1="215.7" x2="1130.0" y2="215.7" stroke="#e2ddd6" stroke-width="1"/><text x="780.0" y="220.7" font-size="13" fill="#6a6a6a" text-anchor="end">3</text><line x1="790.0" y1="144.3" x2="1130.0" y2="144.3" stroke="#e2ddd6" stroke-width="1"/><text x="780.0" y="149.3" font-size="13" fill="#6a6a6a" text-anchor="end">4</text><text x="960.0" y="482.0" font-size="14" fill="#5a5a5a" text-anchor="middle">分数差 r_w − r_l</text><text x="728" y="280.0" font-size="14" fill="#5a5a5a" text-anchor="middle" transform="rotate(-90 728 280.0)">loss</text><path d="M790.0 143.0 L793.4 148.6 L796.8 154.2 L800.2 159.8 L803.6 165.4 L807.0 170.9 L810.4 176.5 L813.8 182.0 L817.2 187.6 L820.6 193.1 L824.0 198.6 L827.4 204.1 L830.8 209.5 L834.2 215.0 L837.6 220.4 L841.0 225.8 L844.4 231.2 L847.8 236.5 L851.2 241.8 L854.6 247.1 L858.0 252.4 L861.4 257.6 L864.8 262.8 L868.2 267.9 L871.6 273.0 L875.0 278.1 L878.4 283.1 L881.8 288.0 L885.2 292.9 L888.6 297.8 L892.0 302.6 L895.4 307.3 L898.8 312.0 L902.2 316.5 L905.6 321.0 L909.0 325.5 L912.4 329.8 L915.8 334.1 L919.2 338.3 L922.6 342.4 L926.0 346.3 L929.4 350.2 L932.8 354.0 L936.2 357.7 L939.6 361.3 L943.0 364.8 L946.4 368.2 L949.8 371.4 L953.2 374.5 L956.6 377.6 L960.0 380.5 L963.4 383.3 L966.8 386.0 L970.2 388.5 L973.6 391.0 L977.0 393.4 L980.4 395.6 L983.8 397.7 L987.2 399.8 L990.6 401.7 L994.0 403.5 L997.4 405.2 L1000.8 406.8 L1004.2 408.4 L1007.6 409.8 L1011.0 411.2 L1014.4 412.5 L1017.8 413.7 L1021.2 414.8 L1024.6 415.9 L1028.0 416.9 L1031.4 417.8 L1034.8 418.7 L1038.2 419.5 L1041.6 420.2 L1045.0 420.9 L1048.4 421.6 L1051.8 422.2 L1055.2 422.8 L1058.6 423.3 L1062.0 423.8 L1065.4 424.3 L1068.8 424.7 L1072.2 425.1 L1075.6 425.4 L1079.0 425.8 L1082.4 426.1 L1085.8 426.4 L1089.2 426.7 L1092.6 426.9 L1096.0 427.1 L1099.4 427.4 L1102.8 427.6 L1106.2 427.7 L1109.6 427.9 L1113.0 428.1 L1116.4 428.2 L1119.8 428.4 L1123.2 428.5 L1126.6 428.6 L1130.0 428.7" fill="none" stroke="#d97757" stroke-width="3.5"/><circle cx="994.0" cy="403.5" r="7" fill="#ffffff" stroke="#d97757" stroke-width="3"/><text x="1006.0" y="391.5" font-size="14" fill="#d97757" text-anchor="start" font-weight="700">(0.8, 0.371)</text><circle cx="960.0" cy="380.5" r="5" fill="#ffffff" stroke="#5a5a5a" stroke-width="2"/><text x="948.0" y="402.5" font-size="13" fill="#5a5a5a" text-anchor="end">0.693</text><text x="960.0" y="520.0" font-size="14" fill="#5a5a5a" text-anchor="middle">排错（差 &lt; 0）时 loss 很大；排对后 loss 迅速变小</text></svg>