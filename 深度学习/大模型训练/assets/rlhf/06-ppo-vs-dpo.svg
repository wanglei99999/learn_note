<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1200" height="560" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">DPO 把“训练奖励模型 + 强化学习”压成一步</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">同样的偏好数据，DPO 直接在策略模型上算一个分类式的 loss</text><text x="48.0" y="140.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="700">RLHF (PPO)</text><rect x="48.0" y="160.0" width="196.0" height="64.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="146.0" y="198.0" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">偏好数据</text><line x1="248.0" y1="192.0" x2="268.0" y2="192.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><rect x="272.0" y="160.0" width="196.0" height="64.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="370.0" y="198.0" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">训练奖励模型</text><line x1="472.0" y1="192.0" x2="492.0" y2="192.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><rect x="496.0" y="160.0" width="196.0" height="64.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="594.0" y="198.0" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">采样生成回答</text><line x1="696.0" y1="192.0" x2="716.0" y2="192.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><rect x="720.0" y="160.0" width="196.0" height="64.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="818.0" y="198.0" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">打分 + KL</text><line x1="920.0" y1="192.0" x2="940.0" y2="192.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><rect x="944.0" y="160.0" width="196.0" height="64.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="1042.0" y="198.0" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">PPO 更新</text><path d="M942 228 C 942 270, 488 270, 488 230" fill="none" stroke="#5a5a5a" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr)"/><text x="715.0" y="282.0" font-size="13" fill="#6a6a6a" text-anchor="middle">循环：在线采样，每轮都要生成</text><text x="48.0" y="340.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="700">DPO</text><rect x="48.0" y="360.0" width="196.0" height="64.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="146.0" y="398.0" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">偏好数据</text><line x1="248.0" y1="392.0" x2="300.0" y2="392.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><rect x="304.0" y="360.0" width="848.0" height="64.0" rx="12" fill="#9dd4c7" stroke="#d97757" stroke-width="3" filter="url(#soft)"/><text x="728.0" y="398.0" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">直接用 DPO loss 更新策略模型（参考模型只做前向）</text><rect x="48.0" y="448.0" width="1104.0" height="64.0" rx="12" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="70.0" y="486.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">需要的模型：</text><text x="170.0" y="486.0" font-size="15" fill="#5a5a5a" text-anchor="start">PPO = 策略 + 参考 + 奖励 + 价值 4 个，还要在线生成；DPO = 策略 + 参考 2 个，数据是静态的</text></svg>