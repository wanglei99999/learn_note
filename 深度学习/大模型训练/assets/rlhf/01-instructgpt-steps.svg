<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1200" height="520" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">InstructGPT 的三步</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">SFT 之后，先训练一个给回答打分的奖励模型，再用强化学习让模型去拿高分</text><rect x="48.0" y="112.0" width="330.0" height="300.0" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="213.0" y="152.0" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">① SFT</text><text x="213.0" y="198.0" font-size="16" fill="#5a5a5a" text-anchor="middle">约 1.3 万条 prompt</text><text x="213.0" y="230.0" font-size="16" fill="#5a5a5a" text-anchor="middle">标注员写示范回答</text><text x="213.0" y="262.0" font-size="16" fill="#5a5a5a" text-anchor="middle"></text><text x="213.0" y="294.0" font-size="16" fill="#5a5a5a" text-anchor="middle">监督学习</text><rect x="108.0" y="352.0" width="210.0" height="40.0" rx="20" fill="#ffffff" stroke="#4a4a4a" stroke-width="2"/><text x="213.0" y="378.0" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">得到 π_SFT</text><line x1="386.0" y1="262.0" x2="427.0" y2="262.0" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><rect x="435.0" y="112.0" width="330.0" height="300.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="600.0" y="152.0" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">② 训练奖励模型</text><text x="600.0" y="198.0" font-size="16" fill="#5a5a5a" text-anchor="middle">约 3.3 万条 prompt</text><text x="600.0" y="230.0" font-size="16" fill="#5a5a5a" text-anchor="middle">每题采样 4~9 个回答</text><text x="600.0" y="262.0" font-size="16" fill="#5a5a5a" text-anchor="middle">标注员从好到差排序</text><text x="600.0" y="294.0" font-size="16" fill="#5a5a5a" text-anchor="middle">两两比较的 loss</text><rect x="495.0" y="352.0" width="210.0" height="40.0" rx="20" fill="#ffffff" stroke="#4a4a4a" stroke-width="2"/><text x="600.0" y="378.0" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">得到 r(x, y)</text><line x1="773.0" y1="262.0" x2="814.0" y2="262.0" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><rect x="822.0" y="112.0" width="330.0" height="300.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="987.0" y="152.0" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">③ PPO</text><text x="987.0" y="198.0" font-size="16" fill="#5a5a5a" text-anchor="middle">约 3.1 万条 prompt</text><text x="987.0" y="230.0" font-size="16" fill="#5a5a5a" text-anchor="middle">模型自己生成回答</text><text x="987.0" y="262.0" font-size="16" fill="#5a5a5a" text-anchor="middle">奖励模型打分</text><text x="987.0" y="294.0" font-size="16" fill="#5a5a5a" text-anchor="middle">加 KL 惩罚</text><rect x="882.0" y="352.0" width="210.0" height="40.0" rx="20" fill="#ffffff" stroke="#d97757" stroke-width="2"/><text x="987.0" y="378.0" font-size="16" fill="#d97757" text-anchor="middle" font-weight="700">得到 π_RL</text><text x="600.0" y="456.0" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">结果：1.3B 的 InstructGPT，在人工评估里比 175B 的 GPT-3 更受偏好</text><text x="600.0" y="486.0" font-size="13" fill="#6a6a6a" text-anchor="middle">数字来自 Ouyang 等 2022</text></svg>