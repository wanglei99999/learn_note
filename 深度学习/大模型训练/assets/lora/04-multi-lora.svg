<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1200" height="520" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">一份基础模型，挂很多个 LoRA</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">每个 adapter 只有几 MB 到几十 MB，可以按请求切换</text><rect x="380.0" y="300.0" width="440.0" height="120.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="600.0" y="350.0" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">基础模型（7B，bf16 约 13.5 GB）</text><text x="600.0" y="380.0" font-size="15" fill="#5a5a5a" text-anchor="middle">在 GPU 上只放一份</text><rect x="70.0" y="130.0" width="230.0" height="76.0" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="185.0" y="163.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">LoRA：法务问答</text><text x="185.0" y="187.5" font-size="14" fill="#6a6a6a" text-anchor="middle">r = 16，十几到几十 MB</text><line x1="185.0" y1="210.0" x2="465.0" y2="294.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><rect x="345.0" y="130.0" width="230.0" height="76.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="460.0" y="163.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">LoRA：客服话术</text><text x="460.0" y="187.5" font-size="14" fill="#6a6a6a" text-anchor="middle">r = 16，十几到几十 MB</text><line x1="460.0" y1="210.0" x2="555.0" y2="294.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><rect x="620.0" y="130.0" width="230.0" height="76.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="735.0" y="163.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">LoRA：SQL 生成</text><text x="735.0" y="187.5" font-size="14" fill="#6a6a6a" text-anchor="middle">r = 16，十几到几十 MB</text><line x1="735.0" y1="210.0" x2="645.0" y2="294.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><rect x="895.0" y="130.0" width="230.0" height="76.0" rx="12" fill="#f3d3c4" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="1010.0" y="163.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">LoRA：内部代码风格</text><text x="1010.0" y="187.5" font-size="14" fill="#6a6a6a" text-anchor="middle">r = 16，十几到几十 MB</text><line x1="1010.0" y1="210.0" x2="735.0" y2="294.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><text x="600.0" y="466.0" font-size="15" fill="#5a5a5a" text-anchor="middle">请求 A 用“法务问答”，请求 B 用“SQL 生成”，可以放进同一个 batch 一起算</text><text x="600.0" y="492.0" font-size="14" fill="#6a6a6a" text-anchor="middle">S-LoRA、vLLM 等推理框架都支持这种部署方式</text></svg>