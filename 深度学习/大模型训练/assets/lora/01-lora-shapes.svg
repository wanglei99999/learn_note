<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1200" height="560" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">LoRA：冻结 W，只训练两个细长矩阵</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">h = W·x + (α/r)·B·A·x；以 d = 4096、r = 8 为例</text><rect x="80.0" y="130.0" width="280.0" height="280.0" rx="8" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5"/><text x="220.0" y="262.0" font-size="34" fill="#1a1a1a" text-anchor="middle" font-weight="700">W</text><text x="220.0" y="296.0" font-size="15" fill="#5a5a5a" text-anchor="middle">4096 × 4096</text><text x="220.0" y="320.0" font-size="15" fill="#6a6a6a" text-anchor="middle" font-weight="600">冻结</text><text x="220.0" y="440.0" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">16,777,216 个参数</text><text x="410.0" y="280.0" font-size="40" fill="#5a5a5a" text-anchor="middle" font-weight="700">+</text><rect x="470.0" y="130.0" width="30.0" height="280.0" rx="6" fill="#f3d3c4" stroke="#d97757" stroke-width="2.5"/><text x="485.0" y="116.0" font-size="22" fill="#d97757" text-anchor="middle" font-weight="700">B</text><text x="485.0" y="434.0" font-size="14" fill="#5a5a5a" text-anchor="middle">4096 × 8</text><text x="540.0" y="280.0" font-size="32" fill="#5a5a5a" text-anchor="middle" font-weight="700">×</text><rect x="580.0" y="255.0" width="280.0" height="30.0" rx="6" fill="#f3d3c4" stroke="#d97757" stroke-width="2.5"/><text x="720.0" y="242.0" font-size="22" fill="#d97757" text-anchor="middle" font-weight="700">A</text><text x="720.0" y="310.0" font-size="14" fill="#5a5a5a" text-anchor="middle">8 × 4096</text><text x="665.0" y="440.0" font-size="16" fill="#d97757" text-anchor="middle" font-weight="700">2 × 4096 × 8 = 65,536 个参数</text><text x="665.0" y="466.0" font-size="15" fill="#d97757" text-anchor="middle">只有 W 的 0.39%</text><rect x="910.0" y="130.0" width="242.0" height="300.0" rx="12" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="928.0" y="162.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">初始化</text><text x="928.0" y="196.0" font-size="14" fill="#5a5a5a" text-anchor="start">A：随机高斯</text><text x="928.0" y="222.0" font-size="14" fill="#5a5a5a" text-anchor="start">B：全零</text><text x="928.0" y="248.0" font-size="14" fill="#1a1a1a" text-anchor="start">→ 一开始 B·A = 0，</text><text x="928.0" y="274.0" font-size="14" fill="#5a5a5a" text-anchor="start">   模型和原来完全一样</text><text x="928.0" y="300.0" font-size="14" fill="#1a1a1a" text-anchor="start"></text><text x="928.0" y="326.0" font-size="14" fill="#5a5a5a" text-anchor="start">训练后可以合并：</text><text x="928.0" y="352.0" font-size="14" fill="#1a1a1a" text-anchor="start">W' = W + (α/r)·B·A</text><text x="928.0" y="378.0" font-size="14" fill="#5a5a5a" text-anchor="start">推理时没有额外开销</text><text x="600.0" y="534.0" font-size="15" fill="#5a5a5a" text-anchor="middle">B·A 的秩最多是 r，所以 LoRA 假设的是：微调需要的改动量 ΔW 是低秩的</text></svg>