<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1200" height="540" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">微调 Llama-2-7B，权重相关的显存</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">只算权重、梯度、Adam 状态，不含激活值；LoRA 为 r = 8，加在每层的 W_q 和 W_v 上</text><text x="214.0" y="176.0" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="700">全参数微调</text><rect x="230.0" y="140.0" width="94.4" height="56.0" rx="4" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.8"/><text x="277.2" y="174.0" font-size="13" fill="#1a1a1a" text-anchor="middle">bf16 权重</text><rect x="324.4" y="140.0" width="94.4" height="56.0" rx="4" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.8"/><text x="371.5" y="174.0" font-size="13" fill="#1a1a1a" text-anchor="middle">bf16 梯度</text><rect x="418.7" y="140.0" width="188.7" height="56.0" rx="4" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.8"/><text x="513.1" y="174.0" font-size="13" fill="#1a1a1a" text-anchor="middle">fp32 主权重</text><rect x="607.4" y="140.0" width="377.4" height="56.0" rx="4" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.8"/><text x="796.2" y="174.0" font-size="13" fill="#1a1a1a" text-anchor="middle">Adam m、v（fp32）</text><text x="998.9" y="176.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="700">≈ 107.8 GB</text><text x="214.0" y="286.0" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="700">LoRA</text><rect x="230.0" y="250.0" width="94.4" height="56.0" rx="4" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.8"/><text x="277.2" y="284.0" font-size="13" fill="#1a1a1a" text-anchor="middle">bf16 权重</text><rect x="324.4" y="250.0" width="3.0" height="56.0" rx="4" fill="#f3d3c4" stroke="#4a4a4a" stroke-width="1.8"/><text x="341.4" y="286.0" font-size="17" fill="#d97757" text-anchor="start" font-weight="700">≈ 13.5 GB</text><text x="230.0" y="332.0" font-size="13" fill="#6a6a6a" text-anchor="start">冻结的 bf16 权重；可训练参数 4.19M，占 0.06%；它们的梯度和优化器状态只有 67 MB</text><text x="214.0" y="396.0" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="700">QLoRA</text><rect x="230.0" y="360.0" width="24.0" height="56.0" rx="4" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.8"/><rect x="254.0" y="360.0" width="3.0" height="56.0" rx="4" fill="#f3d3c4" stroke="#4a4a4a" stroke-width="1.8"/><text x="271.0" y="396.0" font-size="17" fill="#d97757" text-anchor="start" font-weight="700">≈ 3.5 GB</text><text x="230.0" y="442.0" font-size="13" fill="#6a6a6a" text-anchor="start">4-bit NF4 量化后的基础权重，加上 LoRA 部分（同上）</text><text x="230.0" y="516.0" font-size="13" fill="#6a6a6a" text-anchor="start">全参数微调按混合精度 + Adam 每参数 16 字节估算；QLoRA 的 4-bit 权重含分块量化常数</text></svg>