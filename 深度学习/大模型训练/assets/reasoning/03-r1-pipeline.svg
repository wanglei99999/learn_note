<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1200" height="600" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">DeepSeek-R1 的两条路线</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">R1-Zero 证明了“只用 RL 也能学会长推理”；R1 补上了可读性和通用能力</text><text x="48.0" y="136.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="700">R1-Zero</text><rect x="48.0" y="152.0" width="240.0" height="76.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="168.0" y="185.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">DeepSeek-V3-Base</text><text x="168.0" y="209.5" font-size="14" fill="#6a6a6a" text-anchor="middle">没有任何 SFT</text><line x1="292.0" y1="190.0" x2="352.0" y2="190.0" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><rect x="356.0" y="152.0" width="300.0" height="76.0" rx="12" fill="#a8c5e6" stroke="#d97757" stroke-width="3" filter="url(#soft)"/><text x="506.0" y="185.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">GRPO + 规则奖励</text><text x="506.0" y="209.5" font-size="14" fill="#6a6a6a" text-anchor="middle">准确率奖励 + 格式奖励</text><line x1="660.0" y1="190.0" x2="720.0" y2="190.0" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><rect x="724.0" y="152.0" width="428.0" height="76.0" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="938.0" y="185.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">AIME 2024：15.6% → 71.0%</text><text x="938.0" y="209.5" font-size="14" fill="#6a6a6a" text-anchor="middle">但语言混杂、可读性差</text><text x="48.0" y="290.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="700">R1</text><rect x="48.0" y="306.0" width="250.0" height="100.0" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="173.0" y="340.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">① 冷启动 SFT</text><text x="173.0" y="364.5" font-size="14" fill="#6a6a6a" text-anchor="middle">数千条长 CoT</text><text x="173.0" y="386.5" font-size="14" fill="#6a6a6a" text-anchor="middle">可读格式</text><line x1="302.0" y1="356.0" x2="326.0" y2="356.0" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><rect x="330.0" y="306.0" width="250.0" height="100.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="455.0" y="340.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">② 推理 RL</text><text x="455.0" y="364.5" font-size="14" fill="#6a6a6a" text-anchor="middle">GRPO</text><text x="455.0" y="386.5" font-size="14" fill="#6a6a6a" text-anchor="middle">+ 语言一致性奖励</text><line x1="584.0" y1="356.0" x2="608.0" y2="356.0" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><rect x="612.0" y="306.0" width="250.0" height="100.0" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="737.0" y="340.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">③ 拒绝采样 + SFT</text><text x="737.0" y="364.5" font-size="14" fill="#6a6a6a" text-anchor="middle">约 60 万推理样本</text><text x="737.0" y="386.5" font-size="14" fill="#6a6a6a" text-anchor="middle">约 20 万通用样本</text><line x1="866.0" y1="356.0" x2="890.0" y2="356.0" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><rect x="894.0" y="306.0" width="250.0" height="100.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="1019.0" y="340.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">④ 全场景 RL</text><text x="1019.0" y="364.5" font-size="14" fill="#6a6a6a" text-anchor="middle">推理：规则奖励</text><text x="1019.0" y="386.5" font-size="14" fill="#6a6a6a" text-anchor="middle">通用：奖励模型</text><text x="749.0" y="434.0" font-size="13" fill="#6a6a6a" text-anchor="start">③ 从 V3-Base 重新训练</text><path d="M738 410 V470 H340 V500" fill="none" stroke="#5a5a5a" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arr)"/><rect x="110.0" y="504.0" width="460.0" height="70.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="340.0" y="534.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">蒸馏到小模型</text><text x="340.0" y="558.5" font-size="14" fill="#6a6a6a" text-anchor="middle">用 ③ 的约 80 万条数据，直接 SFT Qwen2.5 / Llama</text><text x="600.0" y="530.0" font-size="14" fill="#5a5a5a" text-anchor="start">R1-Distill-Qwen-32B 的 AIME 2024 达到 72.6%，</text><text x="600.0" y="554.0" font-size="14" fill="#5a5a5a" text-anchor="start">比在同一个小模型上直接做 RL 好得多</text></svg>