a1a1a" text-anchor="start" font-weight="700">手算</text><text x="66.0" y="320.0" font-size="13" fill="#5a5a5a" text-anchor="start">均值 μ = 0.375</text><text x="66.0" y="339.0" font-size="13" fill="#5a5a5a" text-anchor="start">标准差 σ = 0.484</text><text x="66.0" y="358.0" font-size="13" fill="#5a5a5a" text-anchor="start"></text><text x="66.0" y="377.0" font-size="13" fill="#5a5a5a" text-anchor="start">答对：</text><text x="66.0" y="396.0" font-size="13" fill="#5a5a5a" text-anchor="start">(1 − 0.375) / 0.484</text><text x="66.0" y="415.0" font-size="13" fill="#5a5a5a" text-anchor="start">= +1.29</text><text x="66.0" y="434.0" font-size="13" fill="#5a5a5a" text-anchor="start">答错：</text><text x="66.0" y="453.0" font-size="13" fill="#5a5a5a" text-anchor="start">(0 − 0.375) / 0.484</text><text x="66.0" y="472.0" font-size="13" fill="#5a5a5a" text-anchor="start">= -0.77</text><text x="600.0" y="554.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">优势 Âᵢ = (rᵢ − mean(r)) / std(r)，这一组回答里的每个 token 都用同一个优势值</text><text x="600.0" y="582.0" font-size="14" fill="#d97757" text-anchor="middle">如果 8 个全对或全错，所有优势都是 0，这道题提供不了任何梯度</text></svg>