<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1200" height="540" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">可验证奖励：让程序来判对错</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">奖励不再来自学出来的奖励模型，而是来自答案比对、单元测试这类规则</text><rect x="48.0" y="130.0" width="250.0" height="110.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="173.0" y="169.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">题目</text><text x="173.0" y="193.5" font-size="14" fill="#6a6a6a" text-anchor="middle">求 x² − 5x + 6 = 0</text><text x="173.0" y="215.5" font-size="14" fill="#6a6a6a" text-anchor="middle">的较大根</text><rect x="400.0" y="130.0" width="250.0" height="110.0" rx="12" fill="#a8c5e6" stroke="#d97757" stroke-width="3" filter="url(#soft)"/><text x="525.0" y="169.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">策略模型</text><text x="525.0" y="193.5" font-size="14" fill="#6a6a6a" text-anchor="middle">采样多个完整解答</text><text x="525.0" y="215.5" font-size="14" fill="#6a6a6a" text-anchor="middle">&lt;think&gt;…&lt;/think&gt; + 答案</text><rect x="752.0" y="130.0" width="400.0" height="110.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="952.0" y="169.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">验证器</text><text x="952.0" y="193.5" font-size="14" fill="#6a6a6a" text-anchor="middle">数学：抽出最终答案，和标准答案比对</text><text x="952.0" y="215.5" font-size="14" fill="#6a6a6a" text-anchor="middle">代码：跑单元测试，全部通过才算对</text><line x1="302.0" y1="185.0" x2="394.0" y2="185.0" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><line x1="654.0" y1="185.0" x2="746.0" y2="185.0" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><path d="M952 244 V320 H525 V248" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><text x="738.0" y="310.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">奖励：答对 1，答错 0（再加一点格式奖励）</text><rect x="48.0" y="360.0" width="1104.0" height="130.0" rx="12" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="70.0" y="394.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">和上一篇的奖励模型比</text><text x="70.0" y="430.0" font-size="15" fill="#5a5a5a" text-anchor="start" font-weight="700">奖励模型：</text><text x="170.0" y="430.0" font-size="15" fill="#5a5a5a" text-anchor="start">学出来的近似，模型可以钻空子；偏好本身也说不清对错</text><text x="70.0" y="460.0" font-size="15" fill="#d97757" text-anchor="start" font-weight="700">验证器：</text><text x="170.0" y="460.0" font-size="15" fill="#5a5a5a" text-anchor="start">答案对就是对，没法靠写长、写得自信骗分；但只适用于能自动判对错的任务</text></svg>