<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1200" height="330" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">从 base 模型到助手：四个训练阶段</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">模型结构始终不变，每一步换的是数据和 loss</text><rect x="48.0" y="118.0" width="245.0" height="170.0" rx="12" fill="#f1eee9" stroke="#9a948c" stroke-width="2" filter="url(#soft)"/><text x="170.5" y="177.5" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="600">预训练</text><text x="170.5" y="201.5" font-size="14" fill="#6a6a6a" text-anchor="middle">海量网页、书、代码</text><text x="170.5" y="223.5" font-size="14" fill="#6a6a6a" text-anchor="middle">每个 token 都算 loss</text><text x="170.5" y="245.5" font-size="14" fill="#6a6a6a" text-anchor="middle"></text><text x="170.5" y="266.0" font-size="14" fill="#6a6a6a" text-anchor="middle" font-weight="600">学会语言和知识</text><line x1="301.0" y1="203.0" x2="337.0" y2="203.0" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><rect x="345.0" y="118.0" width="245.0" height="170.0" rx="12" fill="#f1eee9" stroke="#9a948c" stroke-width="2" filter="url(#soft)"/><text x="467.5" y="177.5" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="600">SFT</text><text x="467.5" y="201.5" font-size="14" fill="#6a6a6a" text-anchor="middle">指令-回答对话</text><text x="467.5" y="223.5" font-size="14" fill="#6a6a6a" text-anchor="middle">只算回答部分的 loss</text><text x="467.5" y="245.5" font-size="14" fill="#6a6a6a" text-anchor="middle"></text><text x="467.5" y="266.0" font-size="14" fill="#6a6a6a" text-anchor="middle" font-weight="600">学会格式和听指令</text><line x1="598.0" y1="203.0" x2="634.0" y2="203.0" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><rect x="642.0" y="118.0" width="245.0" height="170.0" rx="12" fill="#f1eee9" stroke="#9a948c" stroke-width="2" filter="url(#soft)"/><text x="764.5" y="177.5" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="600">RLHF / DPO</text><text x="764.5" y="201.5" font-size="14" fill="#6a6a6a" text-anchor="middle">同题两个回答，标出好坏</text><text x="764.5" y="223.5" font-size="14" fill="#6a6a6a" text-anchor="middle">拉开好坏回答的差距</text><text x="764.5" y="245.5" font-size="14" fill="#6a6a6a" text-anchor="middle"></text><text x="764.5" y="266.0" font-size="14" fill="#6a6a6a" text-anchor="middle" font-weight="600">学会人更喜欢的回答</text><line x1="895.0" y1="203.0" x2="931.0" y2="203.0" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><rect x="939.0" y="118.0" width="245.0" height="170.0" rx="12" fill="#e8e6e3" stroke="#d97757" stroke-width="3.5" filter="url(#soft)"/><text x="1061.5" y="177.5" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="600">推理 RL</text><text x="1061.5" y="201.5" font-size="14" fill="#6a6a6a" text-anchor="middle">有标准答案的题</text><text x="1061.5" y="223.5" font-size="14" fill="#6a6a6a" text-anchor="middle">答对给奖励</text><text x="1061.5" y="245.5" font-size="14" fill="#6a6a6a" text-anchor="middle"></text><text x="1061.5" y="266.0" font-size="14" fill="#d97757" text-anchor="middle" font-weight="600">学会长链条推理</text><rect x="1027.5" y="102.0" width="68.0" height="28.0" rx="14" fill="#f3d3c4" stroke="#d97757" stroke-width="2"/><text x="1061.5" y="121.0" font-size="14" fill="#d97757" text-anchor="middle" font-weight="700">本篇</text><text x="600.0" y="316.0" font-size="14" fill="#6a6a6a" text-anchor="middle">预训练消耗绝大部分算力；后面三步的数据量小几个数量级，但决定了模型怎么说话</text></svg>