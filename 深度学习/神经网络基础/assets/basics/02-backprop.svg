<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740"><style>text{font-family:'Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#2563eb"/></marker><marker id="arrow-o" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#ea580c"/></marker></defs><rect width="1200" height="740" fill="#ffffff"/><text x="40.0" y="48.0" font-size="30" fill="#111827" text-anchor="start">反向传播：前向算值，反向算梯度</text><text x="40.0" y="82.0" font-size="18" fill="#6b7280" text-anchor="start">两层网络 ŷ = w₂·ReLU(w₁x)，损失 L = ½(ŷ − y)²。蓝色是前向的值，橙色是反向的梯度 ∂L/∂(·)。</text><rect x="40" y="304" width="100" height="52" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/><text x="90.0" y="337.0" font-size="19" fill="#111827" text-anchor="middle">x</text><circle cx="260" cy="330" r="30" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><text x="260.0" y="337.0" font-size="19" fill="#111827" text-anchor="middle">×</text><rect x="350" y="304" width="100" height="52" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/><text x="400.0" y="337.0" font-size="19" fill="#111827" text-anchor="middle">z</text><circle cx="540" cy="330" r="30" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><text x="540.0" y="337.0" font-size="19" fill="#111827" text-anchor="middle">ReLU</text><rect x="630" y="304" width="100" height="52" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/><text x="680.0" y="337.0" font-size="19" fill="#111827" text-anchor="middle">h</text><circle cx="840" cy="330" r="30" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><text x="840.0" y="337.0" font-size="19" fill="#111827" text-anchor="middle">×</text><rect x="930" y="304" width="100" height="52" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/><text x="980.0" y="337.0" font-size="19" fill="#111827" text-anchor="middle">ŷ</text><rect x="1070" y="304" width="100" height="52" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="1120.0" y="337.0" font-size="19" fill="#111827" text-anchor="middle">L</text><rect x="210" y="164" width="100" height="52" rx="8" fill="#eff6ff" stroke="#d1d5db" stroke-width="2"/><text x="260.0" y="197.0" font-size="19" fill="#111827" text-anchor="middle">w₁</text><rect x="790" y="164" width="100" height="52" rx="8" fill="#eff6ff" stroke="#d1d5db" stroke-width="2"/><text x="840.0" y="197.0" font-size="19" fill="#111827" text-anchor="middle">w₂</text><rect x="1070" y="164" width="100" height="52" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/><text x="1120.0" y="197.0" font-size="19" fill="#111827" text-anchor="middle">y</text><path d="M140 322H230" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M290 322H350" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M450 322H510" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M570 322H630" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M730 322H810" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M870 322H930" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1030 322H1070" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M260 216V298" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M840 216V298" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1120 216V302" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="90.0" y="286.0" font-size="17" fill="#2563eb" text-anchor="middle">x = 2</text><text x="400.0" y="286.0" font-size="17" fill="#2563eb" text-anchor="middle">z = 1</text><text x="680.0" y="286.0" font-size="17" fill="#2563eb" text-anchor="middle">h = 1</text><text x="980.0" y="286.0" font-size="17" fill="#2563eb" text-anchor="middle">ŷ = 3</text><text x="1120.0" y="382.0" font-size="17" fill="#2563eb" text-anchor="middle">L = 2</text><text x="320.0" y="196.0" font-size="17" fill="#2563eb" text-anchor="start">= 0.5</text><text x="900.0" y="196.0" font-size="17" fill="#2563eb" text-anchor="start">= 3</text><text x="1060.0" y="196.0" font-size="17" fill="#2563eb" text-anchor="end">= 1</text><path d="M1100 400H1000" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrow-o)"/><path d="M960 400H700" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrow-o)"/><path d="M660 400H420" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrow-o)"/><path d="M380 400H160" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arrow-o)"/><text x="980.0" y="434.0" font-size="16" fill="#ea580c" text-anchor="middle">∂L/∂ŷ = ŷ − y = 2</text><text x="680.0" y="434.0" font-size="16" fill="#ea580c" text-anchor="middle">∂L/∂h = 2 × w₂ = 6</text><text x="400.0" y="434.0" font-size="16" fill="#ea580c" text-anchor="middle">∂L/∂z = 6 × 1 = 6</text><text x="400.0" y="458.0" font-size="14" fill="#6b7280" text-anchor="middle">ReLU′(1) = 1</text><text x="680.0" y="458.0" font-size="14" fill="#6b7280" text-anchor="middle">× 的导数是另一个输入</text><rect x="140" y="560" width="400" height="92" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="160.0" y="596.0" font-size="18" fill="#111827" text-anchor="start">∂L/∂w₁ = ∂L/∂z × x = 6 × 2 = 12</text><text x="160.0" y="628.0" font-size="17" fill="#6b7280" text-anchor="start">w₁ ← 0.5 − 0.01 × 12 = 0.38</text><rect x="660" y="560" width="400" height="92" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="680.0" y="596.0" font-size="18" fill="#111827" text-anchor="start">∂L/∂w₂ = ∂L/∂ŷ × h = 2 × 1 = 2</text><text x="680.0" y="628.0" font-size="17" fill="#6b7280" text-anchor="start">w₂ ← 3 − 0.01 × 2 = 2.98</text><text x="40.0" y="700.0" font-size="18" fill="#6b7280" text-anchor="start">学习率 0.01 更新一步后，重新前向：ŷ ≈ 2.265，L 从 2 降到 0.80。</text></svg>