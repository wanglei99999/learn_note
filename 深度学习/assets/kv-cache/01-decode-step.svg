<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><style>text{font-family:'Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#2563eb"/></marker></defs><rect width="1200" height="700" fill="#ffffff"/><text x="40" y="48" font-size="30" fill="#111827" text-anchor="start">Decode 一步：只为新 token 计算 q、k、v</text><text x="40" y="82" font-size="18" fill="#6b7280" text-anchor="start">以一层 attention 为例；每一层各自维护一份 KV Cache。</text><path d="M260 345H320" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M290 345V182H320" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M290 345V482H320" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M440 345H548" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M440 482H548" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M440 182H1045V300" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M870 355H930" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1045 410V490" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="300" width="220" height="90" rx="8" fill="#eff6ff" stroke="#d1d5db" stroke-width="2"/><text x="150" y="337" font-size="23" fill="#111827" text-anchor="middle">新 token x<tspan font-size="16" baseline-shift="sub">t</tspan></text><text x="150" y="369" font-size="17" fill="#6b7280" text-anchor="middle">经 W_Q、W_K、W_V 投影</text><rect x="320" y="150" width="120" height="64" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/><text x="380" y="190" font-size="23" fill="#111827" text-anchor="middle">q<tspan font-size="16" baseline-shift="sub">t</tspan></text><rect x="320" y="313" width="120" height="64" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="380" y="353" font-size="23" fill="#111827" text-anchor="middle">k<tspan font-size="16" baseline-shift="sub">t</tspan></text><rect x="320" y="450" width="120" height="64" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="380" y="490" font-size="23" fill="#111827" text-anchor="middle">v<tspan font-size="16" baseline-shift="sub">t</tspan></text><text x="700" y="170" font-size="18" fill="#6b7280" text-anchor="middle">q<tspan font-size="12" baseline-shift="sub">t</tspan> 只在本步使用，用完即丢，不缓存</text><text x="495" y="333" font-size="16" fill="#2563eb" text-anchor="middle">写入缓存</text><text x="495" y="470" font-size="16" fill="#2563eb" text-anchor="middle">写入缓存</text><rect x="530" y="260" width="340" height="300" rx="8" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6,4"/><text x="550" y="292" font-size="20" fill="#111827" text-anchor="start">KV Cache（这一层）</text><rect x="550" y="310" width="220" height="70" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/><text x="660" y="352" font-size="20" fill="#111827" text-anchor="middle">k<tspan font-size="14" baseline-shift="sub">1</tspan> … k<tspan font-size="14" baseline-shift="sub">t-1</tspan></text><rect x="780" y="310" width="70" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="815" y="352" font-size="21" fill="#111827" text-anchor="middle">k<tspan font-size="14" baseline-shift="sub">t</tspan></text><rect x="550" y="447" width="220" height="70" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/><text x="660" y="489" font-size="20" fill="#111827" text-anchor="middle">v<tspan font-size="14" baseline-shift="sub">1</tspan> … v<tspan font-size="14" baseline-shift="sub">t-1</tspan></text><rect x="780" y="447" width="70" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="815" y="489" font-size="21" fill="#111827" text-anchor="middle">v<tspan font-size="14" baseline-shift="sub">t</tspan></text><text x="660" y="400" font-size="15" fill="#6b7280" text-anchor="middle">历史 token，已缓存</text><text x="815" y="400" font-size="15" fill="#2563eb" text-anchor="middle">本步新增</text><text x="660" y="537" font-size="15" fill="#6b7280" text-anchor="middle">历史 token，已缓存</text><text x="815" y="537" font-size="15" fill="#2563eb" text-anchor="middle">本步新增</text><text x="900" y="345" font-size="16" fill="#2563eb" text-anchor="middle">读取</text><rect x="930" y="300" width="230" height="110" rx="8" fill="#eff6ff" stroke="#d1d5db" stroke-width="2"/><text x="1045" y="335" font-size="23" fill="#111827" text-anchor="middle">Attention</text><text x="1045" y="365" font-size="17" fill="#6b7280" text-anchor="middle">softmax(q·Kᵀ/√d)·V</text><text x="1045" y="391" font-size="17" fill="#6b7280" text-anchor="middle">读取全部 K、V</text><rect x="930" y="490" width="230" height="80" rx="8" fill="#f0fdf4" stroke="#d1d5db" stroke-width="2"/><text x="1045" y="524" font-size="23" fill="#111827" text-anchor="middle">输出 o<tspan font-size="16" baseline-shift="sub">t</tspan></text><text x="1045" y="554" font-size="17" fill="#6b7280" text-anchor="middle">送入下一层</text><text x="40" y="650" font-size="18" fill="#6b7280" text-anchor="start">下一步生成 x<tspan font-size="12" baseline-shift="sub">t+1</tspan> 时，k<tspan font-size="12" baseline-shift="sub">t</tspan>、v<tspan font-size="12" baseline-shift="sub">t</tspan> 已在缓存中，直接读取，不需要重新计算整个序列。</text></svg>