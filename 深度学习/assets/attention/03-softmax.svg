<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><style>text{font-family:'Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#2563eb"/></marker><marker id="arrow-g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#059669"/></marker></defs><rect width="1200" height="780" fill="#ffffff"/><text x="40" y="48" font-size="30" fill="#111827" text-anchor="start">softmax：把一组分数变成加起来等于 1 的比例</text><text x="40" y="82" font-size="18" fill="#6b7280" text-anchor="start">三个 token 的分数，先取 e 的指数，再除以总和。每个小图的纵轴各自缩放。</text><text x="40" y="140" font-size="21" fill="#111827" text-anchor="start">例 1：s = [2, 1, 0]</text><path d="M360 275H440" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="400" y="263" font-size="16" fill="#2563eb" text-anchor="middle">取 e 指数</text><path d="M760 275H840" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="800" y="263" font-size="16" fill="#2563eb" text-anchor="middle">除以总和</text><rect x="40" y="160" width="320" height="230" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="60" y="192" font-size="18" fill="#111827" text-anchor="start">分数 s</text><line x1="64" y1="350" x2="336" y2="350" stroke="#d1d5db" stroke-width="1.5"/><path d="M88 350V244.0Q88 240.0 92 240.0H132Q136 240.0 136 244.0V350Z" fill="#2563eb"/><text x="112.0" y="232.0" font-size="16" fill="#111827" text-anchor="middle">2</text><text x="112.0" y="372" font-size="16" fill="#6b7280" text-anchor="middle">x<tspan font-size="11" baseline-shift="sub">1</tspan></text><path d="M176 350V299.0Q176 295.0 180 295.0H220Q224 295.0 224 299.0V350Z" fill="#2563eb"/><text x="200.0" y="287.0" font-size="16" fill="#111827" text-anchor="middle">1</text><text x="200.0" y="372" font-size="16" fill="#6b7280" text-anchor="middle">x<tspan font-size="11" baseline-shift="sub">2</tspan></text><path d="M264 350V349.0Q264 348.0 265.0 348.0H311.0Q312 348.0 312 349.0V350Z" fill="#2563eb"/><text x="288.0" y="340" font-size="16" fill="#111827" text-anchor="middle">0</text><text x="288.0" y="372" font-size="16" fill="#6b7280" text-anchor="middle">x<tspan font-size="11" baseline-shift="sub">3</tspan></text><rect x="440" y="160" width="320" height="230" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="460" y="192" font-size="18" fill="#111827" text-anchor="start">eˢ</text><line x1="464" y1="350" x2="736" y2="350" stroke="#d1d5db" stroke-width="1.5"/><path d="M488 350V244.0Q488 240.0 492 240.0H532Q536 240.0 536 244.0V350Z" fill="#2563eb"/><text x="512.0" y="232.0" font-size="16" fill="#111827" text-anchor="middle">7.39</text><text x="512.0" y="372" font-size="16" fill="#6b7280" text-anchor="middle">x<tspan font-size="11" baseline-shift="sub">1</tspan></text><path d="M576 350V313.5Q576 309.5 580 309.5H620Q624 309.5 624 313.5V350Z" fill="#2563eb"/><text x="600.0" y="301.5128552097429" font-size="16" fill="#111827" text-anchor="middle">2.72</text><text x="600.0" y="372" font-size="16" fill="#6b7280" text-anchor="middle">x<tspan font-size="11" baseline-shift="sub">2</tspan></text><path d="M664 350V339.1Q664 335.1 668 335.1H708Q712 335.1 712 339.1V350Z" fill="#2563eb"/><text x="688.0" y="327.1150202976996" font-size="16" fill="#111827" text-anchor="middle">1.00</text><text x="688.0" y="372" font-size="16" fill="#6b7280" text-anchor="middle">x<tspan font-size="11" baseline-shift="sub">3</tspan></text><rect x="840" y="160" width="320" height="230" rx="8" fill="#f0fdf4" stroke="#e5e7eb" stroke-width="2"/><text x="860" y="192" font-size="18" fill="#111827" text-anchor="start">softmax（总和为 1）</text><line x1="864" y1="350" x2="1136" y2="350" stroke="#d1d5db" stroke-width="1.5"/><path d="M888 350V280.9Q888 276.9 892 276.9H932Q936 276.9 936 280.9V350Z" fill="#2563eb"/><text x="912.0" y="268.85" font-size="16" fill="#111827" text-anchor="middle">0.665</text><text x="912.0" y="372" font-size="16" fill="#6b7280" text-anchor="middle">x<tspan font-size="11" baseline-shift="sub">1</tspan></text><path d="M976 350V327.1Q976 323.1 980 323.1H1020Q1024 323.1 1024 327.1V350Z" fill="#2563eb"/><text x="1000.0" y="315.05" font-size="16" fill="#111827" text-anchor="middle">0.245</text><text x="1000.0" y="372" font-size="16" fill="#6b7280" text-anchor="middle">x<tspan font-size="11" baseline-shift="sub">2</tspan></text><path d="M1064 350V344.1Q1064 340.1 1068 340.1H1108Q1112 340.1 1112 344.1V350Z" fill="#2563eb"/><text x="1088.0" y="332.1" font-size="16" fill="#111827" text-anchor="middle">0.090</text><text x="1088.0" y="372" font-size="16" fill="#6b7280" text-anchor="middle">x<tspan font-size="11" baseline-shift="sub">3</tspan></text><text x="40" y="450" font-size="21" fill="#111827" text-anchor="start">例 2：s = [20, 10, 0]，分数放大 10 倍</text><path d="M360 585H440" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="400" y="573" font-size="16" fill="#2563eb" text-anchor="middle">取 e 指数</text><path d="M760 585H840" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="800" y="573" font-size="16" fill="#2563eb" text-anchor="middle">除以总和</text><rect x="40" y="470" width="320" height="230" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="60" y="502" font-size="18" fill="#111827" text-anchor="start">分数 s</text><line x1="64" y1="660" x2="336" y2="660" stroke="#d1d5db" stroke-width="1.5"/><path d="M88 660V554.0Q88 550.0 92 550.0H132Q136 550.0 136 554.0V660Z" fill="#2563eb"/><text x="112.0" y="542.0" font-size="16" fill="#111827" text-anchor="middle">20</text><text x="112.0" y="682" font-size="16" fill="#6b7280" text-anchor="middle">x<tspan font-size="11" baseline-shift="sub">1</tspan></text><path d="M176 660V609.0Q176 605.0 180 605.0H220Q224 605.0 224 609.0V660Z" fill="#2563eb"/><text x="200.0" y="597.0" font-size="16" fill="#111827" text-anchor="middle">10</text><text x="200.0" y="682" font-size="16" fill="#6b7280" text-anchor="middle">x<tspan font-size="11" baseline-shift="sub">2</tspan></text><path d="M264 660V659.0Q264 658.0 265.0 658.0H311.0Q312 658.0 312 659.0V660Z" fill="#2563eb"/><text x="288.0" y="650" font-size="16" fill="#111827" text-anchor="middle">0</text><text x="288.0" y="682" font-size="16" fill="#6b7280" text-anchor="middle">x<tspan font-size="11" baseline-shift="sub">3</tspan></text><rect x="440" y="470" width="320" height="230" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="460" y="502" font-size="18" fill="#111827" text-anchor="start">eˢ</text><line x1="464" y1="660" x2="736" y2="660" stroke="#d1d5db" stroke-width="1.5"/><path d="M488 660V554.0Q488 550.0 492 550.0H532Q536 550.0 536 554.0V660Z" fill="#2563eb"/><text x="512.0" y="542.0" font-size="16" fill="#111827" text-anchor="middle">4.85×10⁸</text><text x="512.0" y="682" font-size="16" fill="#6b7280" text-anchor="middle">x<tspan font-size="11" baseline-shift="sub">1</tspan></text><path d="M576 660V659.0Q576 658.0 577.0 658.0H623.0Q624 658.0 624 659.0V660Z" fill="#2563eb"/><text x="600.0" y="650" font-size="16" fill="#111827" text-anchor="middle">2.2×10⁴</text><text x="600.0" y="682" font-size="16" fill="#6b7280" text-anchor="middle">x<tspan font-size="11" baseline-shift="sub">2</tspan></text><path d="M664 660V659.0Q664 658.0 665.0 658.0H711.0Q712 658.0 712 659.0V660Z" fill="#2563eb"/><text x="688.0" y="650" font-size="16" fill="#111827" text-anchor="middle">1</text><text x="688.0" y="682" font-size="16" fill="#6b7280" text-anchor="middle">x<tspan font-size="11" baseline-shift="sub">3</tspan></text><rect x="840" y="470" width="320" height="230" rx="8" fill="#f0fdf4" stroke="#e5e7eb" stroke-width="2"/><text x="860" y="502" font-size="18" fill="#111827" text-anchor="start">softmax（总和为 1）</text><line x1="864" y1="660" x2="1136" y2="660" stroke="#d1d5db" stroke-width="1.5"/><path d="M888 660V554.0Q888 550.0 892 550.0H932Q936 550.0 936 554.0V660Z" fill="#2563eb"/><text x="912.0" y="542.0055" font-size="16" fill="#111827" text-anchor="middle">≈1.000</text><text x="912.0" y="682" font-size="16" fill="#6b7280" text-anchor="middle">x<tspan font-size="11" baseline-shift="sub">1</tspan></text><path d="M976 660V659.0Q976 658.0 977.0 658.0H1023.0Q1024 658.0 1024 659.0V660Z" fill="#2563eb"/><text x="1000.0" y="650" font-size="16" fill="#111827" text-anchor="middle">0.00005</text><text x="1000.0" y="682" font-size="16" fill="#6b7280" text-anchor="middle">x<tspan font-size="11" baseline-shift="sub">2</tspan></text><path d="M1064 660V659.0Q1064 658.0 1065.0 658.0H1111.0Q1112 658.0 1112 659.0V660Z" fill="#2563eb"/><text x="1088.0" y="650" font-size="16" fill="#111827" text-anchor="middle">≈0</text><text x="1088.0" y="682" font-size="16" fill="#6b7280" text-anchor="middle">x<tspan font-size="11" baseline-shift="sub">3</tspan></text><text x="40" y="740" font-size="18" fill="#6b7280" text-anchor="start">softmax 只看分数之间的差距。差距被放大 10 倍后，几乎全部权重都集中到一个 token 上，这就是 attention 要除以 √d 的原因。</text></svg>