<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#5a5a5a"/></marker><marker id="arrow-clay" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1200" height="610" fill="#f8f6f3"/><text x="40" y="48" font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700">MHA / GQA / MQA：多少个 Q 头共用一组 K、V</text><text x="40" y="82" font-size="18" fill="#6a6a6a" text-anchor="start">以 8 个 Q 头为例；绿色的 K、V 头会进入 KV Cache，Q 头不缓存。</text><rect x="40" y="110" width="360" height="420" rx="8" fill="#ffffff" stroke="#e2ddd6" stroke-width="2"/><text x="64" y="150" font-size="23" fill="#1a1a1a" text-anchor="start">MHA</text><text x="64" y="178" font-size="17" fill="#6a6a6a" text-anchor="start">每个 Q 头有自己的 K、V</text><text x="64" y="210" font-size="16" fill="#6a6a6a" text-anchor="start">Q 头（8 个）</text><path d="M80 254L80 360" stroke="#9a948c" stroke-width="1.5" fill="none"/><path d="M120 254L120 360" stroke="#9a948c" stroke-width="1.5" fill="none"/><path d="M160 254L160 360" stroke="#9a948c" stroke-width="1.5" fill="none"/><path d="M200 254L200 360" stroke="#9a948c" stroke-width="1.5" fill="none"/><path d="M240 254L240 360" stroke="#9a948c" stroke-width="1.5" fill="none"/><path d="M280 254L280 360" stroke="#9a948c" stroke-width="1.5" fill="none"/><path d="M320 254L320 360" stroke="#9a948c" stroke-width="1.5" fill="none"/><path d="M360 254L360 360" stroke="#9a948c" stroke-width="1.5" fill="none"/><rect x="63" y="220" width="34" height="34" rx="8" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5"/><rect x="103" y="220" width="34" heigh