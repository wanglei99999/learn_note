 stroke-width="2.5"/><rect x="1103" y="220" width="34" height="34" rx="8" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5"/><rect x="917" y="360" width="126" height="40" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="824" y="432" font-size="16" fill="#6a6a6a" text-anchor="start">KV 头（1 个）</text><text x="824" y="476" font-size="21" fill="#1a1a1a" text-anchor="start">KV Cache：1/8</text><text x="824" y="506" font-size="17" fill="#6a6a6a" text-anchor="start">代表：Falcon-7B、PaLM</text><text x="40" y="575" font-size="18" fill="#6a6a6a" text-anchor="start">Q 不进缓存，所以只减少 KV 头数就能直接缩小 KV Cache；共享越多越省显存，效果损失也可能越大，GQA 是常见的折中。</text></svg>