<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arrow-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1200" height="720" fill="#f8f6f3"/><text x="40" y="48" font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700">因果注意力：每个 token 只能看自己和前面的 token</text><text x="40" y="82" font-size="18" fill="#6a6a6a" text-anchor="start">分数矩阵 QKᵀ 加上 causal mask：右上三角（未来位置）置为 −∞，softmax 后权重为 0。</text><path d="M584 376H660" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="622" y="364" font-size="16" fill="#d97757" text-anchor="middle">取第 3 行</text><text x="392" y="150" font-size="18" fill="#6a6a6a" text-anchor="middle">被关注的 token（提供 K）</text><text x="80" y="340" font-size="18" fill="#6a6a6a" text-anchor="middle" transform="rotate(-90 80 340)">提问的 token（提供 Q）</text><text x="245" y="186" font-size="20" fill="#1a1a1a" text-anchor="middle">k<tspan font-size="14" baseline-shift="sub">1</tspan></text><text x="343" y="186" font-size="20" fill="#1a1a1a" text-anchor="middle">k<tspan font-size="14" baseline-shift="sub">2</tspan></text><text x="441" y="186" font-size="20" fill="#1a1a1a" text-anchor="middle">k<tspan font-size="14" baseline-shift="sub">3</tspan></text><text x="539" y="186" font-size="20" fill="#1a1a1a" text-anchor="middle">k<tspan font-size="14" baseline-shift="sub">4</tspan></text><text x="176" y="240" font-size="20" fill="#1a1a1a" text-anchor="end">q<tspan font-size="14" baseline-shift="sub">1</tspan></text><rect x="200" y="200" width="90" height="64" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="245" y="238" font-size="17" fill="#1a1a1a" text-anchor="middle">自身</text><rect x="298" y="200" width="90" height="64" rx="8" fill="#ece8e3" stroke="#e2ddd6" stroke-width="2"/><text x="343" y="239" font-size="20" fill="#9a948c" text-anchor="middle">−∞</text><rect x="396" y="200" width="90" height="64" rx="8" fill="#ece8e3" stroke="#e2ddd6" stroke-width="2"/><text x="441" y="239" font-size="20" fill="#9a948c" text-anchor="middle">−∞</text><rect x="494" y="200" width="90" height="64" rx="8" fill="#ece8e3" stroke="#e2ddd6" stroke-width="2"/><text x="539" y="239" font-size="20" fill="#9a948c" text-anchor="middle">−∞</text><text x="176" y="312" font-size="20" fill="#1a1a1a" text-anchor="end">q<tspan font-size="14" baseline-shift="sub">2</tspan></text><rect x="200" y="272" width="90" height="64" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="245" y="310" font-size="17" fill="#1a1a1a" text-anchor="middle">可见</text><rect x="298" y="272" width="90" height="64" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="343" y="310" font-size="17" fill="#1a1a1a" text-anchor="middle">自身</text><rect x="396" y="272" width="90" height="64" rx="8" fill="#ece8e3" stroke="#e2ddd6" stroke-width="2"/><text x="441" y="311" font-size="20" fill="#9a948c" text-anchor="middle">−∞</text><rect x="494" y="272" width="90" height="64" rx="8" fill="#ece8e3" stroke="#e2ddd6" stroke-width="2"/><text x="539" y="311" font-size="20" fill="#9a948c" text-anchor="middle">−∞</text><text x="176" y="384" font-size="20" fill="#1a1a1a" text-anchor="end">q<tspan font-size="14" baseline-shift="sub">3</tspan></text><rect x="200" y="344" width="90" height="64" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="245" y="382" font-size="17" fill="#1a1a1a" text-anchor="middle">可见</text><rect x="298" y="344" width="90" height="64" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="343" y="382" font-size="17" fill="#1a1a1a" text-anchor="middle">可见</text><rect x="396" y="344" width="90" height="64" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="441" y="382" font-size="17" fill="#1a1a1a" text-anchor="middle">自身</text><rect x="494" y="344" width="90" height="64" rx="8" fill="#ece8e3" stroke="#e2ddd6" stroke-width="2"/><text x="539" y="383" font-size="20" fill="#9a948c" text-anchor="middle">−∞</text><text x="176" y="456" font-size="20" fill="#1a1a1a" text-anchor="end">q<tspan font-size="14" baseline-shift="sub">4</tspan></text><rect x="200" y="416" width="90" height="64" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="245" y="454" font-size="17" fill="#1a1a1a" text-anchor="middle">可见</text><rect x="298" y="416" width="90" height="64" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="343" y="454" font-size="17" fill="#1a1a1a" text-anchor="middle">可见</text><rect x="396" y="416" width="90" height="64" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="441" y="454" font-size="17" fill="#1a1a1a" text-anchor="middle">可见</text><rect x="494" y="416" width="90" height="64" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="539" y="454" font-size="17" fill="#1a1a1a" text-anchor="middle">自身</text><rect x="660" y="200" width="500" height="280" rx="8" fill="#ffffff" stroke="#e2ddd6" stroke-width="2"/><text x="684" y="240" font-size="20" fill="#1a1a1a" text-anchor="start">以第 3 行为例（权重仅作示意）</text><text x="684" y="272" font-size="17" fill="#6a6a6a" text-anchor="start">softmax 后每行权重和为 1，未来位置恒为 0</text><rect x="684" y="344" width="100" height="64" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="734" y="384" font-size="19" fill="#1a1a1a" text-anchor="middle">k<tspan font-size="13" baseline-shift="sub">1</tspan> · 0.2</text><rect x="792" y="344" width="100" height="64" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="842" y="384" font-size="19" fill="#1a1a1a" text-anchor="middle">k<tspan font-size="13" baseline-shift="sub">2</tspan> · 0.3</text><rect x="900" y="344" width="100" height="64" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="950" y="384" font-size="19" fill="#1a1a1a" text-anchor="middle">k<tspan font-size="13" baseline-shift="sub">3</tspan> · 0.5</text><rect x="1008" y="344" width="100" height="64" rx="8" fill="#ece8e3" stroke="#e2ddd6" stroke-width="2"/><text x="1058" y="384" font-size="19" fill="#9a948c" text-anchor="middle">k<tspan font-size="13" baseline-shift="sub">4</tspan> · 0</text><text x="684" y="448" font-size="17" fill="#6a6a6a" text-anchor="start">o<tspan font-size="12" baseline-shift="sub">3</tspan> = 0.2·v<tspan font-size="12" baseline-shift="sub">1</tspan> + 0.3·v<tspan font-size="12" baseline-shift="sub">2</tspan> + 0.5·v<tspan font-size="12" baseline-shift="sub">3</tspan>，完全不含 v<tspan font-size="12" baseline-shift="sub">4</tspan></text><rect x="40" y="530" width="360" height="96" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="220" y="568" font-size="21" fill="#1a1a1a" text-anchor="middle">训练时</text><text x="220" y="600" font-size="17" fill="#6a6a6a" text-anchor="middle">整句并行计算，mask 防止偷看答案</text><rect x="420" y="530" width="360" height="96" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="600" y="568" font-size="21" fill="#1a1a1a" text-anchor="middle">推理时</text><text x="600" y="600" font-size="17" fill="#6a6a6a" text-anchor="middle">后面的 token 还没生成，本来就看不到</text><rect x="800" y="530" width="360" height="96" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="980" y="568" font-size="21" fill="#1a1a1a" text-anchor="middle">对 KV Cache</text><text x="980" y="600" font-size="17" fill="#6a6a6a" text-anchor="middle">历史 K、V 算完不再变，可以缓存</text><text x="40" y="680" font-size="18" fill="#6a6a6a" text-anchor="start">对比：BERT 等双向注意力不加 mask，每个 token 都能看整句；新 token 一来，前面所有表示都会变，无法这样缓存。</text></svg>