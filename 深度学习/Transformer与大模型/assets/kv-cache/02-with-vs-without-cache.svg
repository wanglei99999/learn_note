<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><style>text{font-family:'Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#2563eb"/></marker></defs><rect width="1200" height="760" fill="#ffffff"/><text x="40" y="48" font-size="30" fill="#111827" text-anchor="start">有无 KV Cache：每一步要算多少个 token 的 K、V？</text><text x="40" y="82" font-size="18" fill="#6b7280" text-anchor="start">示意：生成到第 4 步，每格代表一个 token 在某一层的 K、V。</text><rect x="40" y="110" width="540" height="520" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="64" y="150" font-size="23" fill="#111827" text-anchor="start">无 KV Cache</text><text x="64" y="180" font-size="17" fill="#6b7280" text-anchor="start">每一步都把整个序列重新算一遍</text><text x="64" y="251" font-size="18" fill="#111827" text-anchor="start">第 1 步</text><rect x="150" y="220" width="70" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="185" y="251" font-size="18" fill="#111827" text-anchor="middle">x<tspan font-size="12" baseline-shift="sub">1</tspan></text><text x="476" y="251" font-size="17" fill="#6b7280" text-anchor="start">算 1 个</text><text x="64" y="331" font-size="18" fill="#111827" text-anchor="start">第 2 步</text><rect x="150" y="300" width="70" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="185" y="331" font-size="18" fill="#111827" text-anchor="middle">x<tspan font-size="12" baseline-shift="sub">1</tspan></text><rect x="230" y="300" width="70" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="265" y="331" font-size="18" fill="#111827" text-anchor="middle">x<tspan font-size="12" baseline-shift="sub">2</tspan></text><text x="476" y="331" font-size="17" fill="#6b7280" text-anchor="start">算 2 个</text><text x="64" y="411" font-size="18" fill="#111827" text-anchor="start">第 3 步</text><rect x="150" y="380" width="70" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="185" y="411" font-size="18" fill="#111827" text-anchor="middle">x<tspan font-size="12" baseline-shift="sub">1</tspan></text><rect x="230" y="380" width="70" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="265" y="411" font-size="18" fill="#111827" text-anchor="middle">x<tspan font-size="12" baseline-shift="sub">2</tspan></text><rect x="310" y="380" width="70" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="345" y="411" font-size="18" fill="#111827" text-anchor="middle">x<tspan font-size="12" baseline-shift="sub">3</tspan></text><text x="476" y="411" font-size="17" fill="#6b7280" text-anchor="start">算 3 个</text><text x="64" y="491" font-size="18" fill="#111827" text-anchor="start">第 4 步</text><rect x="150" y="460" width="70" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="185" y="491" font-size="18" fill="#111827" text-anchor="middle">x<tspan font-size="12" baseline-shift="sub">1</tspan></text><rect x="230" y="460" width="70" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="265" y="491" font-size="18" fill="#111827" text-anchor="middle">x<tspan font-size="12" baseline-shift="sub">2</tspan></text><rect x="310" y="460" width="70" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="345" y="491" font-size="18" fill="#111827" text-anchor="middle">x<tspan font-size="12" baseline-shift="sub">3</tspan></text><rect x="390" y="460" width="70" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="425" y="491" font-size="18" fill="#111827" text-anchor="middle">x<tspan font-size="12" baseline-shift="sub">4</tspan></text><text x="476" y="491" font-size="17" fill="#6b7280" text-anchor="start">算 4 个</text><text x="64" y="570" font-size="18" fill="#111827" text-anchor="start">生成 n 个 token 共算 1+2+…+n 次</text><text x="64" y="600" font-size="18" fill="#6b7280" text-anchor="start">约 n²/2，随长度平方增长</text><rect x="620" y="110" width="540" height="520" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="644" y="150" font-size="23" fill="#111827" text-anchor="start">有 KV Cache</text><text x="644" y="180" font-size="17" fill="#6b7280" text-anchor="start">每一步只算新 token，其余从缓存读取</text><text x="644" y="251" font-size="18" fill="#111827" text-anchor="start">第 1 步</text><rect x="730" y="220" width="70" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="765" y="251" font-size="18" fill="#111827" text-anchor="middle">x<tspan font-size="12" baseline-shift="sub">1</tspan></text><text x="1056" y="251" font-size="17" fill="#6b7280" text-anchor="start">算 1 · 读 0</text><text x="644" y="331" font-size="18" fill="#111827" text-anchor="start">第 2 步</text><rect x="730" y="300" width="70" height="48" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="765" y="331" font-size="18" fill="#111827" text-anchor="middle">x<tspan font-size="12" baseline-shift="sub">1</tspan></text><rect x="810" y="300" width="70" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="845" y="331" font-size="18" fill="#111827" text-anchor="middle">x<tspan font-size="12" baseline-shift="sub">2</tspan></text><text x="1056" y="331" font-size="17" fill="#6b7280" text-anchor="start">算 1 · 读 1</text><text x="644" y="411" font-size="18" fill="#111827" text-anchor="start">第 3 步</text><rect x="730" y="380" width="70" height="48" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="765" y="411" font-size="18" fill="#111827" text-anchor="middle">x<tspan font-size="12" baseline-shift="sub">1</tspan></text><rect x="810" y="380" width="70" height="48" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="845" y="411" font-size="18" fill="#111827" text-anchor="middle">x<tspan font-size="12" baseline-shift="sub">2</tspan></text><rect x="890" y="380" width="70" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="925" y="411" font-size="18" fill="#111827" text-anchor="middle">x<tspan font-size="12" baseline-shift="sub">3</tspan></text><text x="1056" y="411" font-size="17" fill="#6b7280" text-anchor="start">算 1 · 读 2</text><text x="644" y="491" font-size="18" fill="#111827" text-anchor="start">第 4 步</text><rect x="730" y="460" width="70" height="48" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="765" y="491" font-size="18" fill="#111827" text-anchor="middle">x<tspan font-size="12" baseline-shift="sub">1</tspan></text><rect x="810" y="460" width="70" height="48" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="845" y="491" font-size="18" fill="#111827" text-anchor="middle">x<tspan font-size="12" baseline-shift="sub">2</tspan></text><rect x="890" y="460" width="70" height="48" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="925" y="491" font-size="18" fill="#111827" text-anchor="middle">x<tspan font-size="12" baseline-shift="sub">3</tspan></text><rect x="970" y="460" width="70" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="1005" y="491" font-size="18" fill="#111827" text-anchor="middle">x<tspan font-size="12" baseline-shift="sub">4</tspan></text><text x="1056" y="491" font-size="17" fill="#6b7280" text-anchor="start">算 1 · 读 3</text><text x="644" y="570" font-size="18" fill="#111827" text-anchor="start">生成 n 个 token 共算 n 次</text><text x="644" y="600" font-size="18" fill="#6b7280" text-anchor="start">代价：显存要保存全部历史 K、V</text><rect x="40" y="660" width="28" height="20" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="78" y="677" font-size="17" fill="#111827" text-anchor="start">本步计算 K、V</text><rect x="240" y="660" width="28" height="20" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="278" y="677" font-size="17" fill="#111827" text-anchor="start">从 KV Cache 读取</text><text x="40" y="725" font-size="17" fill="#6b7280" text-anchor="start">这里只统计 K、V 的投影计算；有缓存时 attention 每步仍要与全部历史 token 计算，所以长上下文依旧更慢。</text></svg>