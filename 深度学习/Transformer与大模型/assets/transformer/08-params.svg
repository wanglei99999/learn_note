<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arrow-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1200" height="600" fill="#f8f6f3"/><text x="40" y="48" font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700">Llama-2-7B 的参数：FFN 约占三分之二</text><text x="40" y="82" font-size="18" fill="#6a6a6a" text-anchor="start">合计 6,738,415,616 个参数；归一化层共 26.6 万个，在图中不可见。</text><rect x="40" y="112" width="18" height="18" rx="4" fill="#4f86c0"/><text x="68" y="127" font-size="17" fill="#1a1a1a" text-anchor="start">FFN</text><rect x="130" y="112" width="18" height="18" rx="4" fill="#d97757"/><text x="158" y="127" font-size="17" fill="#1a1a1a" text-anchor="start">attention</text><rect x="280" y="112" width="18" height="18" rx="4" fill="#3f9c86"/><text x="308" y="127" font-size="17" fill="#1a1a1a" text-anchor="start">embedding</text><rect x="430" y="112" width="18" height="18" rx="4" fill="#c29a2b"/><text x="458" y="127" font-size="17" fill="#1a1a1a" text-anchor="start">LM head</text><text x="40" y="186" font-size="20" fill="#1a1a1a" text-anchor="start">整个模型</text><path d="M44 200H757.4486970867189V252H44Q40 252 40 248V204Q40 200 44 200Z" fill="#4f86c0"/><rect x="759.4486970867189" y="200" width="354.93578770193807" height="52" fill="#d97757"/><rect x="1116.384484788657" y="200" width="19.78563157360462" height="52" fill="#3f9c86"/><path d="M1138.1701163622615 200H1155.9557479358662Q1159.9557479358662 200 1159.9557479358662 204V248Q1159.9557479358662 252 1155.9557479358662 252H1138.1701163622615Z" fill="#c29a2b"/><text x="399.72434854335944" y="284" font-size="18" fill="#1a1a1a" text-anchor="middle">FFN 64.2%</text><text x="399.72434854335944" y="308" font-size="16" fill="#6a6a6a" text-anchor="middle">43.3 亿</text><text x="937.9165909376879" y="284" font-size="18" fill="#1a1a1a" text-anchor="middle">attention 31.9%</text><text x="937.9165909376879" y="308" font-size="16" fill="#6a6a6a" text-anchor="middle">21.5 亿</text><path d="M1138.384484788657 197V186" fill="none" stroke="#6a6a6a" stroke-width="1.5"/><text x="1160" y="180" font-size="16" fill="#1a1a1a" text-anchor="end">embedding + LM head 3.9%（各 1.31 亿）</text><text x="40" y="386" font-size="20" fill="#1a1a1a" text-anchor="start">单个 block（共 32 个）</text><path d="M44 400H786.5707346690954V452H44Q40 452 40 448V404Q40 400 44 400Z" fill="#4f86c0"/><path d="M788.5707346690954 400H1155.9546650475613Q1159.9546650475613 400 1159.9546650475613 404V448Q1159.9546650475613 452 1155.9546650475613 452H788.5707346690954Z" fill="#d97757"/><text x="414.2853673345477" y="484" font-size="18" fill="#1a1a1a" text-anchor="middle">FFN 66.8%</text><text x="414.2853673345477" y="508" font-size="16" fill="#6a6a6a" text-anchor="middle">1.35 亿：3 个 4096 × 11008 矩阵</text><text x="974.2853673345477" y="484" font-size="18" fill="#1a1a1a" text-anchor="middle">attention 33.2%</text><text x="974.2853673345477" y="508" font-size="16" fill="#6a6a6a" text-anchor="middle">0.67 亿：4 个 4096 × 4096 矩阵</text><text x="40" y="566" font-size="18" fill="#6a6a6a" text-anchor="start">FFN 是参数的大头，所以 MoE 选择把 FFN 换成多个专家：在参数最多的地方做稀疏化，收益最大。</text></svg>