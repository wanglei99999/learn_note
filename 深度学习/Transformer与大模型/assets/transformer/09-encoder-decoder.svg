<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#5a5a5a"/></marker><marker id="arrow-clay" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1200" height="880" fill="#f8f6f3"/><text x="40" y="48" font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700">Encoder-decoder：编码器读一次原文，解码器边生成边查原文</text><text x="40" y="82" font-size="18" fill="#6a6a6a" text-anchor="start">以翻译“我爱猫 → I love cats”为例，解码器正在预测第 3 个词。</text><text x="300" y="132" font-size="22" fill="#1a1a1a" text-anchor="middle">编码器（Encoder）</text><rect x="130.0" y="150" width="340" height="52" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="300" y="183.0" font-size="20" fill="#1a1a1a" text-anchor="middle">源语言：我 爱 猫</text><path d="M300 202V230" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="130.0" y="230" width="340" height="52" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="300" y="263.0" font-size="20" fill="#1a1a1a" text-anchor="middle">Embedding + 位置编码</text><path d="M300 282V316" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="110.0" y="316" width="380" height="240" rx="8" fill="none" stroke="#9a948c" stroke-width="2" stroke-dasharray="6,4"/><rect x="400.0" y="326" width="80" height="28" rx="14" fill="#f3d3c4" stroke="#d97757" stroke-width="2"/><text x="440.0" y="346" font-size="15" fill="#d97757" text-anchor="middle">× N</text><rect x="130.0" y="366" width="340" height="70" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="300" y="397.0" font-size="20" fill="#1a1a1a" text-anchor="middle">双向自注意力</text><text x="300" y="421.0" font-size="15" fill="#6a6a6a" text-anchor="middle">每个词看整句，没有因果 mask</text><path d="M300 436V464" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="130.0" y="464" width="340" height="70" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="300" y="495.0" font-size="20" fill="#1a1a1a" text-anchor="middle">FFN</text><text x="300" y="519.0" font-size="15" fill="#6a6a6a" text-anchor="middle">逐位置加工</text><path d="M300 556V590" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="130.0" y="590" width="340" height="70" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="300" y="621.0" font-size="20" fill="#1a1a1a" text-anchor="middle">编码器输出 H</text><text x="300" y="645.0" font-size="15" fill="#6a6a6a" text-anchor="middle">[3, d]：每个源词一个向量，只算一次</text><text x="820" y="132" font-size="22" fill="#1a1a1a" text-anchor="middle">解码器（Decoder）</text><rect x="650.0" y="150" width="340" height="52" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="820" y="183.0" font-size="20" fill="#1a1a1a" text-anchor="middle">已生成：&lt;s&gt; I love</text><path d="M820 202V230" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="650.0" y="230" width="340" height="52" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="820" y="263.0" font-size="20" fill="#1a1a1a" text-anchor="middle">Embedding + 位置编码</text><path d="M820 282V316" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="630.0" y="316" width="380" height="330" rx="8" fill="none" stroke="#9a948c" stroke-width="2" stroke-dasharray="6,4"/><rect x="920.0" y="326" width="80" height="28" rx="14" fill="#f3d3c4" stroke="#d97757" stroke-width="2"/><text x="960.0" y="346" font-size="15" fill="#d97757" text-anchor="middle">× N</text><rect x="650.0" y="366" width="340" height="70" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="820" y="397.0" font-size="20" fill="#1a1a1a" text-anchor="middle">因果自注意力</text><text x="820" y="421.0" font-size="15" fill="#6a6a6a" text-anchor="middle">只看已生成的部分</text><path d="M820 436V460" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="650.0" y="460" width="340" height="70" rx="12" fill="#a8c5e6" stroke="#d97757" stroke-width="2.5" filter="url(#soft)"/><text x="820" y="491.0" font-size="20" fill="#1a1a1a" text-anchor="middle">交叉注意力</text><text x="820" y="515.0" font-size="15" fill="#6a6a6a" text-anchor="middle">Q 来自解码器，K、V 来自 H</text><path d="M820 530V554" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="650.0" y="554" width="340" height="70" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="820" y="585.0" font-size="20" fill="#1a1a1a" text-anchor="middle">FFN</text><text x="820" y="609.0" font-size="15" fill="#6a6a6a" text-anchor="middle">逐位置加工</text><path d="M820 646V680" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="650.0" y="680" width="340" height="52" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="820" y="713.0" font-size="20" fill="#1a1a1a" text-anchor="middle">LM head + softmax</text><path d="M820 732V760" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="650.0" y="760" width="340" height="52" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="820" y="793.0" font-size="20" fill="#1a1a1a" text-anchor="middle">下一个词：cats</text><path d="M470.0 625H610.0V495H648.0" fill="none" stroke="#d97757" stroke-width="3" marker-end="url(#arrow-clay)"/><text x="482.0" y="652" font-size="18" fill="#d97757" text-anchor="start">K、V</text><text x="482.0" y="676" font-size="15" fill="#6a6a6a" text-anchor="start">每层共用 H</text><path d="M990.0 786H1040.0V176H992.0" fill="none" stroke="#9a948c" stroke-width="2" marker-end="url(#arrow)"/><text x="1062.0" y="480" font-size="15" fill="#6a6a6a" text-anchor="middle" transform="rotate(90 1062.0 480)">追加到已生成序列，再预测下一个</text><text x="40" y="852" font-size="17" fill="#6a6a6a" text-anchor="start">编码器只在开始时跑一次；解码器每生成一个词跑一次，交叉注意力的 K、V 由 H 算出，整个生成过程中都不变。</text></svg>