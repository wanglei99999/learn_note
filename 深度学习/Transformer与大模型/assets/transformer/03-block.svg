<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890"><style>text{font-family:'Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#2563eb"/></marker></defs><rect width="1200" height="890" fill="#ffffff"/><text x="40" y="48" font-size="30" fill="#111827" text-anchor="start">一个 Pre-Norm Transformer block（Llama 风格）</text><text x="40" y="82" font-size="18" fill="#6b7280" text-anchor="start">两个子层，各自先归一化、再计算，结果作为增量加回残差流。</text><rect x="200.0" y="110" width="260" height="52" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/><text x="330" y="143.0" font-size="20" fill="#111827" text-anchor="middle">输入 x（来自上一层）</text><path d="M330 162V433" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M330 467V733" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M330 767V800" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="304" y="300" font-size="17" fill="#2563eb" text-anchor="end">残差直通</text><text x="304" y="324" font-size="15" fill="#6b7280" text-anchor="end">x 原样保留</text><text x="304" y="600" font-size="17" fill="#2563eb" text-anchor="end">残差直通</text><text x="304" y="624" font-size="15" fill="#6b7280" text-anchor="end">h 原样保留</text><path d="M330 192H640V220" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="480.0" y="220" width="320" height="48" rx="8" fill="#eff6ff" stroke="#d1d5db" stroke-width="2"/><text x="640" y="251.0" font-size="20" fill="#111827" text-anchor="middle">RMSNorm</text><path d="M640 268V296" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="480.0" y="296" width="320" height="84" rx="8" fill="#eff6ff" stroke="#d1d5db" stroke-width="2"/><text x="640" y="334.0" font-size="20" fill="#111827" text-anchor="middle">多头因果自注意力</text><text x="640" y="358.0" font-size="15" fill="#6b7280" text-anchor="middle">RoPE 旋转 q、k · 因果 mask · W_O</text><path d="M640 380V450H349" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="330" cy="450" r="17" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><path d="M322 450H338M330 442V458" stroke="#2563eb" stroke-width="2.5"/><text x="300" y="457" font-size="18" fill="#111827" text-anchor="end">h</text><path d="M330 490H640V518" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="480.0" y="518" width="320" height="48" rx="8" fill="#eff6ff" stroke="#d1d5db" stroke-width="2"/><text x="640" y="549.0" font-size="20" fill="#111827" text-anchor="middle">RMSNorm</text><path d="M640 566V594" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="480.0" y="594" width="320" height="84" rx="8" fill="#eff6ff" stroke="#d1d5db" stroke-width="2"/><text x="640" y="632.0" font-size="20" fill="#111827" text-anchor="middle">FFN（SwiGLU）</text><text x="640" y="656.0" font-size="15" fill="#6b7280" text-anchor="middle">4096 → 11008 → 4096 · 逐位置独立</text><path d="M640 678V750H349" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="330" cy="750" r="17" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><path d="M322 750H338M330 742V758" stroke="#2563eb" stroke-width="2.5"/><rect x="200.0" y="800" width="260" height="52" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="330" y="833.0" font-size="20" fill="#111827" text-anchor="middle">输出（送入下一层）</text><text x="840" y="330" font-size="18" fill="#111827" text-anchor="start">token 之间交换信息</text><text x="840" y="356" font-size="16" fill="#6b7280" text-anchor="start">每个位置只看自己和前面</text><text x="840" y="628" font-size="18" fill="#111827" text-anchor="start">每个 token 单独加工</text><text x="840" y="654" font-size="16" fill="#6b7280" text-anchor="start">提供主要的非线性变换</text><text x="840" y="790" font-size="18" fill="#111827" text-anchor="start">h = x + Attention(RMSNorm(x))</text><text x="840" y="822" font-size="18" fill="#111827" text-anchor="start">out = h + FFN(RMSNorm(h))</text></svg>