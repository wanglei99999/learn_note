<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arrow-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1200" height="770" fill="#f8f6f3"/><text x="40" y="48" font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700">FFN：先升维，做非线性变换，再降回原维度</text><text x="40" y="82" font-size="18" fill="#6a6a6a" text-anchor="start">条的长度按向量维度等比例绘制；d = 4096。两种结构的参数量都约为 8d²。</text><rect x="40" y="110" width="520" height="620" rx="8" fill="#ffffff" stroke="#e2ddd6" stroke-width="2"/><text x="64" y="150" font-size="22" fill="#1a1a1a" text-anchor="start">标准 FFN（原始 Transformer）</text><rect x="215.0" y="200" width="80.0" height="26" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.8"/><text x="307.0" y="219" font-size="16" fill="#6a6a6a" text-anchor="start">x：4096</text><path d="M255 226V286" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="269" y="262" font-size="17" fill="#d97757" text-anchor="start">× W<tspan font-size="12" baseline-shift="sub">1</tspan></text><rect x="95.0" y="290" width="320.0" height="26" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.8"/><text x="427.0" y="309" font-size="16" fill="#6a6a6a" text-anchor="start">4d = 16384</text><path d="M255 316V356" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="155.0" y="360" width="200" height="44" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="255" y="389.0" font-size="20" fill="#1a1a1a" text-anchor="middle">ReLU / GELU</text><path d="M255 404V444" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="95.0" y="448" width="320.0" height="26" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.8"/><text x="427.0" y="467" font-size="16" fill="#6a6a6a" text-anchor="start">16384</text><path d="M255 474V534" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="269" y="510" font-size="17" fill="#d97757" text-anchor="start">× W<tspan font-size="12" baseline-shift="sub">2</tspan></text><rect x="215.0" y="538" width="80.0" height="26" rx="6" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.8"/><text x="307.0" y="557" font-size="16" fill="#6a6a6a" text-anchor="start">输出：4096</text><text x="64" y="640" font-size="18" fill="#1a1a1a" text-anchor="start">参数：2 × d × 4d = 8d²</text><text x="64" y="672" font-size="16" fill="#6a6a6a" text-anchor="start">两个矩阵，激活函数作用在升维后的向量上</text><rect x="600" y="110" width="560" height="620" rx="8" fill="#ffffff" stroke="#d97757" stroke-width="2"/><text x="624" y="150" font-size="22" fill="#1a1a1a" text-anchor="start">SwiGLU FFN（Llama、Qwen 等）</text><rect x="840.0" y="200" width="80.0" height="26" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.8"/><text x="932.0" y="219" font-size="16" fill="#6a6a6a" text-anchor="start">x：4096</text><path d="M860 226V250H760V286" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M900 226V250H1000V376" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="748" y="274" font-size="17" fill="#d97757" text-anchor="end">× W<tspan font-size="12" baseline-shift="sub">gate</tspan></text><text x="1012" y="274" font-size="17" fill="#d97757" text-anchor="start">× W<tspan font-size="12" baseline-shift="sub">up</tspan></text><rect x="652" y="290" width="216" height="26" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.8"/><text x="760" y="309" font-size="15" fill="#6a6a6a" text-anchor="middle">11008</text><path d="M760 316V336" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="700.0" y="336" width="120" height="40" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="760" y="363.0" font-size="20" fill="#1a1a1a" text-anchor="middle">SiLU</text><path d="M760 376V396" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="652" y="400" width="216" height="26" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.8"/><text x="760" y="419" font-size="14" fill="#6a6a6a" text-anchor="middle">门：每个维度放行多少</text><rect x="892" y="380" width="216" height="26" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.8"/><text x="1000" y="399" font-size="14" fill="#6a6a6a" text-anchor="middle">11008：候选内容</text><path d="M760 426V470H861" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1000 406V470H899" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="880" cy="470" r="17" fill="#ffffff" stroke="#d97757" stroke-width="2.5"/><circle cx="880" cy="470" r="3.5" fill="#d97757"/><text x="880" y="508" font-size="15" fill="#6a6a6a" text-anchor="middle">逐元素相乘 ⊙</text><path d="M880 516V540" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="772" y="544" width="216" height="26" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.8"/><text x="880" y="563" font-size="15" fill="#6a6a6a" text-anchor="middle">11008</text><path d="M880 570V600" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="894" y="590" font-size="17" fill="#d97757" text-anchor="start">× W<tspan font-size="12" baseline-shift="sub">down</tspan></text><rect x="840.0" y="604" width="80.0" height="26" rx="6" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.8"/><text x="932.0" y="623" font-size="16" fill="#6a6a6a" text-anchor="start">输出：4096</text><text x="624" y="672" font-size="16" fill="#1a1a1a" text-anchor="start">参数：3 × d × (8d/3) = 8d²；8/3 × 4096 ≈ 10923，取整为 11008</text><text x="624" y="700" font-size="16" fill="#6a6a6a" text-anchor="start">多一个矩阵，隐藏层就缩小到 8d/3，参数量保持不变</text></svg>