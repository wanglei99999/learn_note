<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arrow-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1200" height="990" fill="#f8f6f3"/><text x="40" y="48" font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700">decoder-only Transformer：从一段文字到下一个 token</text><text x="40" y="82" font-size="18" fill="#6a6a6a" text-anchor="start">以 Llama-2-7B 为例；右侧是每一步输出的张量形状，S 为输入的 token 数。</text><text x="760" y="124" font-size="17" fill="#6a6a6a" text-anchor="start">输出形状</text><rect x="280.0" y="140" width="300" height="52" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="430" y="173.0" font-size="20" fill="#1a1a1a" text-anchor="middle">输入文字</text><text x="760" y="173" font-size="18" fill="#1a1a1a" text-anchor="start">“猫吃饱了，它”</text><rect x="280.0" y="220" width="300" height="52" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="430" y="253.0" font-size="20" fill="#1a1a1a" text-anchor="middle">Tokenizer</text><text x="760" y="253" font-size="18" fill="#1a1a1a" text-anchor="start">token id：[S]</text><rect x="280.0" y="300" width="300" height="52" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="430" y="333.0" font-size="20" fill="#1a1a1a" text-anchor="middle">Embedding 查表</text><text x="760" y="333" font-size="18" fill="#1a1a1a" text-anchor="start">[S, 4096]</text><path d="M430 192V220" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M430 272V300" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M430 352V380" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="150" y="380" width="560" height="250" rx="8" fill="none" stroke="#9a948c" stroke-width="2" stroke-dasharray="6,4"/><text x="170" y="412" font-size="20" fill="#1a1a1a" text-anchor="start">Transformer block</text><rect x="590" y="392" width="104" height="30" rx="15" fill="#f3d3c4" stroke="#d97757" stroke-width="2"/><text x="642" y="413" font-size="16" fill="#d97757" text-anchor="middle">× 32 层</text><rect x="190.0" y="432" width="480" height="70" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="430" y="463.0" font-size="20" fill="#1a1a1a" text-anchor="middle">注意力子层</text><text x="430" y="487.0" font-size="15" fill="#6a6a6a" text-anchor="middle">RMSNorm → 多头因果注意力（RoPE）→ 残差相加</text><path d="M430 502V530" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="190.0" y="530" width="480" height="70" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="430" y="561.0" font-size="20" fill="#1a1a1a" text-anchor="middle">FFN 子层</text><text x="430" y="585.0" font-size="15" fill="#6a6a6a" text-anchor="middle">RMSNorm → SwiGLU FFN → 残差相加</text><text x="760" y="512" font-size="18" fill="#1a1a1a" text-anchor="start">[S, 4096]，每层形状不变</text><text x="760" y="538" font-size="16" fill="#6a6a6a" text-anchor="start">attention：token 之间交换信息</text><text x="760" y="562" font-size="16" fill="#6a6a6a" text-anchor="start">FFN：每个 token 单独加工</text><path d="M430 630V660" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="280.0" y="660" width="300" height="52" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="430" y="693.0" font-size="20" fill="#1a1a1a" text-anchor="middle">最终 RMSNorm</text><text x="760" y="693" font-size="18" fill="#1a1a1a" text-anchor="start">[S, 4096]</text><rect x="280.0" y="740" width="300" height="52" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="430" y="773.0" font-size="20" fill="#1a1a1a" text-anchor="middle">LM head</text><text x="760" y="773" font-size="18" fill="#1a1a1a" text-anchor="start">logits：[S, 32000]</text><rect x="280.0" y="820" width="300" height="52" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="430" y="853.0" font-size="20" fill="#1a1a1a" text-anchor="middle">softmax（取最后一个位置）</text><text x="760" y="853" font-size="18" fill="#1a1a1a" text-anchor="start">概率分布：[32000]</text><path d="M430 712V740" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M430 792V820" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M430 872V900" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="280.0" y="900" width="300" height="52" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="430" y="933.0" font-size="20" fill="#1a1a1a" text-anchor="middle">采样得到下一个 token：“睡”</text><text x="760" y="933" font-size="18" fill="#1a1a1a" text-anchor="start">接到输入末尾，开始下一轮</text><path d="M280.0 926H96V166H280.0" fill="none" stroke="#9a948c" stroke-width="2" marker-end="url(#arrow)"/><text x="80" y="546" font-size="16" fill="#6a6a6a" text-anchor="middle" transform="rotate(-90 80 546)">自回归：追加后重复整个过程</text></svg>