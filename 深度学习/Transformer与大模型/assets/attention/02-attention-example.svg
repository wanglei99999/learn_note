<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#5a5a5a"/></marker><marker id="arrow-g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3f9c86"/></marker><marker id="arrow-clay" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1200" height="600" fill="#f8f6f3"/><text x="40" y="48" font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700">例子：“它”通过 attention 从“猫”那里取到信息</text><text x="40" y="82" font-size="18" fill="#6a6a6a" text-anchor="start">q<tspan font-size="12" baseline-shift="sub">它</tspan> = [1, 0]；为了便于手算，这里省略 √d。</text><text x="110" y="140" font-size="18" fill="#6a6a6a" text-anchor="middle">token</text><text x="260" y="140" font-size="18" fill="#6a6a6a" text-anchor="middle">k</text><text x="430" y="140" font-size="18" fill="#6a6a6a" text-anchor="middle">q<tspan font-size="12" baseline-shift="sub">它</tspan> · k</text><text x="640" y="140" font-size="18" fill="#6a6a6a" text-anchor="middle">softmax 权重</text><text x="885" y="140" font-size="18" fill="#6a6a6a" text-anchor="middle">v</text><text x="1065" y="140" font-size="18" fill="#6a6a6a" text-anchor="middle">贡献</text><line x1="40" y1="156" x2="1160" y2="156" stroke="#e2ddd6" stroke-width="1.5"/><rect x="40" y="172" width="140" height="64" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="110" y="212" font-size="22" fill="#1a1a1a" text-anchor="middle">猫</text><text x="260" y="211" font-size="20" fill="#1a1a1a" text-anchor="middle">[2, 0.5]</text><text x="430" y="211" font-size="22" fill="#d97757" text-anchor="middle">2.0</text><rect x="540" y="194" width="200" height="20" rx="10" fill="#ece8e3"/><rect x="540" y="194" width="144" height="20" rx="10" fill="#4f86c0"/><text x="752" y="211" font-size="20" fill="#d97757" text-anchor="start">0.72</text><rect x="820" y="180" width="130" height="48" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="885" y="211" font-size="18" fill="#1a1a1a" text-anchor="middle">[1, 0, 0]</text><text x="1065" y="211" font-size="20" fill="#d97757" text-anchor="middle">0.72 · v<tspan font-size="14" baseline-shift="sub">猫</tspan></text><rect x="40" y="260" width="140" height="64" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="110" y="300" font-size="22" fill="#1a1a1a" text-anchor="middle">吃饱</text><text x="260" y="299" font-size="20" fill="#1a1a1a" text-anchor="middle">[0.2, 1]</text><text x="430" y="299" font-size="22" fill="#1a1a1a" text-anchor="middle">0.2</text><rect x="540" y="282" width="200" height="20" rx="10" fill="#ece8e3"/><rect x="540" y="282" width="24" height="20" rx="10" fill="#4f86c0"/><text x="752" y="299" font-size="20" fill="#1a1a1a" text-anchor="start">0.12</text><rect x="820" y="268" width="130" height="48" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="885" y="299" font-size="18" fill="#1a1a1a" text-anchor="middle">[0, 1, 0]</text><text x="1065" y="299" font-size="20" fill="#1a1a1a" text-anchor="middle">0.12 · v<tspan font-size="14" baseline-shift="sub">吃饱</tspan></text><rect x="40" y="348" width="140" height="64" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="110" y="388" font-size="22" fill="#1a1a1a" text-anchor="middle">它</text><text x="260" y="387" font-size="20" fill="#1a1a1a" text-anchor="middle">[0.5, 0.5]</text><text x="430" y="387" font-size="22" fill="#1a1a1a" text-anchor="middle">0.5</text><rect x="540" y="370" width="200" height="20" rx="10" fill="#ece8e3"/><rect x="540" y="370" width="32" height="20" rx="10" fill="#4f86c0"/><text x="752" y="387" font-size="20" fill="#1a1a1a" text-anchor="start">0.16</text><rect x="820" y="356" width="130" height="48" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="885" y="387" font-size="18" fill="#1a1a1a" text-anchor="middle">[0, 0, 1]</text><text x="1065" y="387" font-size="20" fill="#1a1a1a" text-anchor="middle">0.16 · v<tspan font-size="14" baseline-shift="sub">它</tspan></text><path d="M1065 428V462" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1080" y="450" font-size="16" fill="#d97757" text-anchor="start">相加</text><rect x="40" y="466" width="1120" height="96" rx="8" fill="#e4f2ee" stroke="#e2ddd6" stroke-width="2"/><text x="600" y="504" font-size="22" fill="#1a1a1a" text-anchor="middle">o<tspan font-size="15" baseline-shift="sub">它</tspan> = 0.72 v<tspan font-size="15" baseline-shift="sub">猫</tspan> + 0.12 v<tspan font-size="15" baseline-shift="sub">吃饱</tspan> + 0.16 v<tspan font-size="15" baseline-shift="sub">它</tspan> = [0.72, 0.12, 0.16]</text><text x="600" y="540" font-size="17" fill="#6a6a6a" text-anchor="middle">输出里大部分是“猫”的信息，“它”的表示里就带上了“指的是猫”这层含义。</text></svg>