<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580"><style>text{font-family:'Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#2563eb"/></marker><marker id="arrow-g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#059669"/></marker></defs><rect width="1200" height="580" fill="#ffffff"/><text x="40" y="48" font-size="30" fill="#111827" text-anchor="start">点积：两个向量方向越一致，点积越大</text><text x="40" y="82" font-size="18" fill="#6b7280" text-anchor="start">三个例子里 a 都是 [1, 0]，只改变 b 的方向。</text><rect x="40" y="110" width="360" height="380" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="64" y="150" font-size="23" fill="#111827" text-anchor="start">方向接近</text><line x1="80" y1="320" x2="360" y2="320" stroke="#d1d5db" stroke-width="1.5"/><line x1="220" y1="185" x2="220" y2="400" stroke="#d1d5db" stroke-width="1.5"/><line x1="220" y1="320" x2="340" y2="320" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><line x1="220" y1="320" x2="316" y2="248" stroke="#059669" stroke-width="3" marker-end="url(#arrow-g)"/><text x="284" y="350" font-size="17" fill="#2563eb" text-anchor="middle">a = [1, 0]</text><text x="320" y="232" font-size="17" fill="#059669" text-anchor="middle">b = [0.8, 0.6]</text><text x="220" y="444" font-size="22" fill="#111827" text-anchor="middle">a · b = 0.8</text><text x="220" y="472" font-size="17" fill="#6b7280" text-anchor="middle">很相关</text><rect x="420" y="110" width="360" height="380" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="444" y="150" font-size="23" fill="#111827" text-anchor="start">互相垂直</text><line x1="460" y1="320" x2="740" y2="320" stroke="#d1d5db" stroke-width="1.5"/><line x1="600" y1="185" x2="600" y2="400" stroke="#d1d5db" stroke-width="1.5"/><line x1="600" y1="320" x2="720" y2="320" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><line x1="600" y1="320" x2="600" y2="200" stroke="#059669" stroke-width="3" marker-end="url(#arrow-g)"/><text x="664" y="350" font-size="17" fill="#2563eb" text-anchor="middle">a = [1, 0]</text><text x="612" y="200" font-size="17" fill="#059669" text-anchor="start">b = [0, 1]</text><text x="600" y="444" font-size="22" fill="#111827" text-anchor="middle">a · b = 0</text><text x="600" y="472" font-size="17" fill="#6b7280" text-anchor="middle">无关</text><rect x="800" y="110" width="360" height="380" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="824" y="150" font-size="23" fill="#111827" text-anchor="start">方向相反</text><line x1="840" y1="320" x2="1120" y2="320" stroke="#d1d5db" stroke-width="1.5"/><line x1="980" y1="185" x2="980" y2="400" stroke="#d1d5db" stroke-width="1.5"/><line x1="980" y1="320" x2="1100" y2="320" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><line x1="980" y1="320" x2="860" y2="320" stroke="#059669" stroke-width="3" marker-end="url(#arrow-g)"/><text x="1044" y="350" font-size="17" fill="#2563eb" text-anchor="middle">a = [1, 0]</text><text x="916" y="350" font-size="17" fill="#059669" text-anchor="middle">b = [−1, 0]</text><text x="980" y="444" font-size="22" fill="#111827" text-anchor="middle">a · b = −1</text><text x="980" y="472" font-size="17" fill="#6b7280" text-anchor="middle">相互排斥</text><text x="40" y="540" font-size="18" fill="#6b7280" text-anchor="start">a · b = |a| |b| cos θ：长度相同时，夹角 θ 越小，点积越大。attention 用它来衡量两个词有多相关。</text></svg>