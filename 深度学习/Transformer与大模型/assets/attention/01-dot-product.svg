<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#4f86c0"/></marker><marker id="arrow-g" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#3f9c86"/></marker><marker id="arrow-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1200" height="580" fill="#f8f6f3"/><text x="40" y="48" font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700">点积：两个向量方向越一致，点积越大</text><text x="40" y="82" font-size="18" fill="#6a6a6a" text-anchor="start">三个例子里 a 都是 [1, 0]，只改变 b 的方向。</text><rect x="40" y="110" width="360" height="380" rx="8" fill="#ffffff" stroke="#e2ddd6" stroke-width="2"/><text x="64" y="150" font-size="23" fill="#1a1a1a" text-anchor="start">方向接近</text><line x1="80" y1="320" x2="360" y2="320" stroke="#cfc9c0" stroke-width="1.5"/><line x1="220" y1="185" x2="220" y2="400" stroke="#cfc9c0" stroke-width="1.5"/><line x1="220" y1="320" x2="340" y2="320" stroke="#4f86c0" stroke-width="3" marker-end="url(#arrow)"/><line x1="220" y1="320" x2="316" y2="248" stroke="#3f9c86" stroke-width="3" marker-end="url(#arrow-g)"/><text x="284" y="350" font-size="17" fill="#4f86c0" text-anchor="middle">a = [1, 0]</text><text x="320" y="232" font-size="17" fill="#3f9c86" text-anchor="middle">b = [0.8, 0.6]</text><text x="220" y="444" font-size="22" fill="#1a1a1a" text-anchor="middle">a · b = 0.8</text><text x="220" y="472" font-size="17" fill="#6a6a6a" text-anchor="middle">很相关</text><rect x="420" y="110" width="360" height="380" rx="8" fill="#ffffff" stroke="#e2ddd6" stroke-width="2"/><text x="444" y="150" font-size="23" fill="#1a1a1a" text-anchor="start">互相垂直</text><line x1="460" y1="320" x2="740" y2="320" stroke="#cfc9c0" stroke-width="1.5"/><line x1="600" y1="185" x2="600" y2="400" stroke="#cfc9c0" stroke-width="1.5"/><line x1="600" y1="320" x2="720" y2="320" stroke="#4f86c0" stroke-width="3" marker-end="url(#arrow)"/><line x1="600" y1="320" x2="600" y2="200" stroke="#3f9c86" stroke-width="3" marker-end="url(#arrow-g)"/><text x="664" y="350" font-size="17" fill="#4f86c0" text-anchor="middle">a = [1, 0]</text><text x="612" y="200" font-size="17" fill="#3f9c86" text-anchor="start">b = [0, 1]</text><text x="600" y="444" font-size="22" fill="#1a1a1a" text-anchor="middle">a · b = 0</text><text x="600" y="472" font-size="17" fill="#6a6a6a" text-anchor="middle">无关</text><rect x="800" y="110" width="360" height="380" rx="8" fill="#ffffff" stroke="#e2ddd6" stroke-width="2"/><text x="824" y="150" font-size="23" fill="#1a1a1a" text-anchor="start">方向相反</text><line x1="840" y1="320" x2="1120" y2="320" stroke="#cfc9c0" stroke-width="1.5"/><line x1="980" y1="185" x2="980" y2="400" stroke="#cfc9c0" stroke-width="1.5"/><line x1="980" y1="320" x2="1100" y2="320" stroke="#4f86c0" stroke-width="3" marker-end="url(#arrow)"/><line x1="980" y1="320" x2="860" y2="320" stroke="#3f9c86" stroke-width="3" marker-end="url(#arrow-g)"/><text x="1044" y="350" font-size="17" fill="#4f86c0" text-anchor="middle">a = [1, 0]</text><text x="916" y="350" font-size="17" fill="#3f9c86" text-anchor="middle">b = [−1, 0]</text><text x="980" y="444" font-size="22" fill="#1a1a1a" text-anchor="middle">a · b = −1</text><text x="980" y="472" font-size="17" fill="#6a6a6a" text-anchor="middle">相互排斥</text><text x="40" y="540" font-size="18" fill="#6a6a6a" text-anchor="start">a · b = |a| |b| cos θ：长度相同时，夹角 θ 越小，点积越大。attention 用它来衡量两个词有多相关。</text></svg>