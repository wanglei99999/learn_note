<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1240" height="600" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">同一次探索：在主上下文里做，还是交给子 agent（示意）</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">探索 10 轮、读入 4 万 token；之后主 agent 还要再跑 30 轮。只计输入 token</text><text x="48.0" y="150.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">输入 token 合计</text><text x="284.0" y="217.0" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="600">在主上下文里探索</text><rect x="300.0" y="190.0" width="272.0" height="40.0" rx="4" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/><text x="436.0" y="216.0" font-size="13" fill="#1a1a1a" text-anchor="middle">探索 10 轮</text><rect x="572.0" y="190.0" width="480.0" height="40.0" rx="4" fill="#f3d3c4" stroke="#4a4a4a" stroke-width="1.5"/><text x="812.0" y="216.0" font-size="13" fill="#1a1a1a" text-anchor="middle">之后 30 轮带着 4 万</text><text x="1064.0" y="216.0" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">188 万 · 0.69 美元</text><text x="284.0" y="287.0" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="600">交给子 agent</text><rect x="300.0" y="260.0" width="20.0" height="40.0" rx="4" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/><rect x="320.0" y="260.0" width="98.0" height="40.0" rx="4" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/><rect x="418.0" y="260.0" width="24.0" height="40.0" rx="4" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/><text x="454.0" y="286.0" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">36 万 · 0.24 美元</text><text x="300.0" y="335.0" font-size="12" fill="#6a6a6a" text-anchor="start">灰：主 agent 发出委派的那一轮 5 万　蓝：子 agent 自己的 10 轮 24.5 万　绿：之后 30 轮带着摘要 6 万</text><text x="48.0" y="400.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">主上下文峰值</text><text x="284.0" y="457.0" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="600">在主上下文里探索</text><rect x="300.0" y="430.0" width="684.0" height="40.0" rx="4" fill="#f3d3c4" stroke="#4a4a4a" stroke-width="1.5"/><text x="996.0" y="456.0" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">9 万</text><text x="284.0" y="517.0" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="600">交给子 agent</text><rect x="300.0" y="490.0" width="395.2" height="40.0" rx="4" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/><text x="707.2" y="516.0" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">5.2 万</text></svg>