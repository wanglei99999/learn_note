<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1240" height="560" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">Cognition 的 Flappy Bird 例子</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">两个子 agent 各自做了一个“合理”的决定，但这两个决定互相冲突；拼的人只拿到结果，不知道背后的取舍</text><rect x="470.0" y="112.0" width="300.0" height="84.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="620.0" y="149.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">任务：做一个 Flappy Bird</text><text x="620.0" y="173.5" font-size="14" fill="#6a6a6a" text-anchor="middle">拆成两个子任务</text><rect x="110.0" y="270.0" width="360.0" height="120.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="290.0" y="314.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">子 agent 1：背景和管道</text><text x="290.0" y="338.5" font-size="14" fill="#6a6a6a" text-anchor="middle">做出来像《超级马里奥》</text><text x="290.0" y="360.5" font-size="14" fill="#6a6a6a" text-anchor="middle">的横版场景</text><rect x="770.0" y="270.0" width="360.0" height="120.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="950.0" y="314.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">子 agent 2：小鸟</text><text x="950.0" y="338.5" font-size="14" fill="#6a6a6a" text-anchor="middle">小鸟的样子和动作</text><text x="950.0" y="360.5" font-size="14" fill="#6a6a6a" text-anchor="middle">和原游戏都不像</text><path d="M 560 198 C 560 240, 290 230, 290 266" fill="none" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><path d="M 680 198 C 680 240, 950 230, 950 266" fill="none" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><rect x="420.0" y="430.0" width="400.0" height="96.0" rx="12" fill="#f3d3c4" stroke="#d97757" stroke-width="2.5" filter="url(#soft)"/><text x="620.0" y="473.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">最后一个 agent 负责合并</text><text x="620.0" y="497.5" font-size="14" fill="#6a6a6a" text-anchor="middle">两份风格完全不搭的结果</text><path d="M 290 392 C 290 470, 380 478, 416 478" fill="none" stroke="#d97757" stroke-width="2" marker-end="url(#arr-clay)"/><path d="M 950 392 C 950 470, 860 478, 824 478" fill="none" stroke="#d97757" stroke-width="2" marker-end="url(#arr-clay)"/><text x="620.0" y="250.0" font-size="14" fill="#d97757" text-anchor="middle" font-weight="600">两边都不知道对方选了什么风格</text></svg>