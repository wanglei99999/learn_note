<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1240" height="650" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">子 agent：脏活在别的上下文里干，只把结论带回来</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">子 agent 可能读了几万 token 的材料，交回主 agent 的通常只有一两千 token 的摘要</text><rect x="40.0" y="116.0" width="360.0" height="490.0" rx="14" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="60.0" y="148.0" font-size="16" fill="#6a6a6a" text-anchor="start" font-weight="700">主 agent 的上下文</text><rect x="60.0" y="166.0" width="320.0" height="60.0" rx="8" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/><text x="220.0" y="201.0" font-size="14" fill="#1a1a1a" text-anchor="middle">任务、计划</text><rect x="60.0" y="236.0" width="320.0" height="50.0" rx="8" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/><text x="220.0" y="266.0" font-size="14" fill="#1a1a1a" text-anchor="middle">委派：找出鉴权相关代码</text><rect x="60.0" y="296.0" width="320.0" height="60.0" rx="8" fill="#9dd4c7" stroke="#d97757" stroke-width="1.5"/><text x="220.0" y="331.0" font-size="14" fill="#1a1a1a" text-anchor="middle">摘要（约 1,500 token）</text><rect x="60.0" y="366.0" width="320.0" height="50.0" rx="8" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/><text x="220.0" y="396.0" font-size="14" fill="#1a1a1a" text-anchor="middle">委派：查 OAuth 库的用法</text><rect x="60.0" y="426.0" width="320.0" height="60.0" rx="8" fill="#9dd4c7" stroke="#d97757" stroke-width="1.5"/><text x="220.0" y="461.0" font-size="14" fill="#1a1a1a" text-anchor="middle">摘要</text><rect x="60.0" y="496.0" width="320.0" height="90.0" rx="8" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/><text x="220.0" y="546.0" font-size="14" fill="#1a1a1a" text-anchor="middle">自己写代码、跑测试 …</text><rect x="620.0" y="150.0" width="560.0" height="170.0" rx="14" fill="#f3efe9" stroke="#e2ddd6" stroke-width="1.5"/><text x="640.0" y="182.0" font-size="15" fill="#6a6a6a" text-anchor="start" font-weight="700">子 agent A 的上下文（独立、全新）</text><rect x="640.0" y="202.0" width="92.0" height="56.0" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.2"/><rect x="744.0" y="202.0" width="92.0" height="56.0" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.2"/><rect x="848.0" y="202.0" width="92.0" height="56.0" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.2"/><rect x="952.0" y="202.0" width="92.0" height="56.0" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.2"/><rect x="1056.0" y="202.0" width="92.0" height="56.0" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.2"/><text x="900.0" y="290.0" font-size="14" fill="#5a5a5a" text-anchor="middle">grep、读 14 个文件，约 4 万 token</text><rect x="620.0" y="370.0" width="560.0" height="170.0" rx="14" fill="#f3efe9" stroke="#e2ddd6" stroke-width="1.5"/><text x="640.0" y="402.0" font-size="15" fill="#6a6a6a" text-anchor="start" font-weight="700">子 agent B 的上下文（独立、全新）</text><rect x="640.0" y="422.0" width="92.0" height="56.0" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.2"/><rect x="744.0" y="422.0" width="92.0" height="56.0" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.2"/><rect x="848.0" y="422.0" width="92.0" height="56.0" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.2"/><rect x="952.0" y="422.0" width="92.0" height="56.0" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.2"/><rect x="1056.0" y="422.0" width="92.0" height="56.0" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.2"/><text x="900.0" y="510.0" font-size="14" fill="#5a5a5a" text-anchor="middle">搜文档、读 6 个网页，约 3 万 token</text><path d="M 382 261 C 500 261, 500 210, 616 210" fill="none" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><path d="M 616 290 C 500 290, 500 326, 384 326" fill="none" stroke="#d97757" stroke-width="2.5" marker-end="url(#arr-clay)"/><path d="M 382 391 C 500 391, 500 430, 616 430" fill="none" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><path d="M 616 506 C 500 506, 500 456, 384 456" fill="none" stroke="#d97757" stroke-width="2.5" marker-end="url(#arr-clay)"/><text x="900.0" y="630.0" font-size="14" fill="#6a6a6a" text-anchor="middle">灰线：任务描述　橙线：只回传结论</text></svg>