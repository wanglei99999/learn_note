<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1240" height="540" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">压缩改动的是 messages，前面的 tools 和 system 保持不变</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">前缀缓存按 tools → system → messages 的顺序比对；方块宽度不按比例（示意）</text><text x="40.0" y="164.0" font-size="15" fill="#5a5a5a" text-anchor="start" font-weight="700">压缩前</text><rect x="150.0" y="130.0" width="100.0" height="54.0" rx="6" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/><text x="200.0" y="154.0" font-size="13" fill="#1a1a1a" text-anchor="middle">tools</text><text x="200.0" y="173.0" font-size="12" fill="#6a6a6a" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">1,500</text><rect x="254.0" y="130.0" width="110.0" height="54.0" rx="6" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/><text x="309.0" y="154.0" font-size="13" fill="#1a1a1a" text-anchor="middle">system</text><text x="309.0" y="173.0" font-size="12" fill="#6a6a6a" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">2,500</text><rect x="368.0" y="130.0" width="120.0" height="54.0" rx="6" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/><text x="428.0" y="154.0" font-size="13" fill="#1a1a1a" text-anchor="middle">CLAUDE.md</text><text x="428.0" y="173.0" font-size="12" fill="#6a6a6a" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">1,200</text><rect x="492.0" y="130.0" width="80.0" height="54.0" rx="6" fill="#f3d3c4" stroke="#4a4a4a" stroke-width="1.5"/><text x="532.0" y="154.0" font-size="13" fill="#1a1a1a" text-anchor="middle">任务</text><text x="532.0" y="173.0" font-size="12" fill="#6a6a6a" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">300</text><rect x="576.0" y="130.0" width="620.0" height="54.0" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/><text x="886.0" y="154.0" font-size="13" fill="#1a1a1a" text-anchor="middle">第 2–30 轮：文件、测试、搜索、模型输出</text><text x="886.0" y="173.0" font-size="12" fill="#6a6a6a" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">82,100</text><text x="40.0" y="304.0" font-size="15" fill="#5a5a5a" text-anchor="start" font-weight="700">压缩后</text><rect x="150.0" y="270.0" width="100.0" height="54.0" rx="6" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/><text x="200.0" y="294.0" font-size="13" fill="#1a1a1a" text-anchor="middle">tools</text><text x="200.0" y="313.0" font-size="12" fill="#6a6a6a" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">1,500</text><rect x="254.0" y="270.0" width="110.0" height="54.0" rx="6" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/><text x="309.0" y="294.0" font-size="13" fill="#1a1a1a" text-anchor="middle">system</text><text x="309.0" y="313.0" font-size="12" fill="#6a6a6a" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">2,500</text><rect x="368.0" y="270.0" width="120.0" height="54.0" rx="6" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/><text x="428.0" y="294.0" font-size="13" fill="#1a1a1a" text-anchor="middle">CLAUDE.md</text><text x="428.0" y="313.0" font-size="12" fill="#6a6a6a" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">1,200</text><rect x="492.0" y="270.0" width="110.0" height="54.0" rx="6" fill="#f3d3c4" stroke="#d97757" stroke-width="2"/><text x="547.0" y="294.0" font-size="13" fill="#1a1a1a" text-anchor="middle">原始要求</text><text x="547.0" y="313.0" font-size="12" fill="#6a6a6a" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">400</text><rect x="606.0" y="270.0" width="150.0" height="54.0" rx="6" fill="#f4e4c1" stroke="#d97757" stroke-width="2"/><text x="681.0" y="294.0" font-size="13" fill="#1a1a1a" text-anchor="middle">状态记录</text><text x="681.0" y="313.0" font-size="12" fill="#6a6a6a" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">4,400</text><rect x="760.0" y="270.0" width="150.0" height="54.0" rx="6" fill="#f4e4c1" stroke="#d97757" stroke-width="2"/><text x="835.0" y="294.0" font-size="13" fill="#1a1a1a" text-anchor="middle">最近一次测试</text><text x="835.0" y="313.0" font-size="12" fill="#6a6a6a" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">2,250</text><rect x="150.0" y="332.0" width="338.0" height="10.0" rx="4" fill="#9dd4c7" stroke="none" stroke-width="0"/><rect x="492.0" y="332.0" width="418.0" height="10.0" rx="4" fill="#d97757" stroke="none" stroke-width="0"/><text x="150.0" y="372.0" font-size="13" fill="#5a5a5a" text-anchor="start">绿色：和压缩前逐 token 相同，命中缓存（5,200 token）</text><text x="150.0" y="394.0" font-size="13" fill="#5a5a5a" text-anchor="start">橙色：新内容，写入缓存（7,050 token，按 1.25 倍计价）</text><text x="150.0" y="444.0" font-size="14" fill="#1a1a1a" text-anchor="start">原始要求由 harness 原样复制；状态记录由模型按清单生成；最近一次测试输出保留原文。</text><text x="150.0" y="470.0" font-size="14" fill="#1a1a1a" text-anchor="start">其余约 7.8 万 token 移出上下文。它们的原文在产生时已经落盘，状态记录里留有路径和版本。</text></svg>