<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1240" height="560" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">剩余 20 轮工作的三笔账（示意，开启前缀缓存）</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">上下文占用、计费、额外轮数并不一起下降：滑动窗口占用最小，却最贵</text><text x="340.0" y="140.0" font-size="15" fill="#6a6a6a" text-anchor="middle" font-weight="700">峰值上下文（千 token）</text><text x="700.0" y="140.0" font-size="15" fill="#6a6a6a" text-anchor="middle" font-weight="700">输入 + 输出计费（美元）</text><text x="960.0" y="140.0" font-size="15" fill="#6a6a6a" text-anchor="middle" font-weight="700">额外轮数</text><text x="156.0" y="200.0" font-size="16" fill="#1a1a1a" text-anchor="end" font-weight="700">不处理</text><rect x="170.0" y="178.0" width="285.4" height="32.0" rx="5" fill="#d97757" stroke="#4a4a4a" stroke-width="1.5"/><text x="461.4" y="200.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">142.7</text><rect x="580.0" y="178.0" width="61.2" height="32.0" rx="5" fill="#3f9c86" stroke="#4a4a4a" stroke-width="1.5"/><text x="647.2" y="200.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">1.02</text><text x="960.0" y="200.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">+0</text><text x="1010.0" y="200.0" font-size="13" fill="#6a6a6a" text-anchor="start">峰值超过窗口，跑不完</text><text x="156.0" y="284.0" font-size="16" fill="#1a1a1a" text-anchor="end" font-weight="700">滑动窗口</text><rect x="170.0" y="262.0" width="91.0" height="32.0" rx="5" fill="#4f86c0" stroke="#4a4a4a" stroke-width="1.5"/><text x="267.0" y="284.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">45.5</text><rect x="580.0" y="262.0" width="154.2" height="32.0" rx="5" fill="#d97757" stroke="#4a4a4a" stroke-width="1.5"/><text x="740.2" y="284.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">2.57</text><text x="960.0" y="284.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">+0</text><text x="1010.0" y="284.0" font-size="13" fill="#6a6a6a" text-anchor="start">每轮缓存失效；丢了追加要求</text><text x="156.0" y="368.0" font-size="16" fill="#1a1a1a" text-anchor="end" font-weight="700">简单摘要</text><rect x="170.0" y="346.0" width="158.4" height="32.0" rx="5" fill="#4f86c0" stroke="#4a4a4a" stroke-width="1.5"/><text x="334.4" y="368.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">79.2</text><rect x="580.0" y="346.0" width="49.2" height="32.0" rx="5" fill="#3f9c86" stroke="#4a4a4a" stroke-width="1.5"/><text x="635.2" y="368.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">0.82</text><text x="960.0" y="368.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">+6</text><text x="1010.0" y="368.0" font-size="13" fill="#6a6a6a" text-anchor="start">违反接口约束，返工 6 轮</text><text x="156.0" y="452.0" font-size="16" fill="#1a1a1a" text-anchor="end" font-weight="700">外存 + 索引</text><rect x="170.0" y="430.0" width="163.8" height="32.0" rx="5" fill="#4f86c0" stroke="#4a4a4a" stroke-width="1.5"/><text x="339.8" y="452.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">81.9</text><rect x="580.0" y="430.0" width="51.6" height="32.0" rx="5" fill="#3f9c86" stroke="#4a4a4a" stroke-width="1.5"/><text x="637.6" y="452.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">0.86</text><text x="960.0" y="452.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">+2</text><text x="1010.0" y="452.0" font-size="13" fill="#6a6a6a" text-anchor="start">多 2 轮回读，信息完整</text><line x1="426.0" y1="160.0" x2="426.0" y2="500.0" stroke="#d97757" stroke-width="1.5" stroke-dasharray="5 4"/><text x="426.0" y="520.0" font-size="13" fill="#d97757" text-anchor="middle">窗口 12.8 万</text></svg>