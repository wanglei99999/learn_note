<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1240" height="560" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">三种处理之后，六条关键信息还剩哪些（示意）</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">“保留首尾”丢了中间的追加要求；“简单摘要”读起来通顺，却丢了原始约束和失败记录</text><rect x="40.0" y="110.0" width="1160.0" height="410.0" rx="14" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="720.0" y="150.0" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">保留首尾</text><text x="880.0" y="150.0" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">简单摘要</text><text x="1060.0" y="150.0" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">外存 + 索引</text><rect x="56.0" y="168.0" width="1128.0" height="46.0" rx="6" fill="#faf8f5" stroke="none" stroke-width="0"/><text x="76.0" y="197.0" font-size="15" fill="#1a1a1a" text-anchor="start">F1 根因一：worker 吞掉异常，整批丢弃</text><circle cx="720" cy="192" r="13" fill="#d97757" stroke="#4a4a4a" stroke-width="1.5"/><text x="720.0" y="198.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">✕</text><circle cx="880" cy="192" r="13" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/><text x="880.0" y="198.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">~</text><circle cx="1060" cy="192" r="13" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/><text x="1060.0" y="198.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">✓</text><text x="76.0" y="249.0" font-size="15" fill="#1a1a1a" text-anchor="start">F2 根因二：唯一约束冲突导致 500</text><circle cx="720" cy="244" r="13" fill="#d97757" stroke="#4a4a4a" stroke-width="1.5"/><text x="720.0" y="250.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">✕</text><circle cx="880" cy="244" r="13" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/><text x="880.0" y="250.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">✓</text><circle cx="1060" cy="244" r="13" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/><text x="1060.0" y="250.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">✓</text><rect x="56.0" y="272.0" width="1128.0" height="46.0" rx="6" fill="#faf8f5" stroke="none" stroke-width="0"/><text x="76.0" y="301.0" font-size="15" fill="#1a1a1a" text-anchor="start">F3 约束：不能改导入接口的请求和响应格式</text><circle cx="720" cy="296" r="13" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/><text x="720.0" y="302.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">✓</text><circle cx="880" cy="296" r="13" fill="#d97757" stroke="#4a4a4a" stroke-width="1.5"/><text x="880.0" y="302.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">✕</text><circle cx="1060" cy="296" r="13" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/><text x="1060.0" y="302.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">✓</text><text x="76.0" y="353.0" font-size="15" fill="#1a1a1a" text-anchor="start">F4 追加：重复的用户跳过，不报错</text><circle cx="720" cy="348" r="13" fill="#d97757" stroke="#4a4a4a" stroke-width="1.5"/><text x="720.0" y="354.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">✕</text><circle cx="880" cy="348" r="13" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/><text x="880.0" y="354.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">~</text><circle cx="1060" cy="348" r="13" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/><text x="1060.0" y="354.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">✓</text><rect x="56.0" y="376.0" width="1128.0" height="46.0" rx="6" fill="#faf8f5" stroke="none" stroke-width="0"/><text x="76.0" y="405.0" font-size="15" fill="#1a1a1a" text-anchor="start">F5 失败过：改成同步发送会超时</text><circle cx="720" cy="400" r="13" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/><text x="720.0" y="406.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">✓</text><circle cx="880" cy="400" r="13" fill="#d97757" stroke="#4a4a4a" stroke-width="1.5"/><text x="880.0" y="406.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">✕</text><circle cx="1060" cy="400" r="13" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/><text x="1060.0" y="406.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">✓</text><text x="76.0" y="457.0" font-size="15" fill="#1a1a1a" text-anchor="start">F6 进度：worker.py 已改好，import.py 改到一半</text><circle cx="720" cy="452" r="13" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/><text x="720.0" y="458.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">✓</text><circle cx="880" cy="452" r="13" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/><text x="880.0" y="458.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">✓</text><circle cx="1060" cy="452" r="13" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/><text x="1060.0" y="458.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">✓</text><text x="76.0" y="548.0" font-size="14" fill="#6a6a6a" text-anchor="start">✓ 保留　~ 只剩模糊的说法　✕ 丢失</text></svg>