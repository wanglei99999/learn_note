<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1240" height="560" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">消息历史只追加：旧的观察不会因为文件变了而消失</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">users_import.py 在第 3 轮被完整读入，第 27、29 轮被修改（示意）</text><line x1="120.0" y1="200.0" x2="1160.0" y2="200.0" stroke="#e2ddd6" stroke-width="3"/><text x="120.0" y="236.0" font-size="13" fill="#6a6a6a" text-anchor="middle">第 1 轮</text><text x="442.8" y="236.0" font-size="13" fill="#6a6a6a" text-anchor="middle">第 10 轮</text><text x="801.4" y="236.0" font-size="13" fill="#6a6a6a" text-anchor="middle">第 20 轮</text><text x="1160.0" y="236.0" font-size="13" fill="#6a6a6a" text-anchor="middle">第 30 轮</text><circle cx="191.7" cy="200" r="14" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/><text x="191.7" y="206.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">①</text><text x="140.0" y="290.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">①</text><text x="170.0" y="290.0" font-size="14" fill="#5a5a5a" text-anchor="start">第 3 轮  read：读入全文，此时是版本 A（6,200 token，原样留在历史里）</text><circle cx="1046.4" cy="200" r="14" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/><text x="1046.4" y="206.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">②</text><text x="140.0" y="328.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">②</text><text x="170.0" y="328.0" font-size="14" fill="#5a5a5a" text-anchor="start">第 27 轮  edit 成功：文件变成版本 B，历史里只多了一段修改记录</text><circle cx="1088.3" cy="200" r="14" fill="#f3d3c4" stroke="#4a4a4a" stroke-width="1.5"/><text x="1088.3" y="206.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">③</text><text x="140.0" y="366.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">③</text><text x="170.0" y="366.0" font-size="14" fill="#5a5a5a" text-anchor="start">第 28 轮  edit 失败：模型照着版本 A 写 old_str，那段文字在版本 B 里已经不存在</text><circle cx="1130.1" cy="200" r="14" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/><text x="1130.1" y="206.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">④</text><text x="140.0" y="404.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">④</text><text x="170.0" y="404.0" font-size="14" fill="#5a5a5a" text-anchor="start">第 29 轮  edit 成功：文件变成版本 C</text><rect x="120.0" y="450.0" width="1040.0" height="76.0" rx="10" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="140.0" y="480.0" font-size="14" fill="#1a1a1a" text-anchor="start">第 30 轮的上下文里，关于这个文件的内容是：版本 A 全文 + 两段修改记录。</text><text x="140.0" y="506.0" font-size="14" fill="#d97757" text-anchor="start" font-weight="600">磁盘上的真实内容是版本 C，它没有以全文形式出现在上下文的任何位置。</text></svg>