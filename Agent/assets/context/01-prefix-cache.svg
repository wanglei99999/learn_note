<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1240" height="600" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">前缀缓存：从第一个不同的 token 开始，后面全部重算</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">第 k+1 轮只是在第 k 轮末尾追加了新内容，所以前面整段都能命中缓存；开头改一个字，就全部失效</text><text x="40.0" y="160.0" font-size="15" fill="#5a5a5a" text-anchor="start" font-weight="600">第 k 轮</text><rect x="200.0" y="130.0" width="160.0" height="46.0" rx="6" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/><text x="280.0" y="159.0" font-size="13" fill="#1a1a1a" text-anchor="middle">system</text><rect x="360.0" y="130.0" width="150.0" height="46.0" rx="6" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/><text x="435.0" y="159.0" font-size="13" fill="#1a1a1a" text-anchor="middle">工具定义</text><rect x="510.0" y="130.0" width="80.0" height="46.0" rx="6" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/><text x="550.0" y="159.0" font-size="13" fill="#1a1a1a" text-anchor="middle">任务</text><rect x="590.0" y="130.0" width="300.0" height="46.0" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/><text x="740.0" y="159.0" font-size="13" fill="#1a1a1a" text-anchor="middle">第 1..k 轮</text><text x="1200.0" y="160.0" font-size="14" fill="#6a6a6a" text-anchor="end"></text><text x="40.0" y="260.0" font-size="15" fill="#5a5a5a" text-anchor="start" font-weight="600">第 k+1 轮</text><rect x="200.0" y="230.0" width="160.0" height="46.0" rx="6" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/><text x="280.0" y="259.0" font-size="13" fill="#1a1a1a" text-anchor="middle">system</text><rect x="360.0" y="230.0" width="150.0" height="46.0" rx="6" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/><text x="435.0" y="259.0" font-size="13" fill="#1a1a1a" text-anchor="middle">工具定义</text><rect x="510.0" y="230.0" width="80.0" height="46.0" rx="6" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/><text x="550.0" y="259.0" font-size="13" fill="#1a1a1a" text-anchor="middle">任务</text><rect x="590.0" y="230.0" width="300.0" height="46.0" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/><text x="740.0" y="259.0" font-size="13" fill="#1a1a1a" text-anchor="middle">第 1..k 轮</text><rect x="890.0" y="230.0" width="110.0" height="46.0" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/><text x="945.0" y="259.0" font-size="13" fill="#1a1a1a" text-anchor="middle">新一轮</text><rect x="200.0" y="284.0" width="690.0" height="10.0" rx="4" fill="#9dd4c7" stroke="none" stroke-width="0"/><rect x="890.0" y="284.0" width="110.0" height="10.0" rx="4" fill="#d97757" stroke="none" stroke-width="0"/><text x="1200.0" y="260.0" font-size="14" fill="#6a6a6a" text-anchor="end">前面全部命中，只算新增部分</text><text x="40.0" y="360.0" font-size="15" fill="#5a5a5a" text-anchor="start" font-weight="600">开头加时间戳</text><rect x="200.0" y="330.0" width="160.0" height="46.0" rx="6" fill="#f3d3c4" stroke="#4a4a4a" stroke-width="1.5"/><text x="280.0" y="359.0" font-size="13" fill="#1a1a1a" text-anchor="middle">system*</text><rect x="360.0" y="330.0" width="150.0" height="46.0" rx="6" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/><text x="435.0" y="359.0" font-size="13" fill="#1a1a1a" text-anchor="middle">工具定义</text><rect x="510.0" y="330.0" width="80.0" height="46.0" rx="6" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/><text x="550.0" y="359.0" font-size="13" fill="#1a1a1a" text-anchor="middle">任务</text><rect x="590.0" y="330.0" width="300.0" height="46.0" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/><text x="740.0" y="359.0" font-size="13" fill="#1a1a1a" text-anchor="middle">第 1..k 轮</text><rect x="890.0" y="330.0" width="110.0" height="46.0" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/><text x="945.0" y="359.0" font-size="13" fill="#1a1a1a" text-anchor="middle">新一轮</text><rect x="200.0" y="384.0" width="0.0" height="10.0" rx="4" fill="#9dd4c7" stroke="none" stroke-width="0"/><rect x="200.0" y="384.0" width="800.0" height="10.0" rx="4" fill="#d97757" stroke="none" stroke-width="0"/><text x="1200.0" y="360.0" font-size="14" fill="#d97757" text-anchor="end" font-weight="600">全部重算</text><text x="40.0" y="460.0" font-size="15" fill="#5a5a5a" text-anchor="start" font-weight="600">中途删一个工具</text><rect x="200.0" y="430.0" width="160.0" height="46.0" rx="6" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/><text x="280.0" y="459.0" font-size="13" fill="#1a1a1a" text-anchor="middle">system</text><rect x="360.0" y="430.0" width="150.0" height="46.0" rx="6" fill="#f3d3c4" stroke="#4a4a4a" stroke-width="1.5"/><text x="435.0" y="459.0" font-size="13" fill="#1a1a1a" text-anchor="middle">工具定义*</text><rect x="510.0" y="430.0" width="80.0" height="46.0" rx="6" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/><text x="550.0" y="459.0" font-size="13" fill="#1a1a1a" text-anchor="middle">任务</text><rect x="590.0" y="430.0" width="300.0" height="46.0" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/><text x="740.0" y="459.0" font-size="13" fill="#1a1a1a" text-anchor="middle">第 1..k 轮</text><rect x="890.0" y="430.0" width="110.0" height="46.0" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/><text x="945.0" y="459.0" font-size="13" fill="#1a1a1a" text-anchor="middle">新一轮</text><rect x="200.0" y="484.0" width="160.0" height="10.0" rx="4" fill="#9dd4c7" stroke="none" stroke-width="0"/><rect x="360.0" y="484.0" width="640.0" height="10.0" rx="4" fill="#d97757" stroke="none" stroke-width="0"/><text x="1200.0" y="460.0" font-size="14" fill="#d97757" text-anchor="end" font-weight="600">工具之后全部重算</text><rect x="200.0" y="530.0" width="18.0" height="10.0" rx="4" fill="#9dd4c7" stroke="none" stroke-width="0"/><text x="228.0" y="540.0" font-size="14" fill="#5a5a5a" text-anchor="start">命中缓存：按约 1/10 的价格计费</text><rect x="520.0" y="530.0" width="18.0" height="10.0" rx="4" fill="#d97757" stroke="none" stroke-width="0"/><text x="548.0" y="540.0" font-size="14" fill="#5a5a5a" text-anchor="start">需要重新 prefill</text><text x="760.0" y="540.0" font-size="14" fill="#6a6a6a" text-anchor="start">* 表示和上一轮不一样的部分</text></svg>