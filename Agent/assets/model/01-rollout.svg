)"/><rect x="1090.0" y="260.0" width="120.0" height="46.0" rx="8" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2"/><text x="1150.0" y="289.0" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="600">测试过没过</text><rect x="200.0" y="410.0" width="22.0" height="22.0" rx="4" fill="#f4e4c1" stroke="#d97757" stroke-width="2"/><text x="232.0" y="427.0" font-size="14" fill="#5a5a5a" text-anchor="start">模型生成，参与梯度计算</text><rect x="470.0" y="410.0" width="22.0" height="22.0" rx="4" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/><text x="502.0" y="427.0" font-size="14" fill="#5a5a5a" text-anchor="start">环境返回，不算 loss（和 SFT 的 loss mask 是同一个道理）</text><text x="200.0" y="480.0" font-size="15" fill="#d97757" text-anchor="start" font-weight="600">难点：轨迹长、环境要真的跑起来（沙箱、测试）、奖励只在最后给一次</text></svg>