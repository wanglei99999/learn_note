<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1240" height="560" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">单轮推理 RL 与 agentic RL 的一次采样</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">agentic RL 的一条轨迹里交替出现模型写的 token 和环境返回的 token；只有前者参与梯度计算</text><text x="40.0" y="160.0" font-size="15" fill="#5a5a5a" text-anchor="start" font-weight="700">单轮推理 RL</text><rect x="200.0" y="130.0" width="120.0" height="46.0" rx="6" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/><text x="260.0" y="159.0" font-size="13" fill="#1a1a1a" text-anchor="middle">题目</text><rect x="326.0" y="130.0" width="280.0" height="46.0" rx="6" fill="#f4e4c1" stroke="#d97757" stroke-width="2"/><text x="466.0" y="159.0" font-size="13" fill="#1a1a1a" text-anchor="middle">思考</text><rect x="612.0" y="130.0" width="100.0" height="46.0" rx="6" fill="#f4e4c1" stroke="#d97757" stroke-width="2"/><text x="662.0" y="159.0" font-size="13" fill="#1a1a1a" text-anchor="middle">答案</text><line x1="722.0" y1="153.0" x2="758.0" y2="153.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><rect x="764.0" y="130.0" width="120.0" height="46.0" rx="8" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2"/><text x="824.0" y="159.0" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="600">答案对不对</text><text 