<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1240" height="520" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">模型与 harness 的共同演化</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">模型在某个 harness 里训练，就会习惯那个 harness 的工具和格式；harness 又会根据模型的长处调整</text><rect x="120.0" y="170.0" width="340.0" height="150.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="290.0" y="231.0" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="600">模型</text><text x="290.0" y="255.0" font-size="14" fill="#6a6a6a" text-anchor="middle">在某套工具、某种格式里</text><text x="290.0" y="277.0" font-size="14" fill="#6a6a6a" text-anchor="middle">做了大量 RL</text><rect x="780.0" y="170.0" width="340.0" height="150.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="950.0" y="231.0" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="600">Harness</text><text x="950.0" y="255.0" font-size="14" fill="#6a6a6a" text-anchor="middle">工具的形状、编辑文件的方式</text><text x="950.0" y="277.0" font-size="14" fill="#6a6a6a" text-anchor="middle">system prompt 的写法</text><path d="M 462 210 C 600 150, 640 150, 776 210" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><text x="620.0" y="150.0" font-size="14" fill="#5a5a5a" text-anchor="middle">模型擅长什么，harness 就围绕它设计</text><path d="M 776 290 C 640 350, 600 350, 462 290" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><text x="620.0" y="372.0" font-size="14" fill="#5a5a5a" text-anchor="middle">harness 用什么工具，下一代模型就在里面训练</text><rect x="220.0" y="420.0" width="800.0" height="60.0" rx="10" fill="#f3d3c4" stroke="#d97757" stroke-width="1.8"/><text x="620.0" y="457.0" font-size="15" fill="#1a1a1a" text-anchor="middle">副作用：换一个工具设计不同的 harness，同一个模型的表现可能明显下降</text></svg>