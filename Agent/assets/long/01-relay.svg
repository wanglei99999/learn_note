<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1240" height="640" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">多个会话之间的接力</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">每个会话的上下文都是全新的；接力靠的是磁盘上的文件和 git 历史，不是上下文</text><rect x="40.0" y="116.0" width="260.0" height="230.0" rx="14" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="170.0" y="150.0" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">会话 1</text><text x="170.0" y="176.0" font-size="14" fill="#6a6a6a" text-anchor="middle">初始化 agent</text><text x="64.0" y="216.0" font-size="14" fill="#5a5a5a" text-anchor="start">· 写功能清单（全部 false）</text><text x="64.0" y="250.0" font-size="14" fill="#5a5a5a" text-anchor="start">· 写 init.sh、进度文件</text><text x="64.0" y="284.0" font-size="14" fill="#5a5a5a" text-anchor="start">· 第一次提交</text><rect x="340.0" y="116.0" width="260.0" height="230.0" rx="14" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="470.0" y="150.0" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">会话 2</text><text x="470.0" y="176.0" font-size="14" fill="#6a6a6a" text-anchor="middle">工作 agent</text><text x="364.0" y="216.0" font-size="14" fill="#5a5a5a" text-anchor="start">· 读进度和 git log</text><text x="364.0" y="250.0" font-size="14" fill="#5a5a5a" text-anchor="start">· 跑 init.sh + 冒烟测试</text><text x="364.0" y="284.0" font-size="14" fill="#5a5a5a" text-anchor="start">· 做一项功能，测试，提交</text><rect x="640.0" y="116.0" width="260.0" height="230.0" rx="14" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="770.0" y="150.0" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">会话 3</text><text x="770.0" y="176.0" font-size="14" fill="#6a6a6a" text-anchor="middle">工作 agent</text><text x="664.0" y="216.0" font-size="14" fill="#5a5a5a" text-anchor="start">· 同样的开场流程</text><text x="664.0" y="250.0" font-size="14" fill="#5a5a5a" text-anchor="start">· 做下一项功能</text><text x="664.0" y="284.0" font-size="14" fill="#5a5a5a" text-anchor="start">· 更新进度，提交</text><rect x="940.0" y="116.0" width="260.0" height="230.0" rx="14" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="1070.0" y="150.0" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">会话 N</text><text x="1070.0" y="176.0" font-size="14" fill="#6a6a6a" text-anchor="middle">工作 agent</text><text x="964.0" y="216.0" font-size="14" fill="#5a5a5a" text-anchor="start">· …</text><text x="964.0" y="250.0" font-size="14" fill="#5a5a5a" text-anchor="start">· 直到清单全部为 true</text><line x1="304.0" y1="230.0" x2="336.0" y2="230.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><line x1="604.0" y1="230.0" x2="636.0" y2="230.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><line x1="904.0" y1="230.0" x2="936.0" y2="230.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><text x="620.0" y="390.0" font-size="14" fill="#6a6a6a" text-anchor="middle">每个会话开场读文件，收尾写文件；上下文不跨会话</text><rect x="40.0" y="420.0" width="1160.0" height="180.0" rx="14" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5"/><text x="60.0" y="452.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">磁盘：所有会话共享</text><rect x="60.0" y="474.0" width="265.0" height="100.0" rx="10" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="192.0" y="512.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">feature_list.json</text><text x="192.0" y="544.0" font-size="13" fill="#6a6a6a" text-anchor="middle">200+ 项，只改 passes 字段</text><rect x="345.0" y="474.0" width="265.0" height="100.0" rx="10" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="477.0" y="512.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">claude-progress.txt</text><text x="477.0" y="544.0" font-size="13" fill="#6a6a6a" text-anchor="middle">做了什么、做到哪里</text><rect x="630.0" y="474.0" width="265.0" height="100.0" rx="10" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="762.0" y="512.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">init.sh</text><text x="762.0" y="544.0" font-size="13" fill="#6a6a6a" text-anchor="middle">一条命令启动环境</text><rect x="915.0" y="474.0" width="265.0" height="100.0" rx="10" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="1047.0" y="512.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">git 历史</text><text x="1047.0" y="544.0" font-size="13" fill="#6a6a6a" text-anchor="middle">每项功能一次提交，可回滚</text><line x1="170.0" y1="348.0" x2="170.0" y2="416.0" stroke="#d97757" stroke-width="2" stroke-dasharray="5 4"/><line x1="184.0" y1="416.0" x2="184.0" y2="350.0" stroke="#d97757" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr-clay)"/><line x1="470.0" y1="348.0" x2="470.0" y2="416.0" stroke="#d97757" stroke-width="2" stroke-dasharray="5 4"/><line x1="484.0" y1="416.0" x2="484.0" y2="350.0" stroke="#d97757" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr-clay)"/><line x1="770.0" y1="348.0" x2="770.0" y2="416.0" stroke="#d97757" stroke-width="2" stroke-dasharray="5 4"/><line x1="784.0" y1="416.0" x2="784.0" y2="350.0" stroke="#d97757" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr-clay)"/><line x1="1070.0" y1="348.0" x2="1070.0" y2="416.0" stroke="#d97757" stroke-width="2" stroke-dasharray="5 4"/><line x1="1084.0" y1="416.0" x2="1084.0" y2="350.0" stroke="#d97757" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr-clay)"/></svg>