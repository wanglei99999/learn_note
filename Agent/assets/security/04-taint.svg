<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1240" height="560" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">不可信内容进入上下文之后</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">消息列表只追加：第 5 轮读进来的网页会一直留在上下文里，之后每一轮的决定都可能受它影响</text><rect x="60.0" y="150.0" width="132.0" height="70.0" rx="8" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/><text x="126.0" y="180.0" font-size="13" fill="#6a6a6a" text-anchor="middle">第 1 轮</text><text x="126.0" y="202.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600">用户任务</text><rect x="200.0" y="150.0" width="132.0" height="70.0" rx="8" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/><text x="266.0" y="180.0" font-size="13" fill="#6a6a6a" text-anchor="middle">第 2 轮</text><text x="266.0" y="202.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600">读项目文件</text><rect x="340.0" y="150.0" width="132.0" height="70.0" rx="8" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/><text x="406.0" y="180.0" font-size="13" fill="#6a6a6a" text-anchor="middle">第 3 轮</text><text x="406.0" y="202.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600">跑测试</text><rect x="480.0" y="150.0" width="132.0" height="70.0" rx="8" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/><text x="546.0" y="180.0" font-size="13" fill="#6a6a6a" text-anchor="middle">第 4 轮</text><text x="546.0" y="202.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600">读项目文件</text><rect x="620.0" y="150.0" width="132.0" height="70.0" rx="8" fill="#f3d3c4" stroke="#d97757" stroke-width="2.5"/><text x="686.0" y="180.0" font-size="13" fill="#6a6a6a" text-anchor="middle">第 5 轮</text><text x="686.0" y="202.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600">读一个外部网页</text><rect x="760.0" y="150.0" width="132.0" height="70.0" rx="8" fill="#f3d3c4" stroke="#4a4a4a" stroke-width="1.5"/><text x="826.0" y="180.0" font-size="13" fill="#6a6a6a" text-anchor="middle">第 6 轮</text><text x="826.0" y="202.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600">改代码</text><rect x="900.0" y="150.0" width="132.0" height="70.0" rx="8" fill="#f3d3c4" stroke="#4a4a4a" stroke-width="1.5"/><text x="966.0" y="180.0" font-size="13" fill="#6a6a6a" text-anchor="middle">第 7 轮</text><text x="966.0" y="202.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600">跑测试</text><rect x="1040.0" y="150.0" width="132.0" height="70.0" rx="8" fill="#f3d3c4" stroke="#4a4a4a" stroke-width="1.5"/><text x="1106.0" y="180.0" font-size="13" fill="#6a6a6a" text-anchor="middle">第 8 轮</text><text x="1106.0" y="202.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600">提交</text><line x1="616.0" y1="130.0" x2="616.0" y2="240.0" stroke="#d97757" stroke-width="2.5" stroke-dasharray="6 4"/><text x="624.0" y="122.0" font-size="14" fill="#d97757" text-anchor="start" font-weight="700">从这里开始，上下文被污染</text><rect x="60.0" y="290.0" width="540.0" height="220.0" rx="12" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="80.0" y="322.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">之前：可以给足能力</text><text x="80.0" y="358.0" font-size="14" fill="#5a5a5a" text-anchor="start">· 读写项目文件</text><text x="80.0" y="390.0" font-size="14" fill="#5a5a5a" text-anchor="start">· 运行测试和构建</text><text x="80.0" y="422.0" font-size="14" fill="#5a5a5a" text-anchor="start">· 访问白名单内的网络</text><text x="80.0" y="454.0" font-size="14" fill="#5a5a5a" text-anchor="start">· 推送到工作分支</text><rect x="640.0" y="290.0" width="540.0" height="220.0" rx="12" fill="#f3d3c4" stroke="#d97757" stroke-width="2"/><text x="660.0" y="322.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">之后：收紧有后果的操作</text><text x="660.0" y="358.0" font-size="14" fill="#5a5a5a" text-anchor="start">· 禁止访问新的域名</text><text x="660.0" y="390.0" font-size="14" fill="#5a5a5a" text-anchor="start">· 推送、发消息、写记忆需要确认</text><text x="660.0" y="422.0" font-size="14" fill="#5a5a5a" text-anchor="start">· 私有数据的读取需要确认</text><text x="660.0" y="454.0" font-size="14" fill="#5a5a5a" text-anchor="start">· 或者：交给一个没有工具的隔离模型处理</text></svg>