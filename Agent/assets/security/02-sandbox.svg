<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1240" height="620" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">沙箱的两道边界</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">文件系统隔离管“能改哪里”，网络隔离管“能发到哪里”，缺一道都不行；真正的凭据放在沙箱外面</text><rect x="60.0" y="120.0" width="700.0" height="450.0" rx="18" fill="#f3d3c4" stroke="#d97757" stroke-width="2.5" stroke-dasharray="10 6"/><text x="80.0" y="152.0" font-size="17" fill="#d97757" text-anchor="start" font-weight="700">沙箱</text><rect x="110.0" y="190.0" width="260.0" height="110.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="240.0" y="229.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">agent</text><text x="240.0" y="253.5" font-size="14" fill="#6a6a6a" text-anchor="middle">模型 + 它执行的命令</text><text x="240.0" y="275.5" font-size="14" fill="#6a6a6a" text-anchor="middle">以及命令的子进程</text><rect x="420.0" y="180.0" width="300.0" height="150.0" rx="12" fill="#ffffff" stroke="#4a4a4a" stroke-width="2"/><text x="570.0" y="212.0" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">文件系统</text><text x="570.0" y="244.0" font-size="14" fill="#5a5a5a" text-anchor="middle">项目目录：可读写</text><text x="570.0" y="270.0" font-size="14" fill="#5a5a5a" text-anchor="middle">其他目录：只读或不可见</text><text x="570.0" y="296.0" font-size="14" fill="#d97757" text-anchor="middle">~/.ssh、密钥：不可见</text><line x1="372.0" y1="245.0" x2="416.0" y2="245.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><rect x="110.0" y="380.0" width="260.0" height="110.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="240.0" y="419.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">网络</text><text x="240.0" y="443.5" font-size="14" fill="#6a6a6a" text-anchor="middle">只能经过一个</text><text x="240.0" y="465.5" font-size="14" fill="#6a6a6a" text-anchor="middle">本地代理出去</text><line x1="240.0" y1="302.0" x2="240.0" y2="376.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><rect x="860.0" y="150.0" width="320.0" height="120.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="1020.0" y="194.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">网络代理</text><text x="1020.0" y="218.5" font-size="14" fill="#6a6a6a" text-anchor="middle">域名白名单</text><text x="1020.0" y="240.5" font-size="14" fill="#6a6a6a" text-anchor="middle">新域名要用户确认</text><path d="M 372 420 H 800 V 210 H 854" fill="none" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><rect x="860.0" y="320.0" width="320.0" height="120.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="1020.0" y="364.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">git 代理</text><text x="1020.0" y="388.5" font-size="14" fill="#6a6a6a" text-anchor="middle">检查请求：只许推到指定分支</text><text x="1020.0" y="410.5" font-size="14" fill="#6a6a6a" text-anchor="middle">检查通过后才附上真 token</text><path d="M 372 460 H 820 V 380 H 854" fill="none" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><rect x="860.0" y="480.0" width="320.0" height="90.0" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="1020.0" y="520.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">真正的凭据</text><text x="1020.0" y="544.5" font-size="14" fill="#6a6a6a" text-anchor="middle">GitHub token、签名密钥</text><line x1="1020.0" y1="442.0" x2="1020.0" y2="476.0" stroke="#5a5a5a" stroke-width="2"/><text x="410.0" y="540.0" font-size="14" fill="#d97757" text-anchor="middle" font-weight="600">即使沙箱里的 agent 被注入，也拿不到凭据，发不出白名单之外的请求</text></svg>