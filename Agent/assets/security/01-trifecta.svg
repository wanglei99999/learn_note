<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1240" height="640" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">致命三要素</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">三样同时具备，攻击者只要能让 agent 读到一段文字，就可能让它把你的数据发出去</text><circle cx="520" cy="270" r="160" fill="#a8c5e6" fill-opacity="0.55" stroke="#4a4a4a" stroke-width="2.5"/><circle cx="720" cy="270" r="160" fill="#f4e4c1" fill-opacity="0.55" stroke="#4a4a4a" stroke-width="2.5"/><circle cx="620" cy="430" r="160" fill="#9dd4c7" fill-opacity="0.55" stroke="#4a4a4a" stroke-width="2.5"/><text x="440.0" y="230.0" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">私有数据</text><text x="440.0" y="256.0" font-size="13" fill="#6a6a6a" text-anchor="middle">邮件、代码仓库</text><text x="440.0" y="278.0" font-size="13" fill="#6a6a6a" text-anchor="middle">数据库、密钥</text><text x="800.0" y="230.0" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">不可信内容</text><text x="800.0" y="256.0" font-size="13" fill="#6a6a6a" text-anchor="middle">网页、邮件、issue</text><text x="800.0" y="278.0" font-size="13" fill="#6a6a6a" text-anchor="middle">第三方文档</text><text x="620.0" y="520.0" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">对外通信</text><text x="620.0" y="546.0" font-size="13" fill="#6a6a6a" text-anchor="middle">发请求、发邮件</text><text x="620.0" y="568.0" font-size="13" fill="#6a6a6a" text-anchor="middle">提交 PR</text><circle cx="620" cy="330" r="34" fill="#d97757" stroke="#4a4a4a" stroke-width="2"/><text x="620.0" y="336.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">危险</text><rect x="940.0" y="150.0" width="270.0" height="200.0" rx="12" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="960.0" y="182.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">去掉任意一个</text><text x="960.0" y="216.0" font-size="14" fill="#5a5a5a" text-anchor="start">没有私有数据：偷不到东西</text><text x="960.0" y="250.0" font-size="14" fill="#5a5a5a" text-anchor="start">没有不可信内容：没人下指令</text><text x="960.0" y="284.0" font-size="14" fill="#5a5a5a" text-anchor="start">没有对外通信：偷了也发不出去</text></svg>