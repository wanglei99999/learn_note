<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1240" height="640" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">Skill 的三级加载</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">只有第一级常驻上下文；第二级在模型判断用得上时才读；第三级按需读，脚本直接执行、不进上下文</text><rect x="40.0" y="110.0" width="380.0" height="490.0" rx="14" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="60.0" y="142.0" font-size="16" fill="#6a6a6a" text-anchor="start" font-weight="700">上下文窗口</text><rect x="60.0" y="160.0" width="340.0" height="60.0" rx="8" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/><text x="230.0" y="196.0" font-size="14" fill="#1a1a1a" text-anchor="middle">system prompt + 工具定义</text><rect x="60.0" y="230.0" width="340.0" height="96.0" rx="8" fill="#f4e4c1" stroke="#d97757" stroke-width="2"/><text x="76.0" y="256.0" font-size="13" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">pdf：读取、填写 PDF 表单时使用</text><text x="76.0" y="282.0" font-size="13" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">pptx：制作或修改幻灯片时使用</text><text x="76.0" y="308.0" font-size="13" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">… 共 50 个，每个几十 token</text><rect x="60.0" y="336.0" width="340.0" height="80.0" rx="8" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5" stroke-dasharray="6 4"/><text x="230.0" y="370.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600">pdf/SKILL.md 正文</text><text x="230.0" y="394.0" font-size="13" fill="#6a6a6a" text-anchor="middle">命中后才读进来</text><rect x="60.0" y="426.0" width="340.0" height="56.0" rx="8" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5" stroke-dasharray="6 4"/><text x="230.0" y="460.0" font-size="14" fill="#1a1a1a" text-anchor="middle">forms.md（需要填表时）</text><rect x="60.0" y="492.0" width="340.0" height="92.0" rx="8" fill="#f3efe9" stroke="#e2ddd6" stroke-width="1.5"/><text x="230.0" y="530.0" font-size="14" fill="#6a6a6a" text-anchor="middle">对话历史 …</text><line x1="404.0" y1="254.0" x2="520.0" y2="254.0" stroke="#5a5a5a" stroke-width="2" stroke-dasharray="4 4"/><rect x="520.0" y="230.0" width="520.0" height="56.0" rx="10" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="540.0" y="254.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">第 1 级 · 元数据</text><text x="540.0" y="276.0" font-size="13" fill="#6a6a6a" text-anchor="start">name + description，启动时全部加载</text><rect x="1060.0" y="242.0" width="140.0" height="32.0" rx="16" fill="#f3d3c4" stroke="#d97757" stroke-width="1.5"/><text x="1130.0" y="263.0" font-size="14" fill="#d97757" text-anchor="middle" font-weight="600">常驻</text><line x1="404.0" y1="370.0" x2="520.0" y2="370.0" stroke="#5a5a5a" stroke-width="2" stroke-dasharray="4 4"/><rect x="520.0" y="346.0" width="520.0" height="56.0" rx="10" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="540.0" y="370.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">第 2 级 · SKILL.md 正文</text><text x="540.0" y="392.0" font-size="13" fill="#6a6a6a" text-anchor="start">流程、规范、注意事项</text><rect x="1060.0" y="358.0" width="140.0" height="32.0" rx="16" fill="#ffffff" stroke="#e2ddd6" str