<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1240" height="780" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">Claude Code 的各个部件，对应本系列的哪一篇</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">根据公开文档整理（2026 年 10 月）；红色小标签是篇号</text><rect x="40.0" y="110.0" width="370.0" height="150.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="56.0" y="140.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">启动时进上下文</text><rect x="312.0" y="122.0" width="86.0" height="24.0" rx="6" fill="#f3d3c4" stroke="#d97757" stroke-width="1.5"/><text x="355.0" y="139.0" font-size="13" fill="#d97757" text-anchor="middle" font-weight="700">01·06·07</text><text x="56.0" y="168.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">system prompt、工具定义</text><text x="56.0" y="190.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">CLAUDE.md（多层）</text><text x="56.0" y="212.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">skills 的 name + description</text><rect x="435.0" y="110.0" width="370.0" height="150.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="451.0" y="140.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">工具</text><rect x="758.0" y="122.0" width="35.0" height="24.0" rx="6" fill="#f3d3c4" stroke="#d97757" stroke-width="1.5"/><text x="775.5" y="139.0" font-size="13" fill="#d97757" text-anchor="middle" font-weight="700">02</text><text x="451.0" y="168.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">Read / Edit / Write</text><text x="451.0" y="190.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">Bash（或 PowerShell）</text><text x="451.0" y="212.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">Glob / Grep、WebFetch / WebSearch</text><rect x="830.0" y="110.0" width="370.0" height="150.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="846.0" y="140.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">MCP 与 ToolSearch</text><rect x="1127.5" y="122.0" width="60.5" height="24.0" rx="6" fill="#f3d3c4" stroke="#d97757" stroke-width="1.5"/><text x="1157.8" y="139.0" font-size="13" fill="#d97757" text-anchor="middle" font-weight="700">02·06</text><text x="846.0" y="168.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">外部服务的工具</text><text x="846.0" y="190.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">工具很多时延迟加载定义</text><text x="846.0" y="212.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">用到再取 schema</text><rect x="330.0" y="300.0" width="580.0" height="170.0" rx="16" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="3" filter="url(#soft)"/><text x="620.0" y="340.0" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">主循环</text><text x="620.0" y="372.0" font-size="14" fill="#5a5a5a" text-anchor="middle">模型决定调用什么 → harness 执行 → 结果拼回上下文</text><text x="620.0" y="398.0" font-size="14" fill="#5a5a5a" text-anchor="middle">交错思考；工具出错时把错误回填</text><rect x="860.0" y="312.0" width="38.0" height="24.0" rx="6" fill="#f3d3c4" stroke="#d97757" stroke-width="1.5"/><text x="879.0" y="329.0" font-size="13" fill="#d97757" text-anchor="middle" font-weight="700">03</text><text x="620.0" y="440.0" font-size="14" fill="#6a6a6a" text-anchor="middle">plan 模式：先只读探索、写计划，批准后再改</text><rect x="40.0" y="300.0" width="260.0" height="170.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="56.0" y="330.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">上下文管理</text><rect x="253.0" y="312.0" width="35.0" height="24.0" rx="6" fill="#f3d3c4" stroke="#d97757" stroke-width="1.5"/><text x="270.5" y="329.0" font-size="13" fill="#d97757" text-anchor="middle" font-weight="700">05</text><text x="56.0" y="358.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">自动压缩 /compact</text><text x="56.0" y="380.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">大输出截断</text><text x="56.0" y="402.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">PreCompact hook</text><rect x="940.0" y="300.0" width="260.0" height="170.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="956.0" y="330.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">子 agent</text><rect x="1153.0" y="312.0" width="35.0" height="24.0" rx="6" fill="#f3d3c4" stroke="#d97757" stroke-width="1.5"/><text x="1170.5" y="329.0" font-size="13" fill="#d97757" text-anchor="middle" font-weight="700">09</text><text x="956.0" y="358.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">Agent 工具</text><text x="956.0" y="380.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">独立上下文</text><text x="956.0" y="402.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">只回传结论</text><rect x="40.0" y="510.0" width="280.0" height="160.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="56.0" y="540.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">反馈与护栏</text><rect x="273.0" y="522.0" width="35.0" height="24.0" rx="6" fill="#f3d3c4" stroke="#d97757" stroke-width="1.5"/><text x="290.5" y="539.0" font-size="13" fill="#d97757" text-anchor="middle" font-weight="700">04</text><text x="56.0" y="568.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">hooks：PreToolUse、</text><text x="56.0" y="590.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">PostToolUse、Stop …</text><text x="56.0" y="612.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">exit 2 可以拦截</text><rect x="340.0" y="510.0" width="280.0" height="160.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="356.0" y="540.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">任务清单</text><rect x="547.5" y="522.0" width="60.5" height="24.0" rx="6" fill="#f3d3c4" stroke="#d97757" stroke-width="1.5"/><text x="577.8" y="539.0" font-size="13" fill="#d97757" text-anchor="middle" font-weight="700">05·08</text><text x="356.0" y="568.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">TaskCreate / TaskUpdate</text><text x="356.0" y="590.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">（早期是 TodoWrite）</text><text x="356.0" y="612.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">目标反复出现在末尾</text><rect x="640.0" y="510.0" width="280.0" height="160.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="656.0" y="540.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">权限</text><rect x="873.0" y="522.0" width="35.0" height="24.0" rx="6" fill="#f3d3c4" stroke="#d97757" stroke-width="1.5"/><text x="890.5" y="539.0" font-size="13" fill="#d97757" text-anchor="middle" font-weight="700">11</text><text x="656.0" y="568.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">default / acceptEdits</text><text x="656.0" y="590.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">plan / auto / dontAsk</text><text x="656.0" y="612.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">allow / deny 规则</text><rect x="940.0" y="510.0" width="260.0" height="160.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="956.0" y="540.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">沙箱</text><rect x="1153.0" y="522.0" width="35.0" height="24.0" rx="6" fill="#f3d3c4" stroke="#d97757" stroke-width="1.5"/><text x="1170.5" y="539.0" font-size="13" fill="#d97757" text-anchor="middle" font-weight="700">11</text><text x="956.0" y="568.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">文件系统 + 网络</text><text x="956.0" y="590.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">两道边界</text><text x="956.0" y="612.0" font-size="13" fill="#5a5a5a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">网页版凭据在沙箱外</text><line x1="180.0" y1="472.0" x2="180.0" y2="506.0" stroke="#e2ddd6" stroke-width="2"/><line x1="480.0" y1="472.0" x2="480.0" y2="506.0" stroke="#e2ddd6" stroke-width="2"/><line x1="780.0" y1="472.0" x2="780.0" y2="506.0" stroke="#e2ddd6" stroke-width="2"/><line x1="1070.0" y1="472.0" x2="1070.0" y2="506.0" stroke="#e2ddd6" stroke-width="2"/><text x="620.0" y="720.0" font-size="14" fill="#d97757" text-anchor="middle" font-weight="600">第 12 篇的评估在这张图之外：同一个模型放进这套 harness 里，整体是好是坏，要靠评估来回答</text></svg>