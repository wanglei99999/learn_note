<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1200" height="680" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">Agent 循环</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">模型决定下一步做什么，harness 负责执行并把结果拼回上下文，直到模型说“做完了”</text><rect x="90.0" y="310.0" width="220.0" height="120.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="200.0" y="354.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">上下文</text><text x="200.0" y="378.5" font-size="14" fill="#6a6a6a" text-anchor="middle">system + 工具定义</text><text x="200.0" y="400.5" font-size="14" fill="#6a6a6a" text-anchor="middle">+ 全部历史</text><rect x="470.0" y="310.0" width="220.0" height="120.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="580.0" y="354.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">模型</text><text x="580.0" y="378.5" font-size="14" fill="#6a6a6a" text-anchor="middle">读上下文</text><text x="580.0" y="400.5" font-size="14" fill="#6a6a6a" text-anchor="middle">决定下一步</text><rect x="850.0" y="190.0" width="250.0" height="110.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="975.0" y="229.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">执行工具</text><text x="975.0" y="253.5" font-size="14" fill="#6a6a6a" text-anchor="middle">harness 运行命令、读文件</text><text x="975.0" y="275.5" font-size="14" fill="#6a6a6a" text-anchor="middle">结果作为 tool_result</text><rect x="850.0" y="460.0" width="250.0" height="110.0" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="975.0" y="499.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">结束</text><text x="975.0" y="523.5" font-size="14" fill="#6a6a6a" text-anchor="middle">stop_reason = end_turn</text><text x="975.0" y="545.5" font-size="14" fill="#6a6a6a" text-anchor="middle">返回最终回答</text><line x1="312.0" y1="370.0" x2="466.0" y2="370.0" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><path d="M 692 350 C 770 350, 770 245, 846 245" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><text x="752.0" y="282.0" font-size="14" fill="#5a5a5a" text-anchor="end">tool_use</text><path d="M 692 390 C 770 390, 770 515, 846 515" fill="none" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><text x="752.0" y="470.0" font-size="14" fill="#5a5a5a" text-anchor="end">end_turn</text><path d="M 975 186 C 975 120, 200 120, 200 306" fill="none" stroke="#d97757" stroke-width="2.5" marker-end="url(#arr-clay)"/><text x="590.0" y="226.0" font-size="15" fill="#d97757" text-anchor="middle" font-weight="600">把调用和结果追加进历史，再调一次模型</text><rect x="90.0" y="508.0" width="600.0" height="120.0" rx="12" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="110.0" y="540.0" font-size="15" fill="#6a6a6a" text-anchor="start" font-weight="700">harness 额外加的刹车</text><text x="110.0" y="570.0" font-size="14" fill="#5a5a5a" text-anchor="start">· 最大轮数、token 预算、时间上限</text><text x="110.0" y="594.0" font-size="14" fill="#5a5a5a" text-anchor="start">· 用户随时打断</text><text x="110.0" y="618.0" font-size="14" fill="#5a5a5a" text-anchor="start">· 工具出错不抛异常，把错误信息当结果回填</text></svg>