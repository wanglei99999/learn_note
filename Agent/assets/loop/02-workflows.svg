<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1240" height="780" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">五种 workflow 与 agent</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">前五种的执行路径由代码写死，模型只负责每一格里的内容；agent 的路径由模型自己决定</text><rect x="40.0" y="110.0" width="380.0" height="300.0" rx="14" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="60.0" y="144.0" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="700">提示链</text><text x="60.0" y="170.0" font-size="14" fill="#6a6a6a" text-anchor="start">一步的输出是下一步的输入</text><rect x="430.0" y="110.0" width="380.0" height="300.0" rx="14" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="450.0" y="144.0" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="700">路由</text><text x="450.0" y="170.0" font-size="14" fill="#6a6a6a" text-anchor="start">先分类，再交给专门的处理流程</text><rect x="820.0" y="110.0" width="380.0" height="300.0" rx="14" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="840.0" y="144.0" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="700">并行</text><text x="840.0" y="170.0" font-size="14" fill="#6a6a6a" text-anchor="start">拆成子任务同时做，或多次投票</text><rect x="40.0" y="440.0" width="380.0" height="300.0" rx="14" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.