<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1240" height="600" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">并行调用：三个 tool_use，三个 tool_result，靠 id 配对</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">执行可以乱序完成，其中一个失败也要返回一条结果；下一次请求里，每个 id 都必须有对应的结果</text><rect x="40.0" y="110.0" width="560.0" height="440.0" rx="14" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="60.0" y="142.0" font-size="15" fill="#6a6a6a" text-anchor="start" font-weight="700">assistant 消息（模型输出）</text><rect x="60.0" y="166.0" width="520.0" height="54.0" rx="8" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/><text x="80.0" y="199.0" font-size="14" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">tool_use  id=t1  get_weather(city="上海")</text><rect x="60.0" y="236.0" width="520.0" height="54.0" rx="8" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/><text x="80.0" y="269.0" font-size="14" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">tool_use  id=t2  get_weather(city="北京")</text><rect x="60.0" y="306.0" width="520.0" height="54.0" rx="8" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/><text x="80.0" y="339.0" font-size="14" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">tool_use  id=t3  get_weather(city="拉萨")</text><rect x="640.0" y="110.0" width="560.0" height="440.0" rx="14" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="660.0" y="142.0" font-size="15" fill="#6a6a6a" text-anchor="start" font-weight="700">下一条 user 消息（harness 组装）</text><rect x="660.0" y="166.0" width="520.0" height="54.0" rx="8" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/><text x="680.0" y="199.0" font-size="13" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">tool_result  id=t2  {"temp": 9, "sky": "晴"}</text><rect x="660.0" y="236.0" width="520.0" height="54.0" rx="8" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/><text x="680.0" y="269.0" font-size="13" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">tool_result  id=t1  {"temp": 18, "sky": "小雨"}</text><rect x="660.0" y="306.0" width="520.0" height="54.0" rx="8" fill="#f3d3c4" stroke="#d97757" stroke-width="1.5"/><text x="680.0" y="339.0" font-size="13" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">tool_result  id=t3  is_error: 城市不在支持范围内</text><line x1="582.0" y1="193.0" x2="656.0" y2="263.0" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#arr)"/><line x1="582.0" y1="263.0" x2="656.0" y2="193.0" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#arr)"/><line x1="582.0" y1="333.0" x2="656.0" y2="333.0" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#arr)"/><text x="60.0" y="420.0" font-size="14" fill="#5a5a5a" text-anchor="start">· 结果的顺序可以和调用不同，模型靠 id 对应</text><text x="60.0" y="448.0" font-size="14" fill="#5a5a5a" text-anchor="start">· 漏掉任何一个 id，下一次请求会被 API 拒绝</text><text x="60.0" y="476.0" font-size="14" fill="#5a5a5a" text-anchor="start">· 失败用 is_error 标记，错误信息就是模型下一步的输入</text><text x="60.0" y="504.0" font-size="14" fill="#5a5a5a" text-anchor="start">· 三个结果放在同一条消息里：少两次往返，少两遍全量重发</text></svg>