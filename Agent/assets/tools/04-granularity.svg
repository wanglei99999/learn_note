<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1240" height="500" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">工具粒度决定 token 消耗（示意）</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">左：找一个联系人；右：约一个会。上下文按 2 万 token 计，每多一轮调用就要多发一遍全部上下文</text><text x="60.0" y="140.0" font-size="15" fill="#6a6a6a" text-anchor="start" font-weight="700">返回给模型的 token</text><text x="60.0" y="200.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">list_contacts：返回全部 2,000 人</text><rect x="60.0" y="210.0" width="400.0" height="44.0" rx="6" fill="#d97757" stroke="#4a4a4a" stroke-width="1.5"/><text x="470.0" y="238.0" font-size="14" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">60,000 token</text><text x="60.0" y="282.0" font-size="13" fill="#6a6a6a" text-anchor="start">每人约 30 token，模型自己在里面找</text><text x="60.0" y="320.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">search_contacts(name="张伟")：返回 3 人</text><rect x="60.0" y="330.0" width="4.0" height="44.0" rx="6" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/><text x="74.0" y="358.0" font-size="14" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">100 token</text><text x="60.0" y="402.0" font-size="13" fill="#6a6a6a" text-anchor="start">程序替模型做了筛选</text><text x="660.0" y="140.0" font-size="15" fill="#6a6a6a" text-anchor="start" font-weight="700">完成任务的总输入 token</text><text x="660.0" y="200.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">list_users → list_events × 2 → create_event</text><rect x="660.0" y="210.0" width="400.0" height="44.0" rx="6" fill="#d97757" stroke="#4a4a4a" stroke-width="1.5"/><text x="1070.0" y="238.0" font-size="14" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">80,000 token</text><text x="660.0" y="282.0" font-size="13" fill="#6a6a6a" text-anchor="start">4 次调用，每次都带上约 2 万 token 的上下文</text><text x="660.0" y="320.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">schedule_event(参会人, 时长, 时间范围)</text><rect x="660.0" y="330.0" width="100.0" height="44.0" rx="6" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/><text x="770.0" y="358.0" font-size="14" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">20,000 token</text><text x="660.0" y="402.0" font-size="13" fill="#6a6a6a" text-anchor="start">1 次调用，找空档和建会都在工具内部完成</text></svg>