<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1240" height="760" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">一次工具调用的往返</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">模型只负责写出“想调用什么”，真正去调用的是你的程序；一来一回是两次独立的 API 调用</text><rect x="90.0" y="108.0" width="220.0" height="52.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="200.0" y="141.0" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">模型 API</text><line x1="200.0" y1="160.0" x2="200.0" y2="730.0" stroke="#e2ddd6" stroke-width="2" stroke-dasharray="6 6"/><rect x="510.0" y="108.0" width="220.0" height="52.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="620.0" y="141.0" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">你的程序</text><line x1="620.0" y1="160.0" x2="620.0" y2="730.0" stroke="#e2ddd6" stroke-width="2" stroke-dasharray="6 6"/><rect x="930.0" y="108.0" width="220.0" height="52.0" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="1040.0" y="141.0" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">天气服务</text><line x1="1040.0" y1="160.0" x2="1040.0" y2="730.0" stroke="#e2ddd6" stroke-width="2" stroke-dasharray="6 6"/><line x1="614.0" y1="214.0" x2="208.0" y2="214.0" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><text x="410.0" y="202.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">① 消息 + 工具定义</text><text x="410.0" y="238.0" font-size="13" fill="#6a6a6a" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">tools: [get_weather(city)]</text><line x1="206.0" y1="300.0" x2="612.0" y2="300.0" stroke="#d97757" stroke-width="2.5" marker-end="url(#arr-clay)"/><text x="410.0" y="288.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">② 不直接回答，返回一个调用请求</text><text x="410.0" y="324.0" font-size="13" fill="#6a6a6a" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">tool_use{id: t1, input:{city:"上海"}}</text><text x="410.0" y="352.0" font-size="13" fill="#d97757" text-anchor="middle">stop_reason = tool_use，这次调用结束</text><line x1="626.0" y1="410.0" x2="1032.0" y2="410.0" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><text x="830.0" y="398.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">③ 程序解析参数，真正去调用</text><text x="830.0" y="434.0" font-size="13" fill="#6a6a6a" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">GET /weather?city=上海</text><line x1="1034.0" y1="490.0" x2="628.0" y2="490.0" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><text x="830.0" y="478.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">④ 返回结果</text><text x="830.0" y="514.0" font-size="13" fill="#6a6a6a" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">{"temp": 18, "sky": "小雨"}</text><line x1="614.0" y1="576.0" x2="208.0" y2="576.0" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><text x="410.0" y="564.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">⑤ 全部历史 + 工具结果</text><text x="410.0" y="600.0" font-size="13" fill="#6a6a6a" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">tool_result{tool_use_id: t1, ...}</text><line x1="206.0" y1="662.0" x2="612.0" y2="662.0" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><text x="410.0" y="650.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">⑥ 根据结果作答</text><text x="410.0" y="686.0" font-size="13" fill="#6a6a6a" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">“上海 18 度，小雨，带把伞。”</text><text x="410.0" y="714.0" font-size="13" fill="#6a6a6a" text-anchor="middle">stop_reason = end_turn</text><rect x="36.0" y="190.0" width="34.0" height="170.0" rx="6" fill="#f3d3c4" stroke="#d97757" stroke-width="1.5"/><text x="53" y="275" font-size="14" fill="#d97757" font-weight="700" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 53 275)">第 1 次 API 调用</text><rect x="36.0" y="552.0" width="34.0" height="170.0" rx="6" fill="#f3d3c4" stroke="#d97757" stroke-width="1.5"/><text x="53" y="637" font-size="14" fill="#d97757" font-weight="700" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 53 637)">第 2 次 API 调用</text></svg>