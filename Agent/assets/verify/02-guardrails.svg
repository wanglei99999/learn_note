<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1200" height="660" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">护栏的分层</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">上面几层靠模型自觉，下面几层由程序强制执行；越往下越确定，越难被绕过</text><rect x="80.0" y="112.0" width="1040.0" height="72.0" rx="12" fill="#ffffff" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="110.0" y="156.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="700">提示里的规则</text><text x="330.0" y="156.0" font-size="14" fill="#5a5a5a" text-anchor="start">“不要修改测试文件”“提交前先跑测试”</text><text x="1090.0" y="156.0" font-size="14" fill="#6a6a6a" text-anchor="end">模型多数时候会照做</text><rect x="94.0" y="198.0" width="1012.0" height="72.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="124.0" y="242.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="700">工具设计</text><text x="330.0" y="242.0" font-size="14" fill="#5a5a5a" text-anchor="start">只给需要的工具；参数用 schema 约束</text><text x="1076.0" y="242.0" font-size="14" fill="#6a6a6a" text-anchor="end">做不到的事就不会去做</text><rect x="108.0" y="284.0" width="984.0" height="72.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="138.0" y="328.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="700">hooks</text><text x="330.0" y="328.0" font-size="14" fill="#5a5a5a" text-anchor="start">每次编辑后自动格式化；拦截危险命令</text><text x="1062.0" y="328.0" font-size="14" fill="#6a6a6a" text-anchor="end">在固定时机必然执行</text><rect x="122.0" y="370.0" width="956.0" height="72.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="152.0" y="414.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="700">lint 与类型检查</text><text x="330.0" y="414.0" font-size="14" fill="#5a5a5a" text-anchor="start">依赖方向、命名、文件大小</text><text x="1048.0" y="414.0" font-size="14" fill="#6a6a6a" text-anchor="end">报错信息直接告诉模型怎么改</text><rect x="136.0" y="456.0" width="928.0" height="72.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="166.0" y="500.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="700">测试与 CI</text><text x="330.0" y="500.0" font-size="14" fill="#5a5a5a" text-anchor="start">不过就不能合并</text><text x="1034.0" y="500.0" font-size="14" fill="#6a6a6a" text-anchor="end">结果不由模型说了算</text><rect x="150.0" y="542.0" width="900.0" height="72.0" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="180.0" y="586.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="700">权限与沙箱</text><text x="330.0" y="586.0" font-size="14" fill="#5a5a5a" text-anchor="start">文件和网络访问的边界</text><text x="1020.0" y="586.0" font-size="14" fill="#6a6a6a" text-anchor="end">第 11 篇</text><line x1="50.0" y1="120.0" x2="50.0" y2="620.0" stroke="#d97757" stroke-width="2.5" marker-end="url(#arr-clay)"/><text x="34" y="370" font-size="14" fill="#d97757" font-weight="700" text-anchor="middle" transform="rotate(90 34 370)">越来越硬</text></svg>