<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1200" height="600" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">agent 能拿到的反馈</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">越往右越接近“真的能用”，也越慢、越贵；好的 harness 把便宜的检查放在每一轮，贵的放在宣布完成之前</text><rect x="40.0" y="320.0" width="176.0" height="150.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="128.0" y="356.0" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">自己读一遍</text><text x="128.0" y="382.0" font-size="13" fill="#6a6a6a" text-anchor="middle">模型看自己的 diff</text><text x="128.0" y="408.0" font-size="13" fill="#5a5a5a" text-anchor="middle">几乎不花时间</text><rect x="228.0" y="284.0" width="176.0" height="186.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="316.0" y="320.0" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">编译 / 类型检查</text><text x="316.0" y="346.0" font-size="13" fill="#6a6a6a" text-anchor="middle">语法、类型、引用</text><text x="316.0" y="372.0" font-size="13" fill="#5a5a5a" text-anchor="middle">秒级</text><rect x="416.0" y="248.0" width="176.0" height="222.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="504.0" y="284.0" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">lint</text><text x="504.0" y="310.0" font-size="13" fill="#6a6a6a" text-anchor="middle">风格和架构规则</text><text x="504.0" y="336.0" font-size="13" fill="#5a5a5a" text-anchor="middle">秒级</text><rect x="604.0" y="212.0" width="176.0" height="258.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="692.0" y="248.0" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">单元测试</text><text x="692.0" y="274.0" font-size="13" fill="#6a6a6a" text-anchor="middle">函数的行为</text><text x="692.0" y="300.0" font-size="13" fill="#5a5a5a" text-anchor="middle">秒到分钟</text><rect x="792.0" y="176.0" width="176.0" height="294.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="880.0" y="212.0" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">端到端测试</text><text x="880.0" y="238.0" font-size="13" fill="#6a6a6a" text-anchor="middle">浏览器里点一遍</text><text x="880.0" y="264.0" font-size="13" fill="#5a5a5a" text-anchor="middle">分钟级</text><rect x="980.0" y="140.0" width="176.0" height="330.0" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="1068.0" y="176.0" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">日志 / 指标</text><text x="1068.0" y="202.0" font-size="13" fill="#6a6a6a" text-anchor="middle">运行时真实表现</text><text x="1068.0" y="228.0" font-size="13" fill="#5a5a5a" text-anchor="middle">分钟级</text><line x1="60.0" y1="510.0" x2="1140.0" y2="510.0" stroke="#d97757" stroke-width="2.5" marker-end="url(#arr-clay)"/><text x="60.0" y="540.0" font-size="15" fill="#d97757" text-anchor="start" font-weight="600">便宜、快，但只能查出表面问题</text><text x="1140.0" y="540.0" font-size="15" fill="#d97757" text-anchor="end" font-weight="600">离真实使用越近，反馈越可信</text></svg>