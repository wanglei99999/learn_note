<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1240" height="560" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">信息可以存在三个地方</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">agent 的“记忆”指的主要是第三列：在上下文窗口之外、跨会话保存，并且由 agent 自己读写</text><rect x="60.0" y="116.0" width="350.0" height="380.0" rx="14" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="235.0" y="162.0" font-size="22" fill="#1a1a1a" text-anchor="middle" font-weight="700">权重</text><rect x="90.0" y="196.0" width="290.0" height="52.0" rx="10" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="235.0" y="228.0" font-size="15" fill="#5a5a5a" text-anchor="middle">训练时写入</text><rect x="90.0" y="266.0" width="290.0" height="52.0" rx="10" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="235.0" y="298.0" font-size="15" fill="#5a5a5a" text-anchor="middle">部署后不变</text><rect x="90.0" y="336.0" width="290.0" height="52.0" rx="10" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="235.0" y="368.0" font-size="15" fill="#5a5a5a" text-anchor="middle">容量大，但改不了</text><rect x="90.0" y="406.0" width="290.0" height="52.0" rx="10" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="235.0" y="438.0" font-size="15" fill="#5a5a5a" text-anchor="middle">知道世界，不知道你</text><rect x="450.0" y="116.0" width="350.0" height="380.0" rx="14" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="625.0" y="162.0" font-size="22" fill="#1a1a1a" text-anchor="middle" font-weight="700">上下文</text><rect x="480.0" y="196.0" width="290.0" height="52.0" rx="10" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="625.0" y="228.0" font-size="15" fill="#5a5a5a" text-anchor="middle">每次调用时拼进来</text><rect x="480.0" y="266.0" width="290.0" height="52.0" rx="10" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="625.0" y="298.0" font-size="15" fill="#5a5a5a" text-anchor="middle">调用结束就消失</text><rect x="480.0" y="336.0" width="290.0" height="52.0" rx="10" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="625.0" y="368.0" font-size="15" fill="#5a5a5a" text-anchor="middle">几十万 token 上限</text><rect x="480.0" y="406.0" width="290.0" height="52.0" rx="10" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="625.0" y="438.0" font-size="15" fill="#5a5a5a" text-anchor="middle">越长越贵、越不准</text><rect x="840.0" y="116.0" width="350.0" height="380.0" rx="14" fill="#9dd4c7" stroke="#d97757" stroke-width="3" filter="url(#soft)"/><text x="1015.0" y="162.0" font-size="22" fill="#1a1a1a" text-anchor="middle" font-weight="700">外部存储</text><rect x="870.0" y="196.0" width="290.0" height="52.0" rx="10" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="1015.0" y="228.0" font-size="15" fill="#5a5a5a" text-anchor="middle">文件、数据库、向量库</text><rect x="870.0" y="266.0" width="290.0" height="52.0" rx="10" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="1015.0" y="298.0" font-size="15" fill="#5a5a5a" text-anchor="middle">跨会话保存</text><rect x="870.0" y="336.0" width="290.0" height="52.0" rx="10" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="1015.0" y="368.0" font-size="15" fill="#5a5a5a" text-anchor="middle">容量几乎不限</text><rect x="870.0" y="406.0" width="290.0" height="52.0" rx="10" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="1015.0" y="438.0" font-size="15" fill="#5a5a5a" text-anchor="middle">要靠工具读写</text><line x1="802.0" y1="300.0" x2="836.0" y2="300.0" stroke="#d97757" stroke-width="2.5" marker-end="url(#arr-clay)"/><line x1="836.0" y1="340.0" x2="802.0" y2="340.0" stroke="#d97757" stroke-width="2.5" marker-end="url(#arr-clay)"/><text x="819.0" y="530.0" font-size="14" fill="#d97757" text-anchor="middle" font-weight="600">读进来 / 写出去</text></svg>