<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="580" viewBox="0 0 1240 580"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1240" height="580" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">记忆的读、写与整理</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">写入在会话中发生，读取在会话开始和需要时发生，整理可以放到后台异步做</text><rect x="40.0" y="110.0" width="700.0" height="430.0" rx="14" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="60.0" y="142.0" font-size="16" fill="#6a6a6a" text-anchor="start" font-weight="700">一次会话</text><rect x="70.0" y="170.0" width="200.0" height="90.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="170.0" y="199.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">会话开始</text><text x="170.0" y="223.5" font-size="14" fill="#6a6a6a" text-anchor="middle">读入索引文件</text><text x="170.0" y="245.5" font-size="14" fill="#6a6a6a" text-anchor="middle">（常驻部分）</text><rect x="300.0" y="170.0" width="200.0" height="90.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="400.0" y="199.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">工作中</text><text x="400.0" y="223.5" font-size="14" fill="#6a6a6a" text-anchor="middle">需要时检索</text><text x="400.0" y="245.5" font-size="14" fill="#6a6a6a" text-anchor="middle">或按路径读取</text><rect x="530.0" y="170.0" width="190.0" height="90.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="625.0" y="199.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">发生值得记的事</text><text x="625.0" y="223.5" font-size="14" fill="#6a6a6a" text-anchor="middle">用户纠正、做了决定</text><text x="625.0" y="245.5" font-size="14" fill="#6a6a6a" text-anchor="middle">踩了坑</text><line x1="272.0" y1="215.0" x2="296.0" y2="215.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><line x1="502.0" y1="215.0" x2="526.0" y2="215.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><rect x="530.0" y="330.0" width="190.0" height="90.0" rx="12" fill="#f3d3c4" stroke="#d97757" stroke-width="2.5" filter="url(#soft)"/><text x="625.0" y="359.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">写入</text><text x="625.0" y="383.5" font-size="14" fill="#6a6a6a" text-anchor="middle">先查有没有旧的</text><text x="625.0" y="405.5" font-size="14" fill="#6a6a6a" text-anchor="middle">有就更新，没有再新建</text><line x1="625.0" y1="262.0" x2="625.0" y2="326.0" stroke="#d97757" stroke-width="2.5" marker-end="url(#arr-clay)"/><text x="70.0" y="470.0" font-size="15" fill="#d97757" text-anchor="start" font-weight="600">风险：写错、过时、互相矛盾、被注入</text><text x="70.0" y="500.0" font-size="14" fill="#5a5a5a" text-anchor="start">写进去的东西，下次会被当成事实读回来</text><rect x="800.0" y="140.0" width="400.0" height="220.0" rx="14" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="1000.0" y="178.0" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">外部存储</text><rect x="830.0" y="196.0" width="340.0" height="30.0" rx="6" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="846.0" y="216.0" font-size="13" fill="#5a5a5a" text-anchor="start">MEMORY.md：一行一条的索引</text><rect x="830.0" y="234.0" width="340.0" height="30.0" rx="6" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="846.0" y="254.0" font-size="13" fill="#5a5a5a" text-anchor="start">user-偏好.md</text><rect x="830.0" y="272.0" width="340.0" height="30.0" rx="6" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="846.0" y="292.0" font-size="13" fill="#5a5a5a" text-anchor="start">project-约定.md</text><rect x="830.0" y="310.0" width="340.0" height="30.0" rx="6" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="846.0" y="330.0" font-size="13" fill="#5a5a5a" text-anchor="start">…</text><path d="M 722 375 C 760 375, 760 300, 796 300" fill="none" stroke="#d97757" stroke-width="2.5" marker-end="url(#arr-clay)"/><path d="M 900 136 C 900 96, 170 96, 170 166" fill="none" stroke="#5a5a5a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/><rect x="800.0" y="410.0" width="400.0" height="110.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="1000.0" y="449.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">后台整理</text><text x="1000.0" y="473.5" font-size="14" fill="#6a6a6a" text-anchor="middle">合并重复、删掉过时的、解决冲突</text><text x="1000.0" y="495.5" font-size="14" fill="#6a6a6a" text-anchor="middle">可以在没人用的时候异步做</text><line x1="1000.0" y1="362.0" x2="1000.0" y2="406.0" stroke="#5a5a5a" stroke-width="2"/></svg>