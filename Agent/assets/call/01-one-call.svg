<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1240" height="520" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">一次调用：从请求到响应</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">左右两端在你的程序里，中间四步在服务端；响应发出后，服务端什么也不留下</text><rect x="236.0" y="112.0" width="768.0" height="300.0" rx="14" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5" stroke-dasharray="6 6"/><text x="256.0" y="140.0" font-size="15" fill="#6a6a6a" text-anchor="start" font-weight="700">服务端</text><rect x="40.0" y="186.0" width="160.0" height="150.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="120.0" y="235.0" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="600">请求</text><text x="120.0" y="259.0" font-size="14" fill="#6a6a6a" text-anchor="middle">system</text><text x="120.0" y="281.0" font-size="14" fill="#6a6a6a" text-anchor="middle">messages</text><text x="120.0" y="303.0" font-size="14" fill="#6a6a6a" text-anchor="middle">max_tokens 等参数</text><rect x="256.0" y="186.0" width="168.0" height="150.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="340.0" y="246.0" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="600">chat 模板</text><text x="340.0" y="270.0" font-size="14" fill="#6a6a6a" text-anchor="middle">消息列表拼成</text><text x="340.0" y="292.0" font-size="14" fill="#6a6a6a" text-anchor="middle">一段带特殊标记的文本</text><rect x="446.0" y="186.0" width="168.0" height="150.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="530.0" y="246.0" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="600">分词</text><text x="530.0" y="270.0" font-size="14" fill="#6a6a6a" text-anchor="middle">文本切成 token id</text><text x="530.0" y="292.0" font-size="14" fill="#6a6a6a" text-anchor="middle">（几百到几十万个）</text><rect x="636.0" y="186.0" width="168.0" height="150.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="720.0" y="246.0" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="600">prefill</text><text x="720.0" y="270.0" font-size="14" fill="#6a6a6a" text-anchor="middle">整段 prompt 并行算一遍</text><text x="720.0" y="292.0" font-size="14" fill="#6a6a6a" text-anchor="middle">K、V 存进缓存</text><rect x="826.0" y="186.0" width="168.0" height="150.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="910.0" y="246.0" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="600">decode</text><text x="910.0" y="270.0" font-size="14" fill="#6a6a6a" text-anchor="middle">一次采样一个 token</text><text x="910.0" y="292.0" font-size="14" fill="#6a6a6a" text-anchor="middle">直到满足停止条件</text><rect x="1040.0" y="186.0" width="160.0" height="150.0" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="1120.0" y="235.0" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="600">响应</text><text x="1120.0" y="259.0" font-size="14" fill="#6a6a6a" text-anchor="middle">content</text><text x="1120.0" y="281.0" font-size="14" fill="#6a6a6a" text-anchor="middle">stop_reason</text><text x="1120.0" y="303.0" font-size="14" fill="#6a6a6a" text-anchor="middle">usage</text><line x1="202.0" y1="261.0" x2="252.0" y2="261.0" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><line x1="426.0" y1="261.0" x2="442.0" y2="261.0" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><line x1="616.0" y1="261.0" x2="632.0" y2="261.0" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><line x1="806.0" y1="261.0" x2="822.0" y2="261.0" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><line x1="996.0" y1="261.0" x2="1036.0" y2="261.0" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arr)"/><path d="M 880 336 C 880 386, 940 386, 940 340" fill="none" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><text x="910.0" y="398.0" font-size="13" fill="#6a6a6a" text-anchor="middle">新 token 追加到末尾</text><rect x="236.0" y="432.0" width="768.0" height="52.0" rx="10" fill="#f3d3c4" stroke="#d97757" stroke-width="1.8"/><text x="620.0" y="464.0" font-size="15" fill="#1a1a1a" text-anchor="middle">下一次调用进来时，上面这些全部从头再算一遍（除非命中前缀缓存，见第 05 篇）</text></svg>