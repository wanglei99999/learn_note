<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1240" height="470" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">一次调用的耗时：prefill 一段，decode 一段（示意）</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">输入 10,000 token，输出 500 token；假设 prefill 每秒 5,000 token、decode 每秒 50 token</text><rect x="120.0" y="160.0" width="180.0" height="60.0" rx="8" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2"/><text x="210.0" y="196.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">prefill 2 秒</text><rect x="304.0" y="160.0" width="900.0" height="60.0" rx="8" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2"/><line x1="394.0" y1="166.0" x2="394.0" y2="214.0" stroke="#7fa3cc" stroke-width="1"/><line x1="484.0" y1="166.0" x2="484.0" y2="214.0" stroke="#7fa3cc" stroke-width="1"/><line x1="574.0" y1="166.0" x2="574.0" y2="214.0" stroke="#7fa3cc" stroke-width="1"/><line x1="664.0" y1="166.0" x2="664.0" y2="214.0" stroke="#7fa3cc" stroke-width="1"/><line x1="754.0" y1="166.0" x2="754.0" y2="214.0" stroke="#7fa3cc" stroke-width="1"/><line x1="844.0" y1="166.0" x2="844.0" y2="214.0" stroke="#7fa3cc" stroke-width="1"/><line x1="934.0" y1="166.0" x2="934.0" y2="214.0" stroke="#7fa3cc" stroke-width="1"/><line x1="1024.0" y1="166.0" x2="1024.0" y2="214.0" stroke="#7fa3cc" stroke-width="1"/><line x1="1114.0" y1="166.0" x2="1114.0" y2="214.0" stroke="#7fa3cc" stroke-width="1"/><text x="754.0" y="196.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">decode 10 秒：500 个 token 逐个生成</text><line x1="120.0" y1="250.0" x2="1204.0" y2="250.0" stroke="#e2ddd6" stroke-width="2"/><line x1="120.0" y1="244.0" x2="120.0" y2="256.0" stroke="#5a5a5a" stroke-width="1.5"/><text x="120.0" y="278.0" font-size="13" fill="#6a6a6a" text-anchor="middle">0s</text><line x1="300.0" y1="244.0" x2="300.0" y2="256.0" stroke="#5a5a5a" stroke-width="1.5"/><text x="300.0" y="278.0" font-size="13" fill="#6a6a6a" text-anchor="middle">2s</text><line x1="484.0" y1="244.0" x2="484.0" y2="256.0" stroke="#5a5a5a" stroke-width="1.5"/><text x="484.0" y="278.0" font-size="13" fill="#6a6a6a" text-anchor="middle">4s</text><line x1="664.0" y1="244.0" x2="664.0" y2="256.0" stroke="#5a5a5a" stroke-width="1.5"/><text x="664.0" y="278.0" font-size="13" fill="#6a6a6a" text-anchor="middle">6s</text><line x1="844.0" y1="244.0" x2="844.0" y2="256.0" stroke="#5a5a5a" stroke-width="1.5"/><text x="844.0" y="278.0" font-size="13" fill="#6a6a6a" text-anchor="middle">8s</text><line x1="1024.0" y1="244.0" x2="1024.0" y2="256.0" stroke="#5a5a5a" stroke-width="1.5"/><text x="1024.0" y="278.0" font-size="13" fill="#6a6a6a" text-anchor="middle">10s</text><line x1="1204.0" y1="244.0" x2="1204.0" y2="256.0" stroke="#5a5a5a" stroke-width="1.5"/><text x="1204.0" y="278.0" font-size="13" fill="#6a6a6a" text-anchor="middle">12s</text><line x1="300.0" y1="120.0" x2="300.0" y2="156.0" stroke="#d97757" stroke-width="2" marker-end="url(#arr-clay)"/><text x="300.0" y="112.0" font-size="14" fill="#d97757" text-anchor="middle" font-weight="600">首 token（TTFT）</text><text x="120.0" y="330.0" font-size="14" fill="#5a5a5a" text-anchor="start">prefill：整段输入并行计算，耗时随输入长度增长，但每个 token 很便宜</text><text x="120.0" y="356.0" font-size="14" fill="#5a5a5a" text-anchor="start">decode：每步只算一个新 token，要读一遍全部权重和 KV Cache，步与步之间无法并行</text><text x="120.0" y="382.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="600">总耗时 ≈ 输入长度 / prefill 速度 + 输出长度 / decode 速度</text><text x="120.0" y="420.0" font-size="13" fill="#6a6a6a" text-anchor="start">输入翻倍，首 token 晚 2 秒；输出翻倍，整体晚 10 秒。输出 token 的价格通常是输入的 4 到 5 倍，原因同此</text></svg>