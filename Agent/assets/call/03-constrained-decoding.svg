<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1200" height="530" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">约束解码：把不合语法的 token 屏蔽掉</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">schema 规定 temp 是数字。模型本来最想输出引号（准备写字符串），被屏蔽后只能在数字里选</text><rect x="48.0" y="116.0" width="380.0" height="380.0" rx="12" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="70.0" y="150.0" font-size="15" fill="#6a6a6a" text-anchor="start" font-weight="700">schema</text><text x="70.0" y="184.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">{ "temp": number,</text><text x="70.0" y="210.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">  "sky": string }</text><text x="70.0" y="264.0" font-size="15" fill="#6a6a6a" text-anchor="start" font-weight="700">已经生成的文本</text><rect x="70.0" y="280.0" width="336.0" height="44.0" rx="8" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/><text x="86.0" y="308.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">{"temp": </text><rect x="150.0" y="288.0" width="3.0" height="28.0" rx="0" fill="#d97757" stroke="#d97757" stroke-width="0"/><text x="70.0" y="364.0" font-size="15" fill="#6a6a6a" text-anchor="start" font-weight="700">语法状态：这里只能出现</text><text x="70.0" y="390.0" font-size="15" fill="#1a1a1a" text-anchor="start">数字、负号</text><text x="70.0" y="440.0" font-size="14" fill="#5a5a5a" text-anchor="start">每生成一个 token，状态机前进一步，</text><text x="70.0" y="464.0" font-size="14" fill="#5a5a5a" text-anchor="start">下一步的合法集合随之改变</text><text x="470.0" y="150.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">原始分布</text><rect x="470.0" y="176.0" width="64.0" height="40.0" rx="6" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="502.0" y="202.0" font-size="16" fill="#6a6a6a" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">"</text><rect x="548.0" y="182.0" width="147.6" height="28.0" rx="4" fill="#ece9e4" stroke="#e2ddd6" stroke-width="1.5"/><text x="703.6" y="202.0" font-size="14" fill="#6a6a6a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">0.41</text><rect x="470.0" y="236.0" width="64.0" height="40.0" rx="6" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/><text x="502.0" y="262.0" font-size="16" fill="#1a1a1a" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">2</text><rect x="548.0" y="242.0" width="79.2" height="28.0" rx="4" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/><text x="635.2" y="262.0" font-size="14" fill="#1a1a1a" text-anchor="start" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">0.22</text><rect x="470.0" y="296.0" width="64.0" height="40.0" rx="6" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="502.0" y="322.0" font-size="16" fill="#6a6a6a" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Microsoft YaHei',monospace">二</text><rect x="548.0" y="302.0" width="64.8" height="28.0" rx="4" fill="#ece9e4" stroke="#e2ddd6" stroke-width="1.5"/><text x="620.8" y="322.0" font-size="14" fill="#6a6a6a" text-anchor="