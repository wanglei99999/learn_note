<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560"><style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','SimHei',sans-serif}</style><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#5a5a5a"/></marker><marker id="arr-clay" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#d97757"/></marker><filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/></filter></defs><rect width="1240" height="560" fill="#f8f6f3"/><text x="48.0" y="50.0" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">一次 agent 评估由哪些部分组成</text><text x="48.0" y="80.0" font-size="15" fill="#6a6a6a" text-anchor="start">同一个任务跑多次（trial），每次留下完整的运行记录（transcript）和环境的最终状态（outcome），再由评分器打分</text><rect x="40.0" y="200.0" width="200.0" height="130.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="140.0" y="249.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">任务 task</text><text x="140.0" y="273.5" font-size="14" fill="#6a6a6a" text-anchor="middle">输入 + 成功标准</text><text x="140.0" y="295.5" font-size="14" fill="#6a6a6a" text-anchor="middle">+ 参考解</text><rect x="320.0" y="130.0" width="400.0" height="100.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="340.0" y="160.0" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="600">trial 1：模型 + harness 在干净的环境里跑一遍</text><rect x="340.0" y="176.0" width="170.0" height="40.0" rx="8" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="425.0" y="202.0" font-size="13" fill="#5a5a5a" text-anchor="middle">transcript</text><rect x="530.0" y="176.0" width="170.0" height="40.0" rx="8" fill="#9dd4c7" stroke="#e2ddd6" stroke-width="1.5"/><text x="615.0" y="202.0" font-size="13" fill="#5a5a5a" text-anchor="middle">outcome</text><line x1="242.0" y1="265.0" x2="316.0" y2="180.0" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#arr)"/><line x1="722.0" y1="180.0" x2="796.0" y2="265.0" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#arr)"/><rect x="320.0" y="250.0" width="400.0" height="100.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="340.0" y="280.0" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="600">trial 2：模型 + harness 在干净的环境里跑一遍</text><rect x="340.0" y="296.0" width="170.0" height="40.0" rx="8" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="425.0" y="322.0" font-size="13" fill="#5a5a5a" text-anchor="middle">transcript</text><rect x="530.0" y="296.0" width="170.0" height="40.0" rx="8" fill="#9dd4c7" stroke="#e2ddd6" stroke-width="1.5"/><text x="615.0" y="322.0" font-size="13" fill="#5a5a5a" text-anchor="middle">outcome</text><line x1="242.0" y1="265.0" x2="316.0" y2="300.0" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#arr)"/><line x1="722.0" y1="300.0" x2="796.0" y2="265.0" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#arr)"/><rect x="320.0" y="370.0" width="400.0" height="100.0" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2" filter="url(#soft)"/><text x="340.0" y="400.0" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="600">trial 3：模型 + harness 在干净的环境里跑一遍</text><rect x="340.0" y="416.0" width="170.0" height="40.0" rx="8" fill="#ffffff" stroke="#e2ddd6" stroke-width="1.5"/><text x="425.0" y="442.0" font-size="13" fill="#5a5a5a" text-anchor="middle">transcript</text><rect x="530.0" y="416.0" width="170.0" height="40.0" rx="8" fill="#9dd4c7" stroke="#e2ddd6" stroke-width="1.5"/><text x="615.0" y="442.0" font-size="13" fill="#5a5a5a" text-anchor="middle">outcome</text><line x1="242.0" y1="265.0" x2="316.0" y2="420.0" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#arr)"/><line x1="722.0" y1="420.0" x2="796.0" y2="265.0" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#arr)"/><rect x="800.0" y="170.0" width="200.0" height="190.0" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="900.0" y="238.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">评分器 grader</text><text x="900.0" y="262.5" font-size="14" fill="#6a6a6a" text-anchor="middle">代码：测试、比对</text><text x="900.0" y="284.5" font-size="14" fill="#6a6a6a" text-anchor="middle">模型：按评分标准打分</text><text x="900.0" y="306.5" font-size="14" fill="#6a6a6a" text-anchor="middle">人：抽查、校准</text><line x1="1002.0" y1="265.0" x2="1050.0" y2="265.0" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arr)"/><rect x="1054.0" y="205.0" width="160.0" height="120.0" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#soft)"/><text x="1134.0" y="249.5" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">指标</text><text x="1134.0" y="273.5" font-size="14" fill="#6a6a6a" text-anchor="middle">通过率</text><text x="1134.0" y="295.5" font-size="14" fill="#6a6a6a" text-anchor="middle">pass@k / pass^k</text><text x="620.0" y="520.0" font-size="15" fill="#d97757" text-anchor="middle" font-weight="600">评估“agent”，评的是模型和 harness 的组合，换掉任何一个，结果都可能变</text></svg>